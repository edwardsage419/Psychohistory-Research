name: R214 Exact 12 Sharp RDD Discrete Cutoff Worlds
on:
  push:
    paths:
      - 'research/R214/r214_exact_sharp_rdd.py'
      - '.github/workflows/r214-exact-sharp-rdd.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-rdd-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact 12-world RDD cutoff continuity and full noise source tests
        run: python research/R214/r214_exact_sharp_rdd.py --test
  full-finite-noise-original-archive:
    needs: dual-python-rdd-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit exact 192 original four-point source observations and independently validate
        run: |
          python research/R214/r214_exact_sharp_rdd.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from fractions import Fraction as F
          from pathlib import Path
          p=Path('research/R214')
          r=json.loads((p/'R214_EXACT_RESULTS.json').read_text())
          a=json.loads((p/'R214_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert r['catalogue_id']==a['catalogue_id']=='09-005'
          assert r['complete_source_worlds']==a['worlds']==12
          assert r['original_full_noise_source_records']==a['original_full_noise_source_records']==192
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert r['precommitted_estimator_noise_variance']=={
            'GLOBAL':'1','NEAREST':'2','TWO_SIDED_LINEAR':'10'}
          worlds={w['world']:w for w in r['worlds']}
          first=worlds['LINEAR_CAUSAL_TWO']
          second=worlds['BASELINE_STEP_FALSE_CAUSAL']
          assert first['full_joint_observable_distribution']==second['full_joint_observable_distribution']
          assert first['true_threshold_tau_exact']=='2'
          assert second['true_threshold_tau_exact']=='0'
          for world in r['worlds']:
            assert world['full_source_probability_sum']=='1'
            for m in ('GLOBAL','NEAREST','TWO_SIDED_LINEAR'):
              assert F(world[m]['MSE'])==F(world[m]['bias_squared_plus_variance'])
              assert F(world[m]['noise_variance'])==F(r['precommitted_estimator_noise_variance'][m])
          with (p/'R214_ALL_192_ORIGINAL_RDD_NOISE_SOURCES.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==192
          assert all(row['full_original_source_probability']=='1/16' for row in rows)
          for name,key in [('R214_EXACT_RESULTS.json','result_sha256'),
                           ('R214_ALL_192_ORIGINAL_RDD_NOISE_SOURCES.csv','source_sha256')]:
            assert a[key]==hashlib.sha256((p/name).read_bytes()).hexdigest()
          print('R214_EXACT_12_WORLDS_192_ORIGINAL_SIGN_NOISE_SOURCES_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R214-RDD-12-Worlds-192-Original-Noise-Sources
          path: |
            research/R214/R214_EXACT_RESULTS.json
            research/R214/R214_ALL_192_ORIGINAL_RDD_NOISE_SOURCES.csv
            research/R214/R214_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently commit genuine finite RDD source results to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R214/R214_EXACT_RESULTS.json research/R214/R214_ALL_192_ORIGINAL_RDD_NOISE_SOURCES.csv research/R214/R214_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R214): exact complete sharp RDD original source and observed equivalence evidence'
            git push origin HEAD:main
          fi
