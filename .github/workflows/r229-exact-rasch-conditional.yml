name: R229 Exact Rasch Conditional Likelihood and Item Connectedness
on:
  push:
    paths:
      - 'research/R229/r229_exact_rasch_conditional.py'
      - '.github/workflows/r229-exact-rasch-conditional.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-rasch-conditional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact eight-world source, local marginal, and CML test suite
        run: python research/R229/r229_exact_rasch_conditional.py --test
  complete-original-matrix-archive:
    needs: dual-python-rasch-conditional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit all 4096 complete matrices and independently audit source structure
        run: |
          python research/R229/r229_exact_rasch_conditional.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from collections import defaultdict
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R229')
          originals=list(csv.DictReader((d/'R229_ALL_4096_ORIGINAL_3X3_MATRIX_SOURCES.csv').open()))
          summary=json.loads((d/'R229_EXACT_RESULTS.json').read_text())
          receipt=json.loads((d/'R229_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(originals)==4096
          assert len(summary['world_results'])==8
          assert summary['catalogue_id']==receipt['catalogue_id']=='10-003'
          assert sum(F(r['original_probability'])>0 for r in originals)==3648
          assert sum(F(r['original_probability'])==0 for r in originals)==448
          dct={r['world']:r for r in summary['world_results']}
          for w in dct:
            rs=[r for r in originals if r['world']==w]
            assert len(rs)==512
            assert sum((F(r['original_probability']) for r in rs),F(0))==1
            assert len({r['original_full_nine_bit_matrix'] for r in rs})==512
            observed=defaultdict(F)
            for r in rs:
              observed[r['actual_observed_matrix']]+=F(r['original_probability'])
            assert {k:str(v) for k,v in observed.items()}==dct[w]['observed_matrix_probability_signature']
          assert dct['BASE_RASCH']['observed_matrix_probability_signature']==dct['SHIFT_ALIAS']['observed_matrix_probability_signature']
          assert dct['BASE_RASCH']['observed_matrix_probability_signature']!=dct['ABILITY_SPREAD_RASCH']['observed_matrix_probability_signature']
          for w in ('BASE_RASCH','SHIFT_ALIAS','ABILITY_SPREAD_RASCH'):
            for i in range(3):
              p=dct[w]['individual_conditional_odds'][i]
              assert p['score_one_item0_over_item1']=='2'
              assert p['score_one_item1_over_item2']=='2'
          for i in range(3):
            p=dct['ITEM_STRETCH_RASCH']['individual_conditional_odds'][i]
            assert p['score_one_item0_over_item1']=='4'
            assert p['score_one_item1_over_item2']=='4'
          assert [p['score_one_item0_over_item1'] for p in dct['TWO_PARAMETER_NONRASCH']['individual_conditional_odds']]==['4','2','1']
          assert [p['score_one_item1_over_item2'] for p in dct['ITEM_DIF_PERSON3']['individual_conditional_odds']]==['2','2','4']
          assert dct['DISCONNECTED_ITEM3']['individual_conditional_odds'][2]['observed_item_count']==1
          assert dct['DISCONNECTED_ITEM3']['individual_conditional_odds'][2]['score_one_item1_over_item2'] is None
          for file,key in [
            ('R229_ALL_4096_ORIGINAL_3X3_MATRIX_SOURCES.csv','source_sha256'),
            ('R229_EXACT_RESULTS.json','results_sha256')]:
            assert receipt[key]==hashlib.sha256((d/file).read_bytes()).hexdigest()
          assert summary['new_real_human_E2']==summary['new_real_historical_E3']==0
          print('R229_ALL_4096_ORIGINAL_RASCH_MATRICES_AND_CONDITIONAL_LIKELIHOOD_VALID')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R229-Frozen-Eight-Rasch-Matrix-Worlds
          path: |
            research/R229/R229_ALL_4096_ORIGINAL_3X3_MATRIX_SOURCES.csv
            research/R229/R229_EXACT_RESULTS.json
            research/R229/R229_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive complete original matrix sources on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R229/R229_ALL_4096_ORIGINAL_3X3_MATRIX_SOURCES.csv research/R229/R229_EXACT_RESULTS.json research/R229/R229_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R229): all 4096 finite original Rasch response matrices and conditional results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
