name: R088 independent original 171 group 64-missing sharp bounds and source failure evidence archive
on:
  push:
    paths:
      - '.github/workflows/r088-independent-original171-missing-sharp-E2-and-source-failure-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-sha-exact-independent-group-bounds-and-negative-evidence-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rerun all 81 synthetic first source, action missingness audit, and extremal 6-person group bounds tests
        run: |
          PYTHONPATH=research/R088 python -m unittest -v             research/R088/test_r088_original_171_groups_multilevel_global_cooperation_E2.py             research/R088/test_r088_phase_b_original_action_schema_only_audit.py             research/R088/test_r088_phase_c_original171_missing_sharp_bounds_E2.py
      - name: Reacquire first-party fixed original Git blob and check Phase B missing action source audit 2144-byte SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r088_original_second
          PYTHONPATH=research/R088 python             research/R088/r088_phase_b_original_action_schema_only_audit.py             --output /tmp/r088_original_second/source_schema.json
          test "$(wc -c < /tmp/r088_original_second/source_schema.json | tr -d '[:space:]')" = 2144
          printf '%s  %s\n'             b52f6313f40beecdb761c5bb9b6013b318700c2e1c2f8f4d0a7682efee5edf18             /tmp/r088_original_second/source_schema.json | sha256sum --check --status
          python - <<'PY'
          import json,pathlib
          v=json.loads(pathlib.Path('/tmp/r088_original_second/source_schema.json').read_bytes())
          s=v['schema_review']
          assert s['total_person_round_slots_seen']==20520
          assert s['categories']=={"EXACT":20456,"CASE_OR_SPACE_ONLY":0,"DECLARED_COMMON_NON_EQUIVALENT":0,"EMPTY_MISSING":64,"UNRECOGNIZED_OTHER":0}
          assert v["first_CI_R088_real_source_fail_retained"]
          assert not v["actual_global_cooperation_rate_recomputed"]
          PY
      - name: Reacquire entire fixed original human 171 complete groups and author source scripts; assert exact E2 bytes/SHA from first group outcomes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R088 python             research/R088/r088_phase_c_original171_missing_sharp_bounds_E2.py             --output /tmp/r088_original_second/real_anonymous_E2.json
          test "$(wc -c < /tmp/r088_original_second/real_anonymous_E2.json | tr -d '[:space:]')" = 65424
          printf '%s  %s\n'             2b0f76fa8f7d1a42d2f91508c4acf52c0a7c0fc9523801ec1d9759559d8fb67e             /tmp/r088_original_second/real_anonymous_E2.json | sha256sum --check --status
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('/tmp/r088_original_second/real_anonymous_E2.json');b=p.read_bytes()
          v=json.loads(b)
          assert v["status"]=="R088_ORIGINAL171_GROUP_MISSING_SHARP_INTERVAL_E2_EXECUTED"
          z=v["original_author_real_human_sharp_bounds"]
          assert z["original_complete_six_person_groups"]==171
          assert z["original_actor_round_action_opportunities"]==20520
          assert z["original_missing_human_action_slots"]==64
          assert z["original_observed_human_action_slots"]==20456
          assert all(q["global_cooperation_over_all20_lower"]<=q["global_cooperation_over_all20_upper"]
            for q in z["original_three_treatments_sharp_source_bounded_group_results"].values())
          assert z["pre_frozen_three_treatment_global_group_mean_pair_bounds"]["GlobalBoost_minus_Balanced"]["missing_robust_sign"]=="POSITIVE"
          assert not v["original_human_action_rows_or_group_IDs_exported"]
          assert v["statistics_are_missingness_extremal_bounds_not_confidence_intervals"]
          assert v["PESEN_v0.1"]=="FROZEN"
          print("R088_SECOND_ORIGINAL_HUMAN_171GROUPS_FULLBYTE_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - name: Permanently archive ONLY anonymous 3-treatment sharp bounds and source-missingness failure receipt
        shell: bash
        run: |
          set -euo pipefail
          dest1=research/R088/R088_ORIGINAL171_GLOBAL_COOPERATION_64_MISSING_SHARP_BOUNDS_E2_RESULTS.json
          dest2=research/R088/R088_ORIGINAL20520_ACTION_LABEL_MISSINGNESS_E1_SOURCE_RECEIPT.json
          mkdir -p research/R088
          cp /tmp/r088_original_second/real_anonymous_E2.json "$dest1"
          cp /tmp/r088_original_second/source_schema.json "$dest2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest1" "$dest2"
          git commit -m "results(R088): independently verify original 171 groups 64-missing sharp bounds and original action schema first-failure"
          git push origin HEAD:main
      - if: always()
        run: rm -rf /tmp/r088_original_second
