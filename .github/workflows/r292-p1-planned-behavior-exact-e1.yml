name: R292 P1 Planned Behavior Actual Control Exact E1
on:
  push:
    paths:
      - 'research/R292/r292_exact_planned_behavior.py'
      - 'research/catalogue_audit/independent_r292_source_audit.py'
      - '.github/workflows/r292-p1-planned-behavior-exact-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-python-exact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute 106 exact model tests
        run: python research/R292/r292_exact_planned_behavior.py --test
      - name: Generate and independently reconstruct 256 original sources
        run: |
          python research/R292/r292_exact_planned_behavior.py --emit
          python research/catalogue_audit/independent_r292_source_audit.py --test
          python research/catalogue_audit/independent_r292_source_audit.py --audit
  independent-archive:
    needs: two-python-exact-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently rerun all artificial source risks without model imports
        run: |
          python research/R292/r292_exact_planned_behavior.py --emit
          python research/catalogue_audit/independent_r292_source_audit.py --test
          python research/catalogue_audit/independent_r292_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: R292-TPB-256-Complete-Control-Feasibility-Sources
          path: |
            research/R292/R292_ALL_256_ORIGINAL_TPB_CONTROL_FEASIBILITY_SOURCES.csv
            research/R292/R292_EXACT_CONTROL_RESULTS.json
            research/R292/R292_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive verified original 256 sources and source SHA
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R292/R292_ALL_256_ORIGINAL_TPB_CONTROL_FEASIBILITY_SOURCES.csv research/R292/R292_EXACT_CONTROL_RESULTS.json research/R292/R292_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R292): verified exact 256 TPB control and feasibility source cells'
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo R292_256_SOURCE_BYTES_AND_RESULTS_ARCHIVED
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
