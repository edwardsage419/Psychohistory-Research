name: R235 Exact Differential Item Functioning and MH Matching Limits
on:
  push:
    paths:
      - 'research/R235/r235_exact_differential_item_functioning.py'
      - '.github/workflows/r235-exact-dif.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-exact-dif-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact MH score matching, oracle ability DIF and scale reanchoring tests
        run: python research/R235/r235_exact_differential_item_functioning.py --test
  full-original-response-source-archive:
    needs: dual-python-exact-dif-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit all 432 structural patterns and independently check MH versus true oracle
        run: |
          python research/R235/r235_exact_differential_item_functioning.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          from collections import defaultdict
          d=Path('research/R235')
          allrows=list(csv.DictReader((d/'R235_ALL_432_ORIGINAL_DIF_ITEM_RESPONSE_SOURCES.csv').open()))
          out=json.loads((d/'R235_EXACT_RESULTS.json').read_text())
          receipt=json.loads((d/'R235_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(allrows)==432 and len(out['world_results'])==9
          assert out['original_catalogue_id']==receipt['original_catalogue_id']=='10-009'
          worlds={w['world']:w for w in out['world_results']}
          for w,v in worlds.items():
            rows=[r for r in allrows if r['world']==w]
            assert len(rows)==48
            assert sum((F(r['original_source_probability']) for r in rows),F(0))==1
            assert len({(r['observed_group_G'],r['oracle_latent_ability_index_k'],
                         r['observed_Y1'],r['observed_Y2'],r['observed_Y3']) for r in rows})==48
            assert all(F(r['original_source_probability'])>0 for r in rows)
            assert len(v['oracle_fixed_ability_group1_minus_group0_focal_probabilities'])==3
          base=worlds['BASE_NO_DIF']
          mix=worlds['ABILITY_MIX_NO_DIF']
          assert base['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0']=='1'
          assert mix['oracle_fixed_ability_group1_minus_group0_focal_probabilities']==['0','0','0']
          assert F(mix['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0'])>1
          assert mix['observable_focal_success_rates_by_group']==['1/2','5/9']
          non=worlds['NONUNIFORM_FOCAL_DISCRIMINATION']
          assert non['oracle_fixed_ability_group1_minus_group0_focal_probabilities']==['-2/15','0','2/15']
          assert non['observable_focal_success_rates_by_group']==['1/2','1/2']
          assert non['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0']=='1'
          assert non['observable_focal_success_differences_by_anchor_score']==['-18/325','0','18/325']
          for w in ('ANCHOR_ITEM1_DRIFT','ANCHOR_ITEM3_DRIFT'):
            a=worlds[w]
            assert a['oracle_fixed_ability_group1_minus_group0_focal_probabilities']==['0','0','0']
            assert F(a['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0'])>1
          assert worlds['GLOBAL_REANCHOR_ALIAS']['full_observed_group_three_item_joint_signature']==base['full_observed_group_three_item_joint_signature']
          assert F(worlds['UNIFORM_FOCAL_HARDER']['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0'])<1
          assert F(worlds['UNIFORM_FOCAL_EASIER']['observable_mantel_haenszel_common_odds_ratio_group1_vs_group0'])>1
          for fn,key in [('R235_ALL_432_ORIGINAL_DIF_ITEM_RESPONSE_SOURCES.csv','source_sha256'),
                         ('R235_EXACT_RESULTS.json','results_sha256')]:
            assert hashlib.sha256((d/fn).read_bytes()).hexdigest()==receipt[key]
          assert receipt['new_real_human_E2']==receipt['new_real_historical_E3']==0
          print('R235_ALL_432_DIF_SOURCES_AND_EXACT_MH_FALSE_POSITIVE_NEGATIVE_BOUNDS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R235-All-Nine-DIF-Original-Source-Worlds
          path: |
            research/R235/R235_ALL_432_ORIGINAL_DIF_ITEM_RESPONSE_SOURCES.csv
            research/R235/R235_EXACT_RESULTS.json
            research/R235/R235_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive original DIF source universes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R235/R235_ALL_432_ORIGINAL_DIF_ITEM_RESPONSE_SOURCES.csv research/R235/R235_EXACT_RESULTS.json research/R235/R235_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R235): all 432 exact DIF item response source atoms and MH tables'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
