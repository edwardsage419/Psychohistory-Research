name: R254 Signed Three Node Random Matrix Exact Spectral and Walk Audit
on:
  push:
    paths:
      - 'research/R254/r254_exact_signed_spectral.py'
      - '.github/workflows/r254-exact-spectral.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-spectral-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact random symmetric matrix eigenvalue and independent walks tests
        run: python research/R254/r254_exact_signed_spectral.py --test
  full-original-spectral-source-archive:
    needs: dual-python-spectral-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and independently audit 18432 original random matrix source atoms
        run: |
          python research/R254/r254_exact_signed_spectral.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          from fractions import Fraction as F
          d=Path('research/R254')
          rows=list(csv.DictReader((d/'R254_ALL_18432_ORIGINAL_SIGNED_SPECTRAL_SOURCES.csv').open()))
          j=json.loads((d/'R254_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R254_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==18432 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-014'
          assert j['prescore_freeze_commit']=='74740c27108b2a203c5860824f6862a0866d69d3'
          assert j['no_infinite_random_matrix_theory_or_real_diffusion_replicated'] is True
          worlds={w['world']:w for w in j['world_results']}
          expected={
            'EMPTY_P0':('0','0','0'),
            'EDGE_01_P1':('1','1','0'),
            'PATH_01_12_P1':('2','0','1'),
            'TRIANGLE_P1':('4','2','0'),
            'ER_TRIANGLE_P_QUARTER':('49/64','29/64','9/64'),
            'ER_TRIANGLE_P_HALF':('13/8','5/8','3/8'),
            'ER_TRIANGLE_P_THREE_QUARTER':('171/64','63/64','27/64'),
            'SIGNED_ER_TRIANGLE_P_HALF':('13/8','1/2','3/8'),
            'SIGNED_TRIANGLE_P1':('4','1','0')}
          assert set(worlds)==set(expected)
          for w,r in worlds.items():
              sub=[z for z in rows if z['world']==w]
              assert len(sub)==2048
              keys=['oracle_original_edge_R'+e+s for e in ('01','02','12') for s in ('a','b')]+['oracle_original_initial_seed_S'+str(i) for i in range(3)]+['observed_time_step_n']
              assert len({tuple(z[k] for k in keys) for z in sub})==2048
              assert all(F(z['original_complete_source_mass'])==F(1,2048) for z in sub)
              assert sum((F(z['original_complete_source_mass']) for z in sub),F(0))==1
              rho,a,b=expected[w]
              assert r['exact_expected_spectral_radius_squared']==rho
              assert r['exact_expected_largest_algebraic_eigenvalue']=={'rational':a,'sqrt2_coefficient':b}
              assert r['all_observed_matrix_charpolynomials_and_cayley_hamilton_verified']
              assert r['all_source_vectors_direct_matvec_vs_independent_walks_verified']
              assert r['exact_independent_bernoulli_edge_mask_probability_parity']
              assert sum((F(x) for x in r['complete_sixbit_edge_weight_joint'].values()),F(0))==1
              mean_rho=sum((F(z['oracle_spectral_radius_squared'],2048) for z in sub),F(0))
              mean_a=sum((F(z['oracle_largest_eigenvalue_rational_coefficient'],2048) for z in sub),F(0))
              mean_b=sum((F(z['oracle_largest_eigenvalue_sqrt2_coefficient'],2048) for z in sub),F(0))
              assert (str(mean_rho),str(mean_a),str(mean_b))==(rho,a,b)
              for z in sub:
                  e=tuple(int(z['observed_edge_weight_w'+n]) for n in ('01','02','12'))
                  assert int(z['oracle_spectral_radius_squared'])==sum(bool(v) for v in e)+(1 if all(e) else 0)
          plus=worlds['ER_TRIANGLE_P_HALF'];minus=worlds['SIGNED_ER_TRIANGLE_P_HALF']
          assert plus['exact_expected_spectral_radius_squared']==minus['exact_expected_spectral_radius_squared']
          assert F(plus['exact_expected_largest_algebraic_eigenvalue']['rational'])-F(minus['exact_expected_largest_algebraic_eigenvalue']['rational'])==F(1,8)
          for fn,key in [('R254_ALL_18432_ORIGINAL_SIGNED_SPECTRAL_SOURCES.csv','source_sha256'),('R254_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/fn).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R254_ALL_18432_ORIGINAL_RANDOM_SIGNED_MATRIX_SPECTRA_AND_WALKS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R254-Nine-True-Finite-Random-Matrix-Spectral-Source-Worlds
          path: |
            research/R254/R254_ALL_18432_ORIGINAL_SIGNED_SPECTRAL_SOURCES.csv
            research/R254/R254_EXACT_RESULTS.json
            research/R254/R254_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all 18432 finite spectral source atoms
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R254/R254_ALL_18432_ORIGINAL_SIGNED_SPECTRAL_SOURCES.csv research/R254/R254_EXACT_RESULTS.json research/R254/R254_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R254): all 18432 signed random matrix exact source atoms'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R254_ALL_18432_SOURCE_ATOMS_PERMANENTLY_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
