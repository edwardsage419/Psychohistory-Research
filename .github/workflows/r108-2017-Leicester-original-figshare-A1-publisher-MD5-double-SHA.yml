name: R108 A1 genuine 2017 Leicester 300-round prisoner dilemma original MD5 CSV double SHA
on:
  push:
    paths:
      - '.github/workflows/r108-2017-Leicester-original-figshare-A1-publisher-MD5-double-SHA.yml'
      - 'research/R108/r108_phase_a1_original_2017_Leicester_fixed_pair_CSV_MD5_double_SHA_header_only.py'
      - 'research/R108/test_r108_phase_a1_original_2017_Leicester_fixed_pair_CSV_MD5_double_SHA_header_only.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pure-synthetic-before-original-human-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run fifteen original publisher MD5 SHA header and privacy synthetic tests
        run: PYTHONPATH=research/R108 python -m unittest -v research/R108/test_r108_phase_a1_original_2017_Leicester_fixed_pair_CSV_MD5_double_SHA_header_only.py
  original-publisher-2017-whole-file-double-verification:
    needs: pure-synthetic-before-original-human-source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original published 36526B MD5 by two separate full official downloads and header only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r108_A1
          PYTHONPATH=research/R108 python research/R108/r108_phase_a1_original_2017_Leicester_fixed_pair_CSV_MD5_double_SHA_header_only.py --output /tmp/r108_A1/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r108_A1/receipt.json').read_text())
          assert x['status']=='R108_A1_LEICESTER_2017_PUBLISHER_MD5_VERIFIED_DOUBLE_SOURCE_CSV_E1'
          assert x['original_file_ID']==18370526
          assert x['original_source_file_bytes']==36526
          assert x['original_publisher_whole_MD5_verified']=='7afc755c293dc261d696d1b3f9ba796a'
          assert x['two_independent_official_publisher_downloads_byte_identical'] is True
          assert x['original_participant_or_choice_cells_dereferenced'] is False
          assert x['original_human_model_scores']==0
          print('R108_TRUE_PUBLISHED_2017_CSV_SHA',x['source_whole_file_SHA256'],x['original_csv_column_count'],x['original_CSV_physical_data_lines_unparsed'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r108-2017-published-university-repeated-dyad-CSV-firstparty
          path: /tmp/r108_A1/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve strict published MD5 source proof or original bounded rejection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r108_A1/receipt.json
          dst=research/R108/R108_PHASE_A1_LIVE_CI_LEICESTER_ORIGINAL_DYADIC_CSV_PUBLISHED_MD5_DOUBLE_SHA_HEADER_RECEIPT.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib,re
          x=json.loads(pathlib.Path('/tmp/r108_A1/receipt.json').read_text())
          assert x['research_id']=='R108' and x['phase']=='A1' and x['PESEN_v0_1']=='FROZEN' and x['original_human_model_scores']==0
          assert x['status'] in ('R108_A1_ORIGINAL_FIRSTPARTY_CSV_SOURCE_FAIL_CLOSED','R108_A1_LEICESTER_2017_PUBLISHER_MD5_VERIFIED_DOUBLE_SOURCE_CSV_E1')
          fields={'research_id','phase','status','safe_failure','original_dataset_article_ID','original_file_ID','original_source_file_bytes','original_publisher_whole_MD5_verified','source_whole_file_SHA256','original_csv_header_columns','original_csv_column_count','original_CSV_physical_data_lines_unparsed','original_participant_or_choice_cells_dereferenced','original_human_model_scores','PESEN_v0_1','two_independent_official_publisher_downloads_byte_identical'}
          assert set(x).issubset(fields)
          if 'source_whole_file_SHA256' in x:
            assert re.fullmatch('[a-f0-9]{64}',x['source_whole_file_SHA256'])
            assert x['original_participant_or_choice_cells_dereferenced'] is False
            assert len(x['original_csv_header_columns'])==x['original_csv_column_count']
            assert all(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_ .\-]{0,99}',v) for v in x['original_csv_header_columns'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R108 A1): firstparty 2017 UK 300round fixed pair original CSV official MD5 SHA double source or bounded rejection"
          git pull --rebase origin main
          git push origin HEAD:main
