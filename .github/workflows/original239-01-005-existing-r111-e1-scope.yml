name: Original239 01-005 existing R111 bounded E1 scope audit
on:
  push:
    paths:
      - 'research/catalogue_audit/independent_original239_01_005_r111_scope_audit.py'
      - '.github/workflows/original239-01-005-existing-r111-e1-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/R111/test_r111_mcfadden_random_utility_conditional_logit.py -v
  python312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/R111/test_r111_mcfadden_random_utility_conditional_logit.py -v
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/independent_original239_01_005_r111_scope_audit.py
