name: Original239 P2 R333 Triadic Crosswalk v5.1
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p2_r333_crosswalk_v5_1.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v5.1_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_11_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - '.github/workflows/original-239-p2-r333-crosswalk-v51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/catalogue_audit/verify_p2_r333_crosswalk_v5_1.py
  index312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/verify_p2_r333_crosswalk_v5_1.py
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/independent_r333_triadic_audit.py
      - run: python research/catalogue_audit/verify_p2_r333_crosswalk_v5_1.py
