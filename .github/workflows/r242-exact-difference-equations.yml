name: R242 Exact Difference Equations and Measurement Aliases
on:
  push:
    paths:
      - 'research/R242/r242_exact_difference_equations.py'
      - '.github/workflows/r242-exact-difference-equations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-finite-difference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact polynomial recurrences and all observational aliases
        run: python research/R242/r242_exact_difference_equations.py --test
  full-original-difference-source-archive:
    needs: dual-python-finite-difference-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit all 180 sources and audit independent discrete polynomial reference
        run: |
          python research/R242/r242_exact_difference_equations.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R242')
          src=list(csv.DictReader((d/'R242_ALL_180_ORIGINAL_DIFFERENCE_EQUATION_ATOMS.csv').open()))
          j=json.loads((d/'R242_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R242_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(src)==180 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-002'
          by={x['world']:x for x in j['world_results']}
          for w,x in by.items():
              rows=[r for r in src if r['world']==w]
              assert len(rows)==20
              assert len({(r['observed_initial_cohort'],r['observed_step_n']) for r in rows})==20
              assert all(F(r['original_source_probability'])==F(1,20) for r in rows)
              assert sum((F(r['original_source_probability']) for r in rows),F(0))==1
              assert x['polynomial_composition_vs_recursion_verified']
              assert x['full_hidden_semigroup_horizon4_verified']
              assert len(x['exact_visible_joint'])==20
          for pair in [('CONTRACTION_HALF','CONTRACTION_SENSOR_ALIAS'),
                       ('CONTRACTION_HALF','CONTRACTION_DOUBLE_COORDINATE_ALIAS'),
                       ('EXPANSION_DOUBLE','EXPANSION_SENSOR_ALIAS'),
                       ('SIGN_FLIP_SQUARED_SENSOR','STATIONARY_SQUARED_SENSOR')]:
              assert by[pair[0]]['exact_visible_joint']==by[pair[1]]['exact_visible_joint']
              assert by[pair[0]]['observed_initial_sensitivity_for_initial_one_by_steps']==by[pair[1]]['observed_initial_sensitivity_for_initial_one_by_steps']
          assert by['CONTRACTION_HALF']['observed_output_for_initial_one_by_steps'][-1]=='1/16'
          assert by['CONTRACTION_SENSOR_ALIAS']['oracle_true_hidden_for_initial_one_by_steps'][-1]=='1'
          assert by['EXPANSION_DOUBLE']['observed_output_for_initial_one_by_steps'][-1]=='16'
          assert by['EXPANSION_SENSOR_ALIAS']['oracle_true_hidden_for_initial_one_by_steps'][-1]=='1'
          assert by['SIGN_FLIP_SQUARED_SENSOR']['oracle_true_hidden_for_initial_one_by_steps'][1]=='-1'
          assert by['STATIONARY_SQUARED_SENSOR']['oracle_true_hidden_for_initial_one_by_steps'][1]=='1'
          assert by['LOGISTIC_R2']['observed_initial_half_trajectory']==['1/2']*5
          assert by['LOGISTIC_R4']['observed_initial_half_trajectory']==['1/2','1','0','0','0']
          assert by['LOGISTIC_R4']['observed_initial_quarter_trajectory']==['1/4','3/4','3/4','3/4','3/4']
          for path,key in [('R242_ALL_180_ORIGINAL_DIFFERENCE_EQUATION_ATOMS.csv','source_sha256'),
                           ('R242_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/path).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R242_180_ALL_ORIGINAL_FINITE_DIFFERENCE_ATOMS_AND_POLYNOMIAL_ALIASES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R242-Nine-Exact-Difference-Equation-Source-Worlds
          path: |
            research/R242/R242_ALL_180_ORIGINAL_DIFFERENCE_EQUATION_ATOMS.csv
            research/R242/R242_EXACT_RESULTS.json
            research/R242/R242_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Archive complete source atoms permanently to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R242/R242_ALL_180_ORIGINAL_DIFFERENCE_EQUATION_ATOMS.csv research/R242/R242_EXACT_RESULTS.json research/R242/R242_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R242): 180 complete discrete difference original atoms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
