name: R202 Exact Discrete AFT Censoring and Independent Time
on:
  push:
    paths:
      - 'research/R202/r202_exact_discrete_aft.py'
      - '.github/workflows/r202-exact-discrete-aft.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-python-aft-censor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exact AFT source likelihood, censoring, and independent future risk
        run: python research/R202/r202_exact_discrete_aft.py --test
  permanent-six-world-archive:
    needs: two-python-aft-censor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and check all original censored 96 samples and six independent future evaluations
        run: |
          python research/R202/r202_exact_discrete_aft.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path('research/R202')
          r=json.loads((p/'R202_EXACT_RESULTS.json').read_text())
          a=json.loads((p/'R202_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          with (p/'R202_ALL_96_ORIGINAL_CENSORED_TRAINING_WORLDS.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==96 and len(r['worlds'])==6
          assert a['total_original_train_source_records']==96 and a['total_worlds']==6
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert all(w['training_source_probability_sum']=='1' for w in r['worlds'])
          assert r['diagnostics']['a2_discrete_hazard_ratio_at_time2'] != r['diagnostics']['a2_discrete_hazard_ratio_at_time4']
          assert a['result_sha256']==hashlib.sha256((p/'R202_EXACT_RESULTS.json').read_bytes()).hexdigest()
          assert a['original_source_csv_sha256']==hashlib.sha256((p/'R202_ALL_96_ORIGINAL_CENSORED_TRAINING_WORLDS.csv').read_bytes()).hexdigest()
          print('R202_EXACT_AFT_E1_6_WORLDS_96_RECORDS_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R202-Exact-Discrete-AFT-96-Full-Source-Samples
          path: |
            research/R202/R202_EXACT_RESULTS.json
            research/R202/R202_ALL_96_ORIGINAL_CENSORED_TRAINING_WORLDS.csv
            research/R202/R202_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive complete artificial AFT study on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R202/R202_EXACT_RESULTS.json research/R202/R202_ALL_96_ORIGINAL_CENSORED_TRAINING_WORLDS.csv research/R202/R202_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R202): complete exact AFT censored training and independent time-threshold results'
            git push origin HEAD:main
          fi
