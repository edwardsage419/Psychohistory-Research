name: R118 independent reachable-state bounded E1 audit
on:
  push:
    branches: [main]
    paths:
      - 'research/validation/verify_r118_bfs_reachability_independent.py'
      - 'research/validation/R118_BFS_REACHABILITY_ENUMERATION_2026-10-24.csv'
      - '.github/workflows/r118_independent_bfs_reachability_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal_independent_reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Replay 700 constructed reachable-state records against original source
        run: python research/validation/verify_r118_bfs_reachability_independent.py
      - name: Replay original 44 bounded mathematical tests
        run: |
          set -euo pipefail
          PYTHONPATH=research/R118 python -m unittest -v research/R118/test_r118_granovetter_1978_finite_threshold_participation.py 2>&1 | tee /tmp/r118_original_tests.log
          python - <<'PY'
          import pathlib,re
          text=pathlib.Path('/tmp/r118_original_tests.log').read_text()
          assert re.findall(r'Ran (\d+) tests? in',text)==['44']
          assert re.search(r'\nOK\s*$',text)
          print('R118_ORIGINAL_44_TESTS_PASS')
          PY
