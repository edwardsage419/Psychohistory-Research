name: R298 Model Based Revaluation 64 Action Sources E1
on:
  push:
    paths:
      - 'research/R298/r298_exact_model_based_revaluation.py'
      - 'research/catalogue_audit/independent_r298_source_audit.py'
      - '.github/workflows/r298-p1-model-based-revaluation-known-model-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 269 exact artificial model-based planning tests
        run: python research/R298/r298_exact_model_based_revaluation.py --test
      - name: Emit all original 64 action sources and independently audit all 32 worlds
        run: |
          python research/R298/r298_exact_model_based_revaluation.py --emit
          python research/catalogue_audit/independent_r298_source_audit.py --test
          python research/catalogue_audit/independent_r298_source_audit.py --audit
  independent-source-permanent-archive:
    needs: dual-python-math
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact source, information and regret audit
        run: |
          python research/R298/r298_exact_model_based_revaluation.py --emit
          python research/catalogue_audit/independent_r298_source_audit.py --test
          python research/catalogue_audit/independent_r298_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: R298-32-Worlds-64-Original-Planning-Action-Sources
          path: |
            research/R298/R298_ALL_64_ORIGINAL_REVALUATION_ACTION_SOURCES.csv
            research/R298/R298_EXACT_MODEL_BASED_REVALUATION_RESULTS.json
            research/R298/R298_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive model-based source CSV, results JSON and hash
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R298/R298_ALL_64_ORIGINAL_REVALUATION_ACTION_SOURCES.csv research/R298/R298_EXACT_MODEL_BASED_REVALUATION_RESULTS.json research/R298/R298_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R298): exact revaluation model and cached action sources'
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then echo R298_SOURCE_ACTIONS_PERMANENT; exit 0; fi
              sleep 2
            done
            exit 1
          fi
