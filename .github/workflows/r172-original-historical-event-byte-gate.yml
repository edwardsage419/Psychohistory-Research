name: R172 CC0 Original Historical Event TSV Byte Audit
on:
  push:
    paths:
      - 'research/R172/r172_original_event_source_bytes_audit.py'
      - '.github/workflows/r172-original-historical-event-byte-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-event-rows-no-model-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch CC0 original historical panel and original replication code from official file identifiers
        run: |
          cd research/R172
          python r172_original_event_source_bytes_audit.py
      - name: Enforce checksum completeness and independent-prediction exclusion
        run: |
          cd research/R172
          python - <<'PY'
          import json,hashlib,pathlib
          j=json.loads(pathlib.Path('R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json').read_text())
          assert j['raw_country_year_rows_scored_for_predictions']==0
          assert not j['event_and_censoring_definitions_validated']
          assert not j['original_historical_regime_hazard_fitted']
          assert not j['out_of_sample_predictions_scored']
          for f in j['file_records']:
              if f['status']=='ORIGINAL_FILE_BYTES_VERIFIED':
                  path=pathlib.Path('source')/f['local_filename']
                  raw=path.read_bytes()
                  assert len(raw)==f['expected_original_bytes']
                  assert hashlib.md5(raw).hexdigest()==f['expected_source_MD5']
                  assert hashlib.sha256(raw).hexdigest()==f['actual_SHA256']
          print('R172_RISK_SET_NOT_YET_VERIFIED',j['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R172-CC0-original-historical-event-data-byte-source
          path: |
            research/R172/source/
            research/R172/R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json
          retention-days: 90
