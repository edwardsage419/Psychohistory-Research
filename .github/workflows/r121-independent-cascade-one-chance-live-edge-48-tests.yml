name: R121 KKT2003 independent cascade one chance versus independently live directed edges

on:
  push:
    paths:
      - '.github/workflows/r121-independent-cascade-one-chance-live-edge-48-tests.yml'
      - 'research/R121/r121_kkt_2003_independent_cascade_exact.py'
      - 'research/R121/test_r121_kkt_2003_independent_cascade_exact.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-independent-cascade-exact-math:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actually execute 48 independently named IC unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R121 python -m unittest -v \
            research/R121/test_r121_kkt_2003_independent_cascade_exact.py \
            2>&1 | tee /tmp/r121_unittest.log
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r121_unittest.log').read_text()
          assert re.findall(r'Ran (\d+) tests? in',log)==['48'],('R121_TEST_COUNT_NOT_48',log[-1500:])
          assert re.search(r'\nOK\s*$',log),'R121_TESTS_DID_NOT_PASS'
          print('R121_REAL_48_UNIT_TESTS_PASSED')
          PY
      - name: Independent repeat 1060 whole-set distributions and analytic IC versus LT contrast
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R121 python - <<'PY'
          import hashlib,json,pathlib
          from fractions import Fraction as F
          import r121_kkt_2003_independent_cascade_exact as m
          checks=m.fixed_primary_mechanism_cases()
          assert checks['single_source0_expected']=='3/2'
          assert checks['single_source1_expected']=='5/4'
          assert checks['both_sources_target_activation_probability']=='5/8'
          assert checks['both_sources_expected']=='21/8'
          assert checks['both_edges_live_joint_probability']=='1/8'
          assert checks['same_weights_as_LT_R120_both_sources_expected']=='11/4'
          assert checks['four_chain_seed0_expected']=='25/12'
          assert checks['four_chain_last_node_probability']=='1/4'
          assert checks['three_cycle_seed0_expected']=='7/4'
          assert m.deterministic_three_round_trace()==(
              frozenset((0,)),frozenset((0,1)),frozenset((0,1,2)))
          audit=m.exhaustive_small_directed_graphs()
          assert audit=={'1':4,'2':32,'3':1024},audit
          assert sum(audit.values())==1060
          assert checks['human_E2_observations']==0
          root=pathlib.Path('research/R121')
          source_names=[
            'r121_kkt_2003_independent_cascade_exact.py',
            'test_r121_kkt_2003_independent_cascade_exact.py',
            'R121_KKT_2003_INDEPENDENT_CASCADE_LIVE_EDGE_ONE_CHANCE_FIRSTPARTY_SCIENTIFIC_REPORT_2026-10-19.md'
          ]
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in source_names}
          receipt={
            'research_id':'R121','phase':'A',
            'status':'R121_KKT2003_ONE_CHANCE_IC_INDEPENDENT_EDGE_48_UNIT_1060_DISTRIBUTION_CASES_PASS',
            'original_candidate_catalogue_id':'04-004','priority':'P0',
            'first_party_original_2003_DOI':'10.1145/956750.956769',
            'primary_original_author_pdf':'https://www.cs.cornell.edu/home/kleinber/kdd03-inf.pdf',
            'original_pdf_zero_based_pages_read':[1,3],
            'primary_source_IC_claim':'2003 Claim2.3 same law of entire final active node set, Theorem2.2 expected influence submodular',
            '2001_Goldenberg_Libai_Muller_first_party_public_abstract_DOI':'10.1023/A:1011122126881',
            'comparison_methods':['exact chronological frontier Bernoulli single-shot event tree','all independent directed edge Bernoulli coin outcomes and directed reachability'],
            'original_source_mechanism_and_project_exact_counterexamples':checks,
            'independent_small_graph_degree_probability_seed_cases':audit,
            'total_exact_full_terminal_set_distribution_comparisons':sum(audit.values()),
            'actual_independent_unittests_executed':48,
            'independent_unittest_failures':0,
            'code_test_report_SHA256':hashes,
            '2003_author_original_large_collaboration_network_experiments_reproduced':False,
            '2001_original_marketing_network_behaviors_reanalyzed':False,
            'original_human_individual_behavior_data_read':False,
            'human_E2_independent_prediction_scores':0,
            'normative_information_psychological_causes_established':False,
            'R073':'FROZEN','PESEN_v0_1':'FROZEN'
          }
          target=root/'R121_PHASE_A_IC_48_TEST_1060_FULL_DISTRIBUTION_GITHUB_CI_ACCEPTANCE.json'
          target.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R121_SOURCE_AND_TEST_SHA256_RECEIPT',hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Archive only genuine machine-verifiable synthetic receipt to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R121/R121_PHASE_A_IC_48_TEST_1060_FULL_DISTRIBUTION_GITHUB_CI_ACCEPTANCE.json
          git commit -m "results(R121): KKT one-shot IC full distributions 48 tests and 1060 cases verified"
          git pull --rebase origin main
          git push origin HEAD:main
