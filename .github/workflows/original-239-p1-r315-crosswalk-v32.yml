name: Original239 R315 WS Crosswalk v3.2
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p1_r315_crosswalk_v3_2.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v3.2_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_30_P1_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - '.github/workflows/original-239-p1-r315-crosswalk-v32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact original239 source mapping invariants
        run: python research/catalogue_audit/verify_p1_r315_crosswalk_v3_2.py --test
  independent-source:
    needs: source-index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay WS 210 sources
        run: python research/catalogue_audit/independent_r315_source_audit.py --audit
      - name: Confirm all R315 source identities and 239 links
        run: python research/catalogue_audit/verify_p1_r315_crosswalk_v3_2.py --audit
