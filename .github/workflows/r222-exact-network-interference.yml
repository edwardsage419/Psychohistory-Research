name: R222 Exact Four-Node Network Interference and Randomization Policies
on:
  push:
    paths:
      - 'research/R222/r222_exact_network_interference.py'
      - '.github/workflows/r222-exact-network-interference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-network-interference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test all graph exposure and original source randomization design moments
        run: python research/R222/r222_exact_network_interference.py --test
  full-18-world-198-original-assignment-archive:
    needs: dual-python-network-interference-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify complete synthetic network exposure source evidence
        run: |
          python research/R222/r222_exact_network_interference.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R222')
          r=json.loads((d/'R222_EXACT_RESULTS.json').read_text())
          a=json.loads((d/'R222_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert a['actual_original_catalogue_id']==r['actual_original_catalogue_id']=='09-013'
          assert a['worlds']==r['synthetic_worlds']==18
          assert a['all_original_assignment_source_rows']==r['full_original_assignment_source_rows']==198
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          by={(w['graph'],w['mechanism'],w['assignment_policy']):w for w in r['worlds']}
          assert len(by)==18
          for graph,expected in [('PAIRS','4/3'),('STAR','1'),('CYCLE','2/3')]:
            assert by[graph,'LINEAR_SPILL','COMPLETE_TWO_OF_FOUR']['HT_from_actual_randomized_obs_source_expected_value_exact']==expected
            assert by[graph,'LINEAR_SPILL','BERNOULLI_HALF']['HT_from_actual_randomized_obs_source_expected_value_exact']=='2'
          for w in r['worlds']:
            assert w['full_original_assignment_probability_sum']=='1'
            assert F(w['HT_true_fixed_policy_target_MSE_exact'])==F(w['HT_source_variance_exact'])+F(w['HT_bias_against_fixed_Bernoulli_peers_direct_effect_exact'])**2
            assert w['HT_from_actual_randomized_obs_source_expected_value_exact']==w['independent_analytic_HT_design_expectation_exact']
          assert all(w['unsupported_cell_count']==0 for w in r['worlds'] if w['assignment_policy']=='BERNOULLI_HALF')
          assert any(w['unsupported_cell_count']>0 for w in r['worlds'] if w['assignment_policy']=='COMPLETE_TWO_OF_FOUR')
          with (d/'R222_ALL_198_ORIGINAL_NETWORK_ASSIGNMENT_SOURCES.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==198
          for name,key in [
            ('R222_EXACT_RESULTS.json','results_sha256'),
            ('R222_ALL_198_ORIGINAL_NETWORK_ASSIGNMENT_SOURCES.csv','sources_sha256'),
          ]:
            assert a[key]==hashlib.sha256((d/name).read_bytes()).hexdigest()
          print('R222_ALL_18_NETWORK_INTERFERENCE_WORLDS_198_SOURCE_RANDOM_ASSIGNMENTS_EXACT_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R222-Network-Interference-All-198-Randomized-Assignments
          path: |
            research/R222/R222_EXACT_RESULTS.json
            research/R222/R222_ALL_198_ORIGINAL_NETWORK_ASSIGNMENT_SOURCES.csv
            research/R222/R222_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive full original network-exposure and outcome sources on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R222/R222_EXACT_RESULTS.json research/R222/R222_ALL_198_ORIGINAL_NETWORK_ASSIGNMENT_SOURCES.csv research/R222/R222_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R222): all 18 network interference worlds and 198 original assignment sources'
            git push origin HEAD:main
          fi
