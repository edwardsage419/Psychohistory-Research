name: R075 real third-author human noisy IPD 18 original sessions frozen R073 seven models
on:
  push:
    paths:
      - '.github/workflows/r075-original-coauthor-true-human-e3.yml'
      - 'research/R075/r075_coauthor_real_human_e3.py'
      - 'research/R075/test_r075_coauthor_real_human_e3.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-synthetic-frozen-model-time-and-source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all 12 invented original coauthor session source guards
        working-directory: research/R075
        run: python -m unittest -v test_r075_coauthor_original_session_structure
      - name: Check 24 invented human target time/history/treatment and no-leakage model rules
        working-directory: research/R075
        run: python -m unittest -v test_r075_coauthor_real_human_e3
  real-publisher-coauthor-full-session-third-human-experiment:
    needs: all-synthetic-frozen-model-time-and-source-controls
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable coauthor first-party ZIP and retain actual humans in private runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r075_private /tmp/r075_anonymous
          python - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          url="https://davidrand-cooperation.com/s/slow-to-anger-and-fast-to-forgive-data-and-code.zip"
          with urllib.request.urlopen(urllib.request.Request(url,headers={
            "User-Agent":"Psychohistory-R075-third-independent-original-frozen-E3/1.0"}),timeout=60) as r:
              data=r.read(4_000_001)
          if len(data)!=1129409 or hashlib.sha256(data).hexdigest()!="328346c3cf88a71a3d6cf574f7d6ba741dcea460f3926c16266f1784d3a699ef":
            raise ValueError("R075_THIRD_EXPERIMENT_SOURCE_CHANGED")
          Path("/tmp/r075_private/coauthor_original.zip").write_bytes(data)
          PY
      - name: Actually fit frozen M0-M6 only on other same-treatment full sessions, score 26116 original decisions
        shell: bash
        run: |
          set -euo pipefail
          python research/R075/r075_coauthor_real_human_e3.py \
            --zip /tmp/r075_private/coauthor_original.zip \
            --output /tmp/r075_anonymous/r075_third_independent_true_human_18_session_results.json
      - name: Publish exclusively anonymized full-session macro model and paired Brier statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r075-true-third-experiment-18-session-frozen-seven-models
          path: /tmp/r075_anonymous/r075_third_independent_true_human_18_session_results.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Erase original individual decision histories from runner
        if: always()
        run: rm -rf /tmp/r075_private /tmp/r075_anonymous
