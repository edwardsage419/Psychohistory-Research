name: R151 Leslie Keyfitz 1092 exact age cohort matrices and 105 tests
on:
  push:
    paths:
      - 'research/R151/r151_leslie_age_exact.py'
      - 'research/R151/test_r151_leslie_age_exact.py'
      - '.github/workflows/r151-leslie-keyfitz-105-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-age-structure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source/test original Git blob identities
        run: |
          cd research/R151
          test "$(git hash-object r151_leslie_age_exact.py)" = "7a14789ae08af850aad26c4ad2d89455b74f9343"
          test "$(git hash-object test_r151_leslie_age_exact.py)" = "f897d69518257ae656c8293d3bd6cce5f02c8266"
          sha256sum r151_leslie_age_exact.py test_r151_leslie_age_exact.py
      - name: Execute 105 independent actual unit tests including 50 unique cohorts
        run: |
          cd research/R151
          python -m unittest -v test_r151_leslie_age_exact.py
      - name: Reproduce all 1092 complete cohort histories and source-integrity claims
        run: |
          cd research/R151
          python r151_leslie_age_exact.py > R151_EXACT_RESULTS.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          x=json.load(open('R151_EXACT_RESULTS.json'))
          assert x['cases_count']==1092 and x['cohort_initials']==91
          assert x['horizon']==12
          assert len(x['all_1092_full_trajectories'])==1092
          assert x['stable_share']==['4/9','1/3','2/9']
          assert x['left_reproductive_value']==['1','4/3','1/2']
          assert [x['examples'][k]['eventual_limit'] for k in ('young_only','adult_only','older_only')]==['900','1200','450']
          assert [x['examples'][k]['total_trace'][:3] for k in ('stationary','hidden_cohort')]==[['900','900','900'],['900','900','1395/2']]
          assert x['migration_age_comparisons']['young']['new_reproductive_value']=='902'
          assert x['migration_age_comparisons']['adult']['new_reproductive_value']=='2708/3'
          assert (x['new_E2'],x['new_E3'])==(0,0)
          assert not x['original_data_reproduced']
          for rec in x['all_1092_full_trajectories']:
              assert len(rec['age_trace'])==13
              assert len(rec['yearly_births'])==12
              for i,age in enumerate(rec['age_trace']):
                  assert sum(map(F,age))==F(rec['total_trace'][i])
          print('R151 PASS 105 genuine tests and all 1092 complete 13-state age histories')
          PY
          sha256sum R151_EXACT_RESULTS.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ('r151_leslie_age_exact.py','test_r151_leslie_age_exact.py','R151_EXACT_RESULTS.json'):
              print('R151_SHA256',name,hashlib.sha256(Path(name).read_bytes()).hexdigest())
          PY
      - name: Create deterministic research ZIP with all histories and two sources
        run: |
          cd research/R151
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('R151_Leslie_Keyfitz_1092_Cohorts_105_Tests.zip','w') as z:
              for name in ('r151_leslie_age_exact.py','test_r151_leslie_age_exact.py','R151_EXACT_RESULTS.json'):
                  item=zipfile.ZipInfo(name,date_time=(2026,10,20,0,0,0))
                  item.compress_type=zipfile.ZIP_LZMA
                  item.external_attr=0o644 << 16
                  z.writestr(item,open(name,'rb').read())
          print('ARCHIVE_CREATED',zipfile.ZipFile('R151_Leslie_Keyfitz_1092_Cohorts_105_Tests.zip').namelist())
          PY
          sha256sum R151_Leslie_Keyfitz_1092_Cohorts_105_Tests.zip
      - uses: actions/upload-artifact@v4
        with:
          name: R151-complete-research-python-${{ matrix.python-version }}
          path: research/R151/R151_Leslie_Keyfitz_1092_Cohorts_105_Tests.zip
          retention-days: 90
