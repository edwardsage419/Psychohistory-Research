name: R100 B1b genuine AB-only reciprocal two-stage partner and graph audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-a-b-mapping-first:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: 20 A2 plus 15 B0 plus 18 B1a plus 14 B1b pure synthetics
        run: |
          PYTHONPATH=research/R100 python -m unittest -v \
            research/R100/test_r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py \
            research/R100/test_r100_phase_b0_zenodo_xlsx_ab_tag_structure_only.py \
            research/R100/test_r100_phase_b1a_only_AB_literal_source_code_diagnostic.py \
            research/R100/test_r100_phase_b1b_original_AB_role_partner_reciprocal_graph.py
  actual-original-anonymous-reciprocity:
    needs: synthetic-a-b-mapping-first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Official exact MD5 SHA source A B roles and partner reciprocity, no C Z cells
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r100_B1b_source
          PYTHONPATH=research/R100 python research/R100/r100_phase_b1b_original_AB_role_partner_reciprocal_graph.py --output /tmp/r100_B1b_source/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r100_B1b_source/receipt.json').read_text())
          assert x["status"]=="B1B_STRICT_SOURCE_PAIR_RECIPROCITY_PASS"
          assert x["verified_distinct_source_people"]==554
          assert x["source_pair_full_reciprocity"] is True
          assert x["official_original_SHA256"]=="825b1cd3226aeca7a19d76d9594f655114b12059648f9ca03b3291c3cf9ab200"
          assert x["C_to_Z_cell_values_dereferenced"]==0
          assert x["original_human_model_scores"]==0
          print("R100_B1b_REAL_PAIR_ROSTER_STRICT_PASS",x["verified_distinct_source_people"])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r100-B1b-genuine-anonymous-AB-identity-pair-reciprocity-or-block
          path: /tmp/r100_B1b_source/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve immutable anonymized actual original source B1b outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r100_B1b_source/receipt.json
          dst=research/R100/R100_PHASE_B1B_LIVE_CI_PAIR_RECIPROCITY_SOURCE_RECEIPT.json
          if [ ! -f "$src" ]; then
            echo "No B1b actual source receipt, fail closed"
            exit 1
          fi
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r100_B1b_source/receipt.json').read_text())
          assert x["research_id"]=="R100" and x["phase"]=="B1b"
          assert x["original_human_model_scores"]==0 and x["PESEN_v0_1"]=="FROZEN"
          assert x["status"] in ("B1B_SOURCE_FAIL_CLOSED","B1B_BLOCKED_BOUNDED","B1B_STRICT_SOURCE_PAIR_RECIPROCITY_PASS")
          allowed={"research_id","phase","status","safe_failure","five_original_treatments_expected_sizes_match","anonymous_treatment_summaries","verified_distinct_source_people","source_pair_full_reciprocity","source_two_sessions_same_humans","original_person_pair_ids_exported","C_to_Z_cell_values_dereferenced","original_human_model_scores","PESEN_v0_1","official_original_bytes","official_original_MD5","official_original_SHA256"}
          assert set(x).issubset(allowed)
          if "anonymous_treatment_summaries" in x:
              assert len(x["anonymous_treatment_summaries"])==5
              fields={"anonymous_treatment_slot","source_four_row_focal_blocks","parsed_candidate_focals","anonymous_distinct_A_codes","anonymous_distinct_B_focal_codes","stage1_undirected_pair_candidates","stage2_undirected_pair_candidates","person_graph_connected_components","person_graph_component_smallest","person_graph_component_largest","violations"}
              keys={"A_not_one_code_on_first_row","B_missing_code","focal_repeated_position_mismatch","self_as_partner_code","same_opponent_two_sessions","duplicated_source_A_identifier","duplicated_B_focal_identifier","unmatched_B_partner_code","nonreciprocal_partner","same_role_within_pair","missing_actor_phase_pairs","unexpected_pair_session_count"}
              for row in x["anonymous_treatment_summaries"]:
                  assert set(row)==fields and set(row["violations"]).issubset(keys)
                  assert all(type(v)==int and v>=0 for v in row["violations"].values())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R100 B1b): genuine anonymous source A B partner role graph acceptance or strict bounded block"
          git pull --rebase origin main
          git push origin HEAD:main
