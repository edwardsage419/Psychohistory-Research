name: R274 Exact Temporal Holdout Versus Hindsight Source Audit
on:
  push:
    paths:
      - 'research/R274/r274_exact_temporal_holdout.py'
      - '.github/workflows/r274-exact-temporal-holdout-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 82 exact source and leakage detection unit tests
        run: python research/R274/r274_exact_temporal_holdout.py --test
  independent-temporal-source-audit-and-archive:
    needs: dual-python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and independently audit all 576 complete time ordered original sources
        run: |
          python research/R274/r274_exact_temporal_holdout.py --emit
          python - <<'PY'
          import csv,json,hashlib,itertools
          from collections import defaultdict
          from fractions import Fraction as F
          from math import comb
          from pathlib import Path
          root=Path('research/R274')
          csvpath=root/'R274_ALL_576_ORIGINAL_FORWARD_HOLDOUT_SOURCES.csv'
          jp=root/'R274_EXACT_RESULTS.json'
          rows=list(csv.DictReader(csvpath.open()))
          results=json.loads(jp.read_text())
          receipt=json.loads((root/'R274_MACHINE_RECEIPT.json').read_text())
          assert len(rows)==576 and len(results['world_results'])==9
          assert results['prescore_freeze_commit']==receipt['prescore_freeze_commit']=='47b75b49afb5c72c5ca2599ab38499e0f2856354'
          assert results['original_catalogue_id']=='12-004'
          for file,key in [(csvpath,'source_sha256'),(jp,'results_sha256')]:
              assert receipt[key]==hashlib.sha256(file.read_bytes()).hexdigest()
          grouped=defaultdict(list)
          for z in rows:grouped[z['world']].append(z)
          assert len(grouped)==9
          allsix={''.join(v) for v in itertools.product('01',repeat=6)}
          for w in results['world_results']:
              regime=w['regime'];mode=w['model'];a=F(w['past_p']);b=F(w['future_p'])
              sub=grouped[w['world']]
              assert len(sub)==64
              assert {r['original_sixbit_ordered_temporal_source'] for r in sub}==allsix
              total=score=F(0)
              by_history=defaultdict(dict)
              for r in sub:
                  original=r['original_sixbit_ordered_temporal_source']
                  past=original[:4];future=original[4:]
                  k=past.count('1');j=future.count('1')
                  if mode=='PAST_ONLY_LAPLACE':q=F(k+1,6)
                  elif mode=='HINDSIGHT_POOLED':q=F(k+j+1,8)
                  else:
                      assert mode=='PRECOMMITTED_HALF'
                      q=F(1,2)
                  assert r['original_past_t1_to_t4_bits']==past
                  assert r['original_future_t5_to_t6_bits']==future
                  assert int(r['original_past_successes'])==k
                  assert int(r['original_future_successes'])==j
                  assert F(r['reported_probability_for_t5_t6'])==q
                  assert int(r['future_outcomes_illegally_seen_during_fit'])==int(mode=='HINDSIGHT_POOLED')
                  mass=a**k*(1-a)**(4-k)*b**j*(1-b)**(2-j)
                  assert F(r['exact_original_temporal_source_mass'])==mass
                  losses=[(F(int(y))-q)**2 for y in future]
                  assert r['future_t5_t6_brier_each']==';'.join(map(str,losses))
                  single=sum(losses,F(0))/2
                  assert F(r['future_t5_t6_mean_brier'])==single
                  total+=mass;score+=mass*single
                  by_history[past][future]=q
              assert total==1
              # Every four-bit past has all four possible future strings.
              assert len(by_history)==16
              assert all(len(futures)==4 for futures in by_history.values())
              for futureq in by_history.values():
                  unique=len(set(futureq.values()))
                  assert unique==(3 if mode=='HINDSIGHT_POOLED' else 1)
              assert str(score)==w['exact_source_weighted_future_test_Brier']
              oracle=F(0)
              for k in range(5):
                  for j in range(3):
                      if mode=='PAST_ONLY_LAPLACE':q=F(k+1,6)
                      elif mode=='HINDSIGHT_POOLED':q=F(k+j+1,8)
                      else:q=F(1,2)
                      mass=F(comb(4,k))*a**k*(1-a)**(4-k)*F(comb(2,j))*b**j*(1-b)**(2-j)
                      oracle+=mass*(F(j)*(1-q)**2+F(2-j)*q*q)/2
              assert oracle==score
              assert w['independent_K_and_J_count_expectation_verified']
          assert results['no_real_human_E2']==results['no_real_historical_E3']==0
          print('R274_576_FULL_TEMPORAL_ORIGINAL_SOURCES_AND_9_FORWARD_HINDSIGHT_RISKS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R274-576-Forward-Versus-Hindsight-Temporal-Atoms
          path: |
            research/R274/R274_ALL_576_ORIGINAL_FORWARD_HOLDOUT_SOURCES.csv
            research/R274/R274_EXACT_RESULTS.json
            research/R274/R274_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive all 576 original temporal source types
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R274/R274_ALL_576_ORIGINAL_FORWARD_HOLDOUT_SOURCES.csv research/R274/R274_EXACT_RESULTS.json research/R274/R274_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R274): all 576 forward temporal and hindsight source atoms'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R274_ALL_576_TEMPORAL_SOURCE_ATOMS_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
