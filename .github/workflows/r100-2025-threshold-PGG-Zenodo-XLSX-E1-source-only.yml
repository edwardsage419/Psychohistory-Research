name: R100 2025 original Zenodo threshold PGG XLSX publisher MD5 workbook metadata only
on:
  push:
    paths:
      - '.github/workflows/r100-2025-threshold-PGG-Zenodo-XLSX-E1-source-only.yml'
      - 'research/R100/r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py'
      - 'research/R100/test_r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pure-synthetic-zip-md5-workbook-metadata-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 20 synthetic tests before source verification
        run: PYTHONPATH=research/R100 python -m unittest -v research/R100/test_r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py
  original-zenodo-source-publisher-md5-and-zero-action-directory:
    needs: pure-synthetic-zip-md5-workbook-metadata-gate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact Zenodo v2 official MD5 SHA and workbook names count only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/psychohistory_r100_source
          python research/R100/r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py --output /tmp/psychohistory_r100_source/source_receipt.json
          python - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('/tmp/psychohistory_r100_source/source_receipt.json')
          x=json.loads(p.read_text())
          assert x["status"] == "E1_SOURCE_AUTHENTICATED_WORKBOOK_DIRECTORY_ONLY"
          assert x["source_identity"]["publisher_MD5"] == "c40171abb172da8e16b0839db98a2cf2"
          assert x["nonbehavior_workbook_directory"]["original_workbook_sheet_count"] == 10
          assert x["nonbehavior_workbook_directory"]["actor_pair_contributions_or_survey_values_read"] is False
          assert x["actual_human_model_scores"] == 0
          assert x["PESEN_v0_1"] == "FROZEN"
          b=p.read_bytes()
          print("R100_SOURCE_ONLY_RECEIPT_BYTES",len(b))
          print("R100_SOURCE_ONLY_RECEIPT_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r100-2025-original-Zenodo-two-person-threshold-PGG-source-only
          path: /tmp/psychohistory_r100_source/source_receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Permanently archive only the sanitized source E1 or E0 receipt on main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/psychohistory_r100_source/source_receipt.json
          dst=research/R100/R100_PHASE_A_LIVE_CI_SOURCE_RECEIPT.json
          if [ ! -f "$src" ]; then
            echo "No machine source receipt was produced; fail closed."
            exit 1
          fi
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/psychohistory_r100_source/source_receipt.json').read_text())
          assert x['research_id']=='R100' and x['phase']=='A'
          assert x['actual_human_model_scores']==0
          assert x['PESEN_v0_1']=='FROZEN'
          assert x['status'] in ('E0_SOURCE_BLOCKED','E1_SOURCE_AUTHENTICATED_SCHEMA_BLOCKED','E1_SOURCE_AUTHENTICATED_WORKBOOK_DIRECTORY_ONLY')
          allowed={'research_id','phase','status','safe_failure','source_identity','publisher_DOI','source_filename','nonbehavior_workbook_directory','publisher_reported_treatment_participant_counts_not_verified','same_humans_in_sequential_sessions','actual_human_model_scores','PESEN_v0_1'}
          assert set(x).issubset(allowed)
          if 'nonbehavior_workbook_directory' in x:
              d=x['nonbehavior_workbook_directory']
              assert set(d)=={'original_workbook_sheet_count','worksheet_xml_read','shared_string_xml_read','actor_pair_contributions_or_survey_values_read','original_sheet_names_republished'}
              assert d['original_workbook_sheet_count']==10
              assert all(d[k] is False for k in d if k!='original_workbook_sheet_count')
          if 'source_identity' in x:
              assert set(x['source_identity'])=={'original_bytes','publisher_MD5','computed_original_SHA256','publisher_MD5_verified'}
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then
            echo "R100 source receipt already identical in Git."
            exit 0
          fi
          git commit -m "receipt(R100): automatic sanitized original Zenodo source E0/E1 result, zero human behaviors"
          git pull --rebase origin main
          git push origin HEAD:main
