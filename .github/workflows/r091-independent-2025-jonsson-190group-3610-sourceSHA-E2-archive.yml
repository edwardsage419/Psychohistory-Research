name: R091 independent first-party disaster 190 four-person groups 3610 LOOG exact source SHA archive
on:
  push:
    paths:
      - '.github/workflows/r091-independent-2025-jonsson-190group-3610-sourceSHA-E2-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  second-real-author-XLSX-all-synthetic-exact-outcome-and-private-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repeat all 100 synthetic frozen source, group, country, treatment and LOOG predictive safety tests
        run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<3.2'
          PYTHONPATH=research/R091 python -m unittest -v             research/R091/test_r091_author_2025_disaster_xlsx_source_only_gate.py             research/R091/test_r091_phase_b_main_sheet_group_time_roster_only.py             research/R091/test_r091_phase_b2_author_original_categorical_only.py             research/R091/test_r091_original_190_fourperson_disaster_group_loog_M0_M1_M2_E2.py
      - name: Reacquire original 571844-byte first-party Git blob, recompute 15200 contributions and all 3610 group-heldout targets, verify exact 18471 bytes SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r091_independent_original_privacy
          PYTHONPATH=research/R091 python             research/R091/r091_original_190_fourperson_disaster_group_loog_M0_M1_M2_E2.py             --output /tmp/r091_independent_original_privacy/complete_anonymous_E2.json
          test "$(wc -c < /tmp/r091_independent_original_privacy/complete_anonymous_E2.json | tr -d '[:space:]')" = 18471
          printf '%s  %s\n'             1657ee31c5df7640ea7a0943886900133e68f70c0f9c3ac900302d36191f723b             /tmp/r091_independent_original_privacy/complete_anonymous_E2.json | sha256sum --check --status
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/r091_independent_original_privacy/complete_anonymous_E2.json')
          b=p.read_bytes();r=json.loads(b)
          assert r["status"]=="R091_REAL_ORIGINAL_AUTHOR_190_FOURPERSON_GROUP_FULL_HOLDOUT_E2_EXECUTED"
          z=r["original_full_190_group_20round_prediction_results"]
          assert z["original_fourperson_groups_heldout"]==190
          assert z["original_4player_20round_people"]==760
          assert z["original_4player_actor_round_contribution_slots"]==15200
          assert z["original_independent_group_next_round_test_targets"]==3610
          assert len(z["by_original_country_and_treatment"])==10
          assert z["all_source_groups_M1_gain_positive"]==142
          assert z["all_source_groups_M1_gain_negative"]==48
          assert z["all_source_groups_M1_gain_zero"]==0
          assert z["pooled_M0_M1_M2"]["paired_gain_M0_minus_M1"]>0
          assert z["pooled_M0_M1_M2"]["paired_gain_M0_minus_M2"]>0
          assert all(x["paired_gain_M0_minus_M1"]>0 for x in z["by_original_country"].values())
          assert not z["group_or_actor_IDs_or_hashed_source_features_in_output"]
          assert not r["individual_original_source_contribution_or_group_IDs_exported"]
          assert r["PESEN_v0.1"]=="FROZEN"
          print("R091_SECOND_ORIGINAL_EXPERIMENT_E2_ANON_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - name: Archive only anonymized main author 190-group country and condition 20-round score macros, never source actor rows
        shell: bash
        run: |
          set -euo pipefail
          dest=research/R091/R091_INDEPENDENT_JONSSON_190_FOURPERSON_GROUP_3610_LOOG_M0_M1_M2_E2_RESULTS.json
          mkdir -p research/R091
          if [ -f "$dest" ]; then
            cmp "$dest" /tmp/r091_independent_original_privacy/complete_anonymous_E2.json
            exit 0
          fi
          cp /tmp/r091_independent_original_privacy/complete_anonymous_E2.json "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          git commit -m "results(R091): independent author original 190 fourperson groups 3610 source SHA historical M1 positive and 48 negative groups E2"
          git push origin HEAD:main
      - if: always()
        run: rm -rf /tmp/r091_independent_original_privacy
