name: R249 Exact Logistic and Fold Bifurcation Branch Certificates
on:
  push:
    paths:
      - 'research/R249/r249_exact_bifurcation_parameter_worlds.py'
      - '.github/workflows/r249-exact-bifurcation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-bifurcation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate parameter branch collisions, exact polynomial derivatives and local proofs
        run: python research/R249/r249_exact_bifurcation_parameter_worlds.py --test
  all-original-parameter-atom-archive:
    needs: dual-python-bifurcation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all 405 original parameters and verify two nonlinear bifurcation normal forms
        run: |
          python research/R249/r249_exact_bifurcation_parameter_worlds.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from fractions import Fraction as F
          d=Path('research/R249')
          rows=list(csv.DictReader((d/'R249_ALL_405_ORIGINAL_BIFURCATION_PARAMETER_SOURCE_ATOMS.csv').open()))
          j=json.loads((d/'R249_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R249_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==405 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-009'
          by={w['world']:w for w in j['world_results']}
          assert len(by)==9
          for w,r in by.items():
              src=[z for z in rows if z['world']==w]
              assert len(src)==45
              assert len({(z['original_cohort_x0'],z['original_time_n']) for z in src})==45
              assert all(F(z['original_source_probability'])==F(1,45) for z in src)
              assert sum((F(z['original_source_probability']) for z in src),F(0))==1
              assert r['independent_symbolic_composition_and_formal_derivative_parity']
              assert r['all_finite_semigroup_source_constraints_passed']
              assert len(r['nine_cohort_step4_exact_observed'])==len(r['nine_cohort_step4_sensitivities'])==9
              assert len(r['full_original_observed_source_joint'])==45
              for point in r['complete_real_fixed_points_and_root_multiplicities']:
                  assert int(point['root_multiplicity']) in (1,2)
                  assert len(point['exact_multiplier'])>0
          expected={
              'LOGISTIC_R_HALF':[('0','1/2',1),('-1','3/2',1)],
              'LOGISTIC_R_ONE':[('0','1',2)],
              'LOGISTIC_R_TWO':[('0','2',1),('1/2','0',1)],
              'LOGISTIC_R_THREE':[('0','3',1),('2/3','-1',1)],
              'LOGISTIC_R_FOUR':[('0','4',1),('3/4','-2',1)],
              'FOLD_NEG_QUARTER':[],
              'FOLD_ZERO':[('0','1',2)],
              'FOLD_POS_QUARTER':[('-1/2','2',1),('1/2','0',1)],
              'FOLD_POS_ONE':[('-1','3',1),('1','-1',1)]
          }
          for w,roots in expected.items():
              actual=[(x['root'],x['exact_multiplier'],x['root_multiplicity']) for x in by[w]['complete_real_fixed_points_and_root_multiplicities']]
              assert roots==actual,(w,actual)
              assert len(roots)==by[w]['count_distinct_real_fixed_points']
          cert=j['exact_analytic_branch_and_nonhyperbolic_certificates']
          assert cert['logistic_root_collision_r']=='1'
          assert cert['logistic_nonzero_multiplier_formula']=='2-r'
          assert cert['logistic_r1_semistable_right_and_repelling_left'] is True
          assert cert['fold_real_fixed_counts_mu_negative_zero_quarter_one']==[0,1,2,2]
          assert cert['fold_mu0_semistable_right_and_repelling_left'] is True
          assert cert['logistic_r3_second_iterate_shifted_polynomial']==['0','1','0','-18','-27']
          assert cert['fold_mu1_second_iterate_shifted_polynomial']==['0','1','0','-2','-1']
          assert cert['logistic_r3_upper_strict_deficit']==cert['fold_mu1_upper_strict_deficit']=='9/64'
          assert cert['both_multiplier_minus_one_nonhyperbolic_fixed_are_proven_locally_attracting'] is True
          for name,key in [('R249_ALL_405_ORIGINAL_BIFURCATION_PARAMETER_SOURCE_ATOMS.csv','source_sha256'),
                           ('R249_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/name).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R249_ALL_405_ORIGINAL_BIFURCATION_PARAMETERS_AND_TWO_NORMAL_FORMS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R249-Nine-Exact-Bifurcation-Parameter-Source-Worlds
          path: |
            research/R249/R249_ALL_405_ORIGINAL_BIFURCATION_PARAMETER_SOURCE_ATOMS.csv
            research/R249/R249_EXACT_RESULTS.json
            research/R249/R249_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all 405 bifurcation source atoms to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R249/R249_ALL_405_ORIGINAL_BIFURCATION_PARAMETER_SOURCE_ATOMS.csv research/R249/R249_EXACT_RESULTS.json research/R249/R249_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R249): all 405 logistic and fold bifurcation parameter atoms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
