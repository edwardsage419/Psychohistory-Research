name: R110 A0 PLOS 2015 human 120 6 lab sessions original S1 experimental CSV delivery headers only
on:
  push:
    paths:
      - '.github/workflows/r110-2015-Bone-UCL-PLOS-S1-A0-original-delivery-HEADERS-no-body.yml'
      - 'research/R110/r110_phase_a0_2015_bone_UCL_PLOS_s1_original_CSV_delivery_no_body.py'
      - 'research/R110/test_r110_phase_a0_2015_bone_UCL_PLOS_s1_original_CSV_delivery_no_body.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  first-thirteen-source-synthetics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test true publisher DOI S1 file route and never follow redirect or print signed URL
        run: PYTHONPATH=research/R110 python -m unittest -v research/R110/test_r110_phase_a0_2015_bone_UCL_PLOS_s1_original_CSV_delivery_no_body.py
  original-publisher-no-body-real-delivery:
    needs: first-thirteen-source-synthetics
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Real PLOS publisher official 2015 S1 supplementary only HTTP headers zero file bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r110_A0
          PYTHONPATH=research/R110 python research/R110/r110_phase_a0_2015_bone_UCL_PLOS_s1_original_CSV_delivery_no_body.py --output /tmp/r110_A0/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r110_A0/receipt.json').read_text())
          assert x['status']=='R110_A0_2015_PLOS_FIRSTPARTY_S1_DELIVERY_HEADERS_ONLY_NO_SOURCE_E1'
          assert x['original_S1_body_bytes_read']==0
          assert x['original_human_action_or_actor_source_values_accessed'] is False
          assert x['actual_human_predictive_scores']==0
          print("R110_TRUE_PLOS_S1_PUBLISHER_DELIVERY_HTTP",x['original_publisher_HTTP_code'],x.get('PLOS_file_delivery_hostname_only'),x.get('publisher_content_length_if_bounded'))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r110-2015-PLOS-S1-firstparty-http-headers-only
          path: /tmp/r110_A0/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit true first-party PLOS S1 source delivery metadata or fixed source failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r110_A0/receipt.json
          dst=research/R110/R110_PHASE_A0_LIVE_CI_2015_PLOS_S1_CSV_PUBLISHER_DELIVERY_HOST_ONLY.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib,re
          x=json.loads(pathlib.Path('/tmp/r110_A0/receipt.json').read_text())
          assert x['research_id']=='R110' and x['phase']=='A0'
          assert x['PESEN_v0_1']=='FROZEN' and x['actual_human_predictive_scores']==0
          assert x['status'] in ('R110_A0_2015_PLOS_FIRSTPARTY_S1_DELIVERY_HEADERS_ONLY_NO_SOURCE_E1','R110_A0_OFFICIAL_PLOS_SOURCE_DELIVERY_PREFLIGHT_FAIL_CLOSED')
          safe={'research_id','phase','status','safe_failure','original_article_DOI','original_S1_csv_DOI','original_publisher_HTTP_code','original_S1_body_bytes_read','original_human_action_or_actor_source_values_accessed','HTTP_redirect_target_host_observed','PLOS_file_delivery_hostname_only','PLOS_file_delivery_domain_family','whole_redirect_URL_path_query_exported','publisher_content_type_class','publisher_content_length_if_bounded','actual_human_predictive_scores','PESEN_v0_1'}
          assert set(x).issubset(safe)
          if 'PLOS_file_delivery_hostname_only' in x:
            assert re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)+',x['PLOS_file_delivery_hostname_only'])
            assert x['whole_redirect_URL_path_query_exported'] is False
          if 'original_S1_body_bytes_read' in x:
            assert x['original_S1_body_bytes_read']==0
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R110 A0): 2015 PLOS first-party 120-human 6 lab session S1 dataset official redirect host only no behavior"
          git pull --rebase origin main
          git push origin HEAD:main
