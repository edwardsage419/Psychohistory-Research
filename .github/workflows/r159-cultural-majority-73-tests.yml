name: R159 Cultural Majority 48 Worlds 73 Pinned Tests
on:
  push:
    paths:
      - 'research/R159/r159_cultural_transmission_exact.py'
      - 'research/R159/test_r159_cultural_transmission_exact.py'
      - '.github/workflows/r159-cultural-majority-73-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independently-enumerated-cultural-majority:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify immutable source and test blob identity
        run: |
          cd research/R159
          test "$(git hash-object r159_cultural_transmission_exact.py)" = "440b2aa3a1b8f46248af31252b0ba60b0a0fe77e"
          test "$(git hash-object test_r159_cultural_transmission_exact.py)" = "4c0e1c233da1635fb68a1368fef55ca7958c470e"
          echo '06e79227a73b802806fbd7a0bb3bd6dc33e3f994a8403c14fd8a06c58fdc8aeb  r159_cultural_transmission_exact.py' | sha256sum -c -
          echo 'e3c9318dc0194d0e2c7f96a8f8e34c7c116797885ca0c6a9371b72873b5d6216  test_r159_cultural_transmission_exact.py' | sha256sum -c -
      - name: Generate complete 48 fully Fraction cultural frequency paths
        run: |
          cd research/R159
          python r159_cultural_transmission_exact.py > R159_EXACT_RESULTS.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          d=json.load(open('R159_EXACT_RESULTS.json'))
          assert d['scenario_count']==48 and len(d['worlds'])==48
          assert len(set(w['case_id'] for w in d['worlds']))==48
          assert d['predeclared_controls']['equilibrium_half_maintained_for_all_h_u']
          assert d['predeclared_controls']['no_conformism_no_reset_remains_constant']
          assert not d['historical_cultural_data_used']
          assert d['not_a_gene_culture_coevolution_model']
          for w in d['worlds']:
              assert len(w['points'])==7
              assert w['two_independent_Fraction_routes_identical']
              for point in w['points']:
                  p=F(point['trait_A_frequency'])
                  c=F(point['independent_three_demo_majority'])
                  assert c==3*p*p-2*p*p*p
                  assert 0<=p<=1 and 0<=c<=1
          print('R159 PASS all 48 fixed cultural worlds, two exact Fraction oracle methods')
          PY
          echo '618d975c379eefcc0929efbf20218a78832684abd5772ac5decf2e61415fdb7e  R159_EXACT_RESULTS.json' | sha256sum -c -
      - name: Run all 73 distinct authentic tests
        run: |
          cd research/R159
          python -m unittest -v test_r159_cultural_transmission_exact.py
      - name: Create canonical standard library source test data ZIP
        run: |
          cd research/R159
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('R159_Cultural_Majority_48_Worlds_73_Tests.zip','w') as z:
              for name in ('r159_cultural_transmission_exact.py','test_r159_cultural_transmission_exact.py','R159_EXACT_RESULTS.json'):
                  item=zipfile.ZipInfo(name,date_time=(2026,10,21,0,0,0))
                  item.compress_type=zipfile.ZIP_LZMA
                  item.external_attr=0o644<<16
                  z.writestr(item,open(name,'rb').read())
          PY
          echo '504ac3f978fee5b93f17af3fbacf0e0360d54dd6bb2518303794529295934363  R159_Cultural_Majority_48_Worlds_73_Tests.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: R159-48-synthetic-cultural-fraction-${{ matrix.python-version }}
          path: research/R159/R159_Cultural_Majority_48_Worlds_73_Tests.zip
          retention-days: 90
  pinned-permanent-research-archive:
    needs: independently-enumerated-cultural-majority
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently replay 48 worlds and check 4 SHA256 and 73 tests
        run: |
          cd research/R159
          echo '06e79227a73b802806fbd7a0bb3bd6dc33e3f994a8403c14fd8a06c58fdc8aeb  r159_cultural_transmission_exact.py' | sha256sum -c -
          echo 'e3c9318dc0194d0e2c7f96a8f8e34c7c116797885ca0c6a9371b72873b5d6216  test_r159_cultural_transmission_exact.py' | sha256sum -c -
          python r159_cultural_transmission_exact.py > R159_EXACT_RESULTS.json
          echo '618d975c379eefcc0929efbf20218a78832684abd5772ac5decf2e61415fdb7e  R159_EXACT_RESULTS.json' | sha256sum -c -
          python -m unittest -v test_r159_cultural_transmission_exact.py
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('R159_Cultural_Majority_48_Worlds_73_Tests.zip','w') as z:
              for name in ('r159_cultural_transmission_exact.py','test_r159_cultural_transmission_exact.py','R159_EXACT_RESULTS.json'):
                  item=zipfile.ZipInfo(name,date_time=(2026,10,21,0,0,0))
                  item.compress_type=zipfile.ZIP_LZMA
                  item.external_attr=0o644<<16
                  z.writestr(item,open(name,'rb').read())
          PY
          echo '504ac3f978fee5b93f17af3fbacf0e0360d54dd6bb2518303794529295934363  R159_Cultural_Majority_48_Worlds_73_Tests.zip' | sha256sum -c -
      - name: Publish canonical JSON and original full source/test ZIP on main
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add research/R159/R159_EXACT_RESULTS.json research/R159/R159_Cultural_Majority_48_Worlds_73_Tests.zip
          if ! git diff --cached --quiet; then
              git commit -m 'archive(R159): pinned 48 conformist copying Fraction worlds and 73 tests'
              git push origin HEAD:main
          fi
