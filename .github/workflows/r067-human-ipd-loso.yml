name: R067 true human IPD fixed shuffled 12 session LOSO

on:
  push:
    paths:
      - 'research/R067/r067_human_ipd_session_loso.py'
      - 'research/R067/test_r067_human_ipd_session_loso.py'
      - '.github/workflows/r067-human-ipd-loso.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-identity-and-prognostic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject heldout-outcome leaks and compare actual PD payoffs
        working-directory: research/R067
        run: python -m unittest -v test_r067_human_ipd_session_loso

  real-12-session-conditional-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact published submission fixed and random partner action records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r067_ipd_human /tmp/r067_ipd_scores
          python - <<'PY'
          from urllib import request
          from pathlib import Path
          repo="https://raw.githubusercontent.com/eladiomontero/PairwiseStrategies/4743f74d8a03a031b8f70aff64956f8ad5155182"
          for name in ("fix.csv","rand.csv"):
              req=request.Request(repo+"/"+name,headers={"User-Agent":"R067-LOSO-actual-human-data/1.0"})
              with request.urlopen(req,timeout=30) as resp: data=resp.read(2000001)
              if len(data)>2000000: raise ValueError("original source exceeded 2MB")
              (Path("/tmp/r067_ipd_human")/name).write_bytes(data)
          PY
      - name: Score all 12 sessions over 99 next-round transitions on actual R3 T4 S0 P1
        shell: bash
        run: |
          set -euo pipefail
          python research/R067/r067_human_ipd_session_loso.py \
            --source-dir /tmp/r067_ipd_human \
            --output /tmp/r067_ipd_scores/anonymous_12_session_loso.json
      - name: Upload only aggregate MSEs, parameter frequency and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r067-actual-human-12-session-loso-strategy-scores
          path: /tmp/r067_ipd_scores/anonymous_12_session_loso.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Erase all individual round-level records
        if: always()
        shell: bash
        run: rm -rf /tmp/r067_ipd_human /tmp/r067_ipd_scores
