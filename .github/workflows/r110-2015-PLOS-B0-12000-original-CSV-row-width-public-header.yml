name: R110 B0 2015 PLOS true S1 source 12000 rows 18 public header fields no human values
on:
  push:
    paths:
      - '.github/workflows/r110-2015-PLOS-B0-12000-original-CSV-row-width-public-header.yml'
      - 'research/R110/r110_phase_b0_2015_PLOS_original_12000_CSV_row_width_and_18_public_headers_only.py'
      - 'research/R110/test_r110_phase_b0_2015_PLOS_original_12000_CSV_row_width_and_18_public_headers_only.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-synthetics-before-behavior-values:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Twenty-nine source-original and 12000x18 CSV header privacy safety synthetic tests
        run: |
          PYTHONPATH=research/R110 python -m unittest -v \
            research/R110/test_r110_phase_a1_2015_PLOS_S1_verified_google_storage_original_doubleSHA_header_only.py \
            research/R110/test_r110_phase_b0_2015_PLOS_original_12000_CSV_row_width_and_18_public_headers_only.py
  true-original-PLOS-2015-only-header-and-row-shape:
    needs: source-synthetics-before-behavior-values
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Genuine original 2015 1023128B entire source SHA, 18 public field names and CSV row widths only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r110_B0
          PYTHONPATH=research/R110 python research/R110/r110_phase_b0_2015_PLOS_original_12000_CSV_row_width_and_18_public_headers_only.py --output /tmp/r110_B0/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r110_B0/receipt.json').read_text())
          assert x['status']=='R110_B0_2015_PLOS_GENUINE_12000_LOGICAL_ROW_PUBLIC_HEADER_ONLY_E1'
          assert x['original_source_SHA256']=='ea70b0f3d98075f9d3e4401becfcdec8f6bdb5cae00c4dad63a697f9b61d7b5f'
          assert x['original_source_full_bytes']==1023128
          assert x['original_header_column_count']==18
          assert x['original_individual_behavior_or_person_ID_values_read'] is False
          assert x['real_human_model_scores']==0
          print('R110_GENUINE_PLOS_2015_CODEBOOK_SAFE_HEADER',x['author_original_public_field_names_only'])
          print('R110_SOURCE_ROW_SHAPE',x['original_logical_CSV_data_rows'],x['source_anonymous_row_width_histogram'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r110-2015-PLOS-original-12000-row-18-public-CSV-columns
          path: /tmp/r110_B0/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit public source header labels and only aggregate widths or bounded source failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r110_B0/receipt.json
          dst=research/R110/R110_PHASE_B0_LIVE_CI_2015_PLOS_S1_ORIGINAL_12000_ROW_18FIELD_PUBLISHED_HEADER_ROSTER.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib,re
          x=json.loads(pathlib.Path('/tmp/r110_B0/receipt.json').read_text())
          assert x['research_id']=='R110' and x['phase']=='B0' and x['PESEN_v0_1']=='FROZEN' and x['real_human_model_scores']==0
          assert x['status'] in ('R110_B0_ORIGINAL_CSV_PUBLIC_CODEBOOK_FAIL_CLOSED','R110_B0_2015_PLOS_GENUINE_12000_LOGICAL_ROW_PUBLIC_HEADER_ONLY_E1')
          allowed={'research_id','phase','status','safe_failure','original_source_SHA256','original_source_full_bytes','original_publisher_S1_DOI','author_original_public_field_names_only','original_header_column_count','original_physical_data_lines','original_logical_CSV_data_rows','source_anonymous_row_width_histogram','all_source_rows_12000x18_structurally','source_first_eight_anonymous_row_widths','source_last_eight_anonymous_row_widths','source_row_width_transition_count','original_individual_behavior_or_person_ID_values_read','real_human_model_scores','PESEN_v0_1'}
          assert set(x).issubset(allowed)
          if 'author_original_public_field_names_only' in x:
            assert len(x['author_original_public_field_names_only'])==18
            assert all(re.fullmatch(r'[A-Za-z_][A-Za-z0-9_ .()/-]{0,59}',s) for s in x['author_original_public_field_names_only'])
            assert sum(x['source_anonymous_row_width_histogram'].values())==x['original_logical_CSV_data_rows']
            assert x['original_individual_behavior_or_person_ID_values_read'] is False
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R110 B0): genuine PLOS 2015 UCL public 18-column source codebook and 12000 row widths only, no behaviors"
          git pull --rebase origin main
          git push origin HEAD:main
