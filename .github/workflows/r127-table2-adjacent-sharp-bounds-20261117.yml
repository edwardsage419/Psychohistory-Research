name: R127 published Table2 adjacent-period sharp bounds

on:
  push:
    paths:
      - '.github/workflows/r127-table2-adjacent-sharp-bounds-20261117.yml'
      - 'research/validation/r127_table2_full_ten_period_sharp_transitions_20261117.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-flow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic-witness flow and full-path proof
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node research/validation/r127_table2_full_ten_period_sharp_transitions_20261117.js > "$RUNNER_TEMP/r127-sharp-summary.json"
          python - "$RUNNER_TEMP/r127-sharp-summary.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          expect={
              'status':'PASS_BOUNDED_SHARP_AGGREGATE_IDENTIFICATION',
              'source_cells':490,'independent_adjacent_pairs':63,
              'participant_round_transitions':963,
              'minimum_total_switches':262,
              'maximum_total_switches':857,
              'minimum_absolute_effort_distance':552,
              'endpoint_only_minimum_switches':89,
              'minimum_enter_effort1':98,
              'minimum_exit_effort1':23,
              'new_E2_predictions':0,'new_E3_predictions':0,
          }
          for key,want in expect.items():
              if data.get(key)!=want:
                  raise SystemExit('R127_FAIL_CLOSED:'+key)
          if len(data['session_rows'])!=7 or len(data['adjacent_period_rows'])!=9:
              raise SystemExit('R127_COVERAGE_MISMATCH')
          if data['individual_real_actions_identified'] is not False:
              raise SystemExit('R127_IDENTIFICATION_OVERCLAIM')
          print('R127_ADJACENT_SHARP_BOUNDS_VERIFIED',data['minimum_total_switches'],data['maximum_total_switches'])
          PY
