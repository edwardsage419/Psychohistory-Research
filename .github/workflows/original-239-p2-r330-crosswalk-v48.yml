name: Original239 P2 R330 Instance Retrieval Crosswalk v4.8
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p2_r330_crosswalk_v4_8.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v4.8_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_14_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - '.github/workflows/original-239-p2-r330-crosswalk-v48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python research/catalogue_audit/verify_p2_r330_crosswalk_v4_8.py
  independent:
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/independent_r330_instance_retrieval_audit.py
      - run: python research/catalogue_audit/verify_p2_r330_crosswalk_v4_8.py
