name: R324 finite psychometric risk two-axis E1
on:
  push:
    paths:
      - 'research/R324/**'
      - 'research/catalogue_audit/independent_r324_risk_audit.py'
      - '.github/workflows/r324-risk-64-states-e1.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python research/R324/r324_risk.py --test
      - run: python research/R324/r324_risk.py --audit
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/catalogue_audit/independent_r324_risk_audit.py
