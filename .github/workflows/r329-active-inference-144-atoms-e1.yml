name: R329 finite active inference 144 joint atoms E1
on:
  push:
    paths:
      - 'research/R329/**'
      - 'research/catalogue_audit/independent_r329_active_inference_audit.py'
      - '.github/workflows/r329-active-inference-144-atoms-e1.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python research/R329/r329_active_inference.py --test --audit
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/catalogue_audit/independent_r329_active_inference_audit.py
