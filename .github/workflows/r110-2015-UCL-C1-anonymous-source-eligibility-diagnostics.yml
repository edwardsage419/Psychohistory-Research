name: R110 C1 frozen UCL original binary eligibility diagnostic no model scoring

on:
  push:
    paths:
      - '.github/workflows/r110-2015-UCL-C1-anonymous-source-eligibility-diagnostics.yml'
      - 'research/R110/r110_phase_c1_2015_UCL_frozen_binary_eligibility_diagnostic.py'
      - 'research/R110/test_r110_phase_c1_2015_UCL_frozen_binary_eligibility_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthetic-before-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: C1 diagnostic pure synthetic privacy, exact C0 screening, SHA and failure checks
        run: |
          PYTHONPATH=research/R110 python -m unittest -v \
            research/R110/test_r110_phase_c1_2015_UCL_frozen_binary_eligibility_diagnostic.py
  original-C1-single-publisher-fetch:
    needs: synthetic-before-original
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One authentic bounded C1 diagnostic, zero model scores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r110_C1
          PYTHONPATH=research/R110 python research/R110/r110_phase_c1_2015_UCL_frozen_binary_eligibility_diagnostic.py \
            --output /tmp/r110_C1/source_eligibility_diagnostic.json || true
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/r110_C1/source_eligibility_diagnostic.json')
          assert p.exists(),"R110_C1_MISSING_GENUINE_SOURCE_RECEIPT"
          x=json.loads(p.read_text())
          assert x['research_id']=='R110' and x['phase']=='C1'
          assert x['PESEN_v0_1']=='FROZEN'
          assert x['new_human_prediction_scores']==0
          assert x['status'] in (
              'C1_DIAGNOSTIC_COMPLETE_C0_GATE_STILL_FAIL',
              'C1_IMPLEMENTATION_DISCREPANCY','C1_E0_SOURCE_BLOCKED')
          if x['status']=='C1_E0_SOURCE_BLOCKED':
              assert set(x)=={'research_id','phase','status','safe_failure',
                              'new_human_prediction_scores','PESEN_v0_1'}
          else:
              assert x['original_source_SHA256']=='ea70b0f3d98075f9d3e4401becfcdec8f6bdb5cae00c4dad63a697f9b61d7b5f'
              assert x['original_source_rows']==12000
              assert sum(x['mutually_exclusive_reasons'].values())+x['total_valid_C0_identical_targets']==12000
              assert x['denominator_closed'] and not x['raw_tokens_actor_identifiers_and_person_actions_exported']
              assert len(x['game_level_anonymous_denominators'])==2
          print('R110_C1_GENUINE_SOURCE_STATUS',x['status'])
          print('R110_C1_NEW_HUMAN_SCORES',x['new_human_prediction_scores'])
          if 'total_valid_C0_identical_targets' in x:
              print('R110_C1_VALID_TARGETS',x['total_valid_C0_identical_targets'])
              print('R110_C1_EXCLUSION_REASONS',x['mutually_exclusive_reasons'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r110-2015-UCL-C1-anonymous-eligibility-or-bounded-source-failure
          path: /tmp/r110_C1/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive original C1 safe receipt without touching C0
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r110_C1/source_eligibility_diagnostic.json
          dst=research/R110/R110_PHASE_C1_LIVE_CI_2015_UCL_ORIGINAL_SOURCE_ANONYMOUS_ELIGIBILITY_OR_FAILURE.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r110_C1/source_eligibility_diagnostic.json').read_text())
          assert x['research_id']=='R110' and x['phase']=='C1'
          assert x['new_human_prediction_scores']==0 and x['PESEN_v0_1']=='FROZEN'
          assert x['status'] in ('C1_DIAGNOSTIC_COMPLETE_C0_GATE_STILL_FAIL',
                                 'C1_IMPLEMENTATION_DISCREPANCY','C1_E0_SOURCE_BLOCKED')
          assert len(str(x)) < 20000
          PY
          cp "$src" "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(R110 C1): one real authenticated original anonymous eligibility audit or bounded failure"
          git pull --rebase origin main
          git push origin HEAD:main
