name: R344 heterogeneous typed meta path 64 artificial atoms E1
on:
  push:
    paths:
      - 'research/R344/**'
      - 'research/catalogue_audit/independent_r344_heterogeneous_audit.py'
      - '.github/workflows/r344-heterogeneous-64-atoms-e1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/R344/r344_typed_pathsim.py --test --audit
  python312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/R344/r344_typed_pathsim.py --test --audit
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/independent_r344_heterogeneous_audit.py
