name: R119 Watts 2002 neighbor threshold graph closure and Eq5 branching mathematics

on:
  push:
    paths:
      - '.github/workflows/r119-watts-neighbor-threshold-finite-and-branching-43-tests.yml'
      - 'research/R119/r119_watts_2002_fraction_neighbor_cascade.py'
      - 'research/R119/test_r119_watts_2002_fraction_neighbor_cascade.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-firstparty-watts-graph-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute 43 independent graph examples, branching Eq5 and exhaustive 21423 tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R119 python -m unittest -v \
            research/R119/test_r119_watts_2002_fraction_neighbor_cascade.py 2>&1 | tee /tmp/r119_tests.txt
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r119_tests.txt').read_text()
          assert re.findall(r'Ran (\d+) tests? in',log)==['43'],('R119_EXPECT_EXACTLY_43_CASES',log[-1800:])
          assert re.search(r'\nOK\s*$',log),'R119_REAL_TEST_FAILURE'
          print('R119_43_GENUINE_UNIT_TESTS_SUCCESS')
          PY
      - name: Record truthful original-source mathematical audit and code hashes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R119 python - <<'PY'
          from fractions import Fraction as F
          import hashlib,json,pathlib
          import r119_watts_2002_fraction_neighbor_cascade as m
          example=m.frozen_network_counterexamples()
          expected={
            'path_seed_endpoint':6,'star_seed_leaf':1,'star_seed_center':6,
            'cycle_seed_0':6,'two_triangles_seed_0':3,'diamond_late_stable':4,
          }
          assert example['final_sizes']==expected,example
          assert example['cycle_and_triangles_same_degree_multiset']
          assert example['path_and_star_same_edge_count']
          assert example['diamond_node_3_not_one_neighbor_vulnerable']
          all_cases=m.exhaustive_tiny_graphs()
          assert all_cases=={'1':3,'2':36,'3':648,'4':20736}
          params=[
            ([F(0),F(0),F(0),F(1)],[F(0),F(0),F(0),F(1)],F(2),'SUPERCRITICAL'),
            ([F(0),F(0),F(0),F(1)],[F(0)]*4,F(0),'SUBCRITICAL'),
            ([F(0),F(0),F(1)],[F(0),F(0),F(1)],F(1),'CRITICAL_BOUNDARY'),
            ([F(0),F(1)],[F(0),F(1)],F(0),'SUBCRITICAL'),
            ([F(0),F(1,2),F(0),F(1,2)],[F(0),F(1),F(0),F(1)],F(3,2),'SUPERCRITICAL')
          ]
          verified=[]
          for p,rho,ratio,regime in params:
            x=m.branching_ratio(p,rho)
            assert x['branching_ratio']==ratio and x['regime']==regime
            verified.append({'degree_mass':[str(z) for z in p],
                             'vulnerability_conditional':[str(z) for z in rho],
                             'ratio':str(ratio),'regime':regime})
          root=pathlib.Path('research/R119')
          files=[
            'r119_watts_2002_fraction_neighbor_cascade.py',
            'test_r119_watts_2002_fraction_neighbor_cascade.py',
            'R119_WATTS_2002_PRIMARY_NETWORK_CASCADE_FINITE_GRAPH_AND_EQ5_BOUNDED_SCIENTIFIC_REPORT_2026-10-19.md'
          ]
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files}
          receipt={
            'research_id':'R119','phase':'A',
            'status':'R119_WATTS_ORIGINAL_LOCAL_THRESHOLD_EQ5_43_TEST_21423_SYNTHETIC_PASS',
            'catalogue_id':'04-002','priority':'P0',
            'primary_source_DOI':'10.1073/pnas.082090499',
            'source_firstparty_fulltext_url':'https://pmc.ncbi.nlm.nih.gov/articles/PMC122850/',
            'original_model_exact_components':'neighbor fraction threshold, irreversible adoption, vulnerable degree and Eq(5)',
            'finite_topology_counterexamples':example,
            'infinite_random_graph_Eq5_analytic_cases':verified,
            'small_graph_exhaustive_configuration_counts':all_cases,
            'total_exhaustive_synthetic_graph_threshold_seed_configs':sum(all_cases.values()),
            'actual_synthetic_unittests_executed':43,
            'synthetic_unittest_failures':0,
            'source_code_test_report_SHA256':hashes,
            'original_Watts_2002_10000_node_ER_phase_diagram_reproduced':False,
            'original_individual_human_network_data_loaded':False,
            'original_human_E2_prediction_score_count':0,
            'causal_real_world_diffusion_established':False,
            'PESEN_v0_1':'FROZEN','R073':'FROZEN'
          }
          output=root/'R119_PHASE_A_WATTS_2002_EQ5_AND_21423_GRAPH_SYNTHETIC_CI_ACCEPTANCE.json'
          output.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R119_SOURCE_HASH_RECEIPT_SHA256',hashlib.sha256(output.read_bytes()).hexdigest())
          PY
      - name: Archive true bounded math receipt only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R119/R119_PHASE_A_WATTS_2002_EQ5_AND_21423_GRAPH_SYNTHETIC_CI_ACCEPTANCE.json
          git commit -m "results(R119): 43 Watts threshold checks and 21423 tiny graph configs pass Eq5 audit"
          git pull --rebase origin main
          git push origin HEAD:main
