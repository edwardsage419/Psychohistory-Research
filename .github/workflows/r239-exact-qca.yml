name: R239 Exact Crisp QCA Configuration Logic and Causal Aliases
on:
  push:
    paths:
      - 'research/R239/r239_exact_crisp_qca.py'
      - '.github/workflows/r239-exact-qca.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-qca-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test exact 144 finite original QCA atoms and minimized Boolean covers
        run: python research/R239/r239_exact_crisp_qca.py --test
  full-original-qca-archive:
    needs: dual-python-qca-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all original QCA configurations and independently audit alias and minimization
        run: |
          python research/R239/r239_exact_crisp_qca.py --emit
          python - <<'PY'
          import csv,hashlib,json,itertools
          from pathlib import Path
          from fractions import Fraction as F
          d=Path('research/R239')
          rows=list(csv.DictReader((d/'R239_ALL_144_ORIGINAL_CONFIGURATION_CAUSAL_SOURCES.csv').open()))
          data=json.loads((d/'R239_EXACT_RESULTS.json').read_text())
          machine=json.loads((d/'R239_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==144 and len(data['world_results'])==9
          assert data['original_catalogue_id']==machine['original_catalogue_id']=='10-013'
          by={w['world']:w for w in data['world_results']}
          assert len(by)==9
          for world,summary in by.items():
            atoms=[r for r in rows if r['world']==world]
            assert len(atoms)==16 and all(F(r['original_source_probability'])==F(1,16) for r in atoms)
            assert len({(r['oracle_original_X'],r['oracle_original_B'],r['oracle_original_C'],r['oracle_original_U']) for r in atoms})==16
            assert sum((F(r['original_source_probability']) for r in atoms),F(0))==1
            tt=summary['complete_truth_table']
            assert len(tt)==8
            assert sum(r['selected_original_atoms'] for r in tt)==summary['selected_source_atoms']
            assert all(r['state'] in ('positive','negative','contradictory','remainder') for r in tt)
            assert all(r['consistency'] is None for r in tt if r['state']=='remainder')
            for cube_list in (summary['conservative_dnf_cubes'],summary['parsimonious_dnf_cubes']):
              for row in tt:
                bits=tuple(int(c) for c in row['abc'])
                fitted=any(all(x==-1 or x==y for x,y in zip(cube,bits)) for cube in cube_list)
                if row['state']=='positive':assert fitted
                if row['state'] in ('negative','contradictory'):assert not fitted
          a=by['LIMITED_A_AND_B'];b=by['LIMITED_UNSEEN_BRANCH']
          assert a['full_observed_joint_with_explicit_selection_missingness']==b['full_observed_joint_with_explicit_selection_missingness']
          assert a['logical_remainder_configurations']==b['logical_remainder_configurations']==2
          a=by['ALIAS_A_CAUSAL'];b=by['ALIAS_U_CONFOUNDED']
          assert a['full_observed_joint_with_explicit_selection_missingness']==b['full_observed_joint_with_explicit_selection_missingness']
          assert a['observational_sufficiency_A']==b['observational_sufficiency_A']=='1'
          assert a['observational_necessity_A']==b['observational_necessity_A']=='1'
          assert a['oracle_doA1_minus_doA0_population_effect']=='1'
          assert b['oracle_doA1_minus_doA0_population_effect']=='0'
          assert all(r['state']=='contradictory' and r['consistency']=='1/2'
                     for r in by['CONTRADICTORY_A_XOR_U']['complete_truth_table'])
          assert by['CONTRADICTORY_A_XOR_U']['conservative_dnf_cubes']==[]
          assert by['AND_AB']['conservative_dnf_cubes']==[[1,1,-1]]
          assert by['OR_AB']['conservative_dnf_cubes']==[[-1,1,-1],[1,-1,-1]]
          for fn,key in [('R239_ALL_144_ORIGINAL_CONFIGURATION_CAUSAL_SOURCES.csv','source_sha256'),
                         ('R239_EXACT_RESULTS.json','results_sha256')]:
            assert machine[key]==hashlib.sha256((d/fn).read_bytes()).hexdigest()
          assert machine['new_real_human_E2']==machine['new_real_historical_E3']==0
          print('R239_ALL_144_QCA_COMPLETE_SOURCES_AND_LOGICAL_REMAINDER_CAUSAL_ALIASES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R239-Nine-QCA-Complete-Source-Worlds
          path: |
            research/R239/R239_ALL_144_ORIGINAL_CONFIGURATION_CAUSAL_SOURCES.csv
            research/R239/R239_EXACT_RESULTS.json
            research/R239/R239_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive exact QCA source atoms and truth tables
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R239/R239_ALL_144_ORIGINAL_CONFIGURATION_CAUSAL_SOURCES.csv research/R239/R239_EXACT_RESULTS.json research/R239/R239_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R239): 144 original crisp QCA source cases, truth tables and causal aliases'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
