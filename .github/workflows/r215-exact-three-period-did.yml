name: R215 Exact Three-Period Difference in Differences and All Original Group Shocks
on:
  push:
    paths:
      - 'research/R215/r215_exact_three_period_did.py'
      - '.github/workflows/r215-exact-three-period-did.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-parallel-trend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact finite difference-in-differences, anticipation and pretrend audits
        run: python research/R215/r215_exact_three_period_did.py --test
  full-768-source-DID-archive:
    needs: dual-python-parallel-trend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit all original pretrend and postshock panels, score identities and SHA
        run: |
          python research/R215/r215_exact_three_period_did.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from fractions import Fraction as F
          from pathlib import Path
          p=Path('research/R215')
          r=json.loads((p/'R215_EXACT_RESULTS.json').read_text())
          a=json.loads((p/'R215_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert r['catalogue_id']==a['catalogue_id']=='09-006'
          assert r['all_worlds']==a['worlds']==12
          assert r['full_original_panel_source_rows']==a['original_complete_group_time_panel_sources']==768
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert r['fixed_independent_source_method_variances']=={
            'STANDARD_DID':'4','PRE_TREND_PLACEBO':'4','LINEAR_PRETREND_CORRECTED':'12'}
          worlds={w['world']:w for w in r['worlds']}
          x=worlds['PARALLEL_TAU_TWO']['complete_joint_actual_observed_distribution']
          assert x==worlds['POST_SHOCK_FALSE']['complete_joint_actual_observed_distribution']
          assert x==worlds['POST_SHOCK_WITH_TAU_MINUS_ONE']['complete_joint_actual_observed_distribution']
          assert [worlds[n]['true_structural_post_treated_ATT_exact']
                  for n in ['PARALLEL_TAU_TWO','POST_SHOCK_FALSE','POST_SHOCK_WITH_TAU_MINUS_ONE']]==['2','0','-1']
          assert worlds['POST_SHOCK_FALSE']['PRE_TREND_PLACEBO']['full_source_expected_estimate_exact']=='0'
          for w in r['worlds']:
            assert w['original_source_probability_sum']=='1'
            for method in ('STANDARD_DID','LINEAR_PRETREND_CORRECTED'):
              assert F(w[method]['source_EXPECTED_squared_error_to_true_ATT_exact'])==F(w[method]['bias_squared_plus_variance_exact'])
            for method in ('STANDARD_DID','LINEAR_PRETREND_CORRECTED','PRE_TREND_PLACEBO'):
              assert F(w[method]['original_noise_variance_exact'])==F(r['fixed_independent_source_method_variances'][method])
          with (p/'R215_ALL_768_ORIGINAL_GROUP_TIME_SHOCK_PANELS.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==768
          assert all(row['original_source_probability']=='1/64' for row in rows)
          for name,key in [('R215_EXACT_RESULTS.json','result_sha256'),
                           ('R215_ALL_768_ORIGINAL_GROUP_TIME_SHOCK_PANELS.csv','sources_sha256')]:
            assert a[key]==hashlib.sha256((p/name).read_bytes()).hexdigest()
          print('R215_12_COMPLETE_DID_WORLDS_768_TRUE_ORIGINAL_GROUP_TIME_NOISE_PANELS_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R215-All-12-DID-Worlds-And-768-Original-Exogenous-Group-Shock-Source-Panels
          path: |
            research/R215/R215_EXACT_RESULTS.json
            research/R215/R215_ALL_768_ORIGINAL_GROUP_TIME_SHOCK_PANELS.csv
            research/R215/R215_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all original artificial three-period DID source panels to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R215/R215_EXACT_RESULTS.json research/R215/R215_ALL_768_ORIGINAL_GROUP_TIME_SHOCK_PANELS.csv research/R215/R215_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R215): exact all DID untreated trend and original group-time shock source outcomes'
            git push origin HEAD:main
          fi
