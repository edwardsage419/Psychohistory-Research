name: R125 ER 1959 fixed-m versus Gilbert 1959 independent-p exact finite graph math

on:
  push:
    paths:
      - '.github/workflows/r125-erdos-renyi-gilbert-1959-exact-random-graphs-54-tests.yml'
      - 'research/R125/r125_erdos_renyi_gnm_gilbert_gnp_exact.py'
      - 'research/R125/test_r125_erdos_renyi_gnm_gilbert_gnp_exact.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-1959-independent-connectivity-and-conditional-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run 54 actual source-grounded mathematical unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R125 python -m unittest -v \
            research/R125/test_r125_erdos_renyi_gnm_gilbert_gnp_exact.py \
            2>&1 | tee /tmp/r125_actual_tests.log
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r125_actual_tests.log').read_text()
          assert re.findall(r'Ran (\d+) tests? in',log)==['54'],('R125_EXACT_54_TEST_COUNT_EXPECTED',log[-1800:])
          assert re.search(r'\nOK\s*$',log),'R125_UNIT_TESTS_NOT_ALL_SUCCESSFUL'
          print('R125_54_ACTUAL_TESTS_SUCCESS')
          PY
      - name: Independently replay original Gilbert recurrence versus 1099 exact graphs and 25 Gnm buckets
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R125 python - <<'PY'
          from fractions import Fraction as F
          import hashlib,json,pathlib
          import r125_erdos_renyi_gnm_gilbert_gnp_exact as m

          frozen=m.frozen_four_vertex_comparison()
          assert frozen['available_edges']==6
          assert frozen['fixed_m']==3
          assert frozen['Gnm_m3_number_of_possible_graphs']==20
          assert frozen['Gnm_m3_connected_graphs']==16
          assert frozen['Gnp_p_half_connected_graphs']==38
          assert frozen['Gnm_m3_connectivity']=='4/5'
          assert frozen['Gnp_p_half_connectivity']=='19/32'
          assert frozen['Gnp_p_half_exactly_3_edges_mass']=='5/16'
          assert frozen['Gnp_conditional_specific_three_edge_graph_mass']=='1/20'
          assert frozen['Gnm_expected_isolates']=='1/5'
          assert frozen['Gnp_expected_isolates']=='1/2'
          assert frozen['Gnm_edge_number_variance']=='0'
          assert frozen['Gnp_edge_number_variance']=='3/2'

          audit=m.audit_all_small_graphs()
          assert audit['enumerated_graphs_by_n']=={'1':1,'2':2,'3':8,'4':64,'5':1024}
          assert audit['unique_labeled_graphs_total']==1099
          assert audit['Gnp_graph_probability_weighings_total']==4396
          assert audit['Gnm_fixed_m_distribution_buckets_by_n']=={'1':1,'2':2,'3':4,'4':7,'5':11}
          assert audit['Gnm_distribution_bucket_count']==25
          assert audit['same_exact_distribution_Gnp_conditioned_edge_count_as_Gnm_all_valid_n_m']
          assert audit['Gnp_connected_and_isolates_by_n_p']['4:1/2']=={
              'connectivity_probability':'19/32','expected_isolates':'1/2'}
          root=pathlib.Path('research/R125')
          to_hash=[
              'r125_erdos_renyi_gnm_gilbert_gnp_exact.py',
              'test_r125_erdos_renyi_gnm_gilbert_gnp_exact.py',
              'R125_ERDOS_RENYI_GNM_GILBERT_GNP_FIRSTPARTY_FINITE_EXACT_SCIENTIFIC_REPORT_2026-10-20.md'
          ]
          hashes={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in to_hash}
          outcome={
              'research_id':'R125','phase':'A',
              'status':'R125_ORIGINAL_ER_GNM_GILBERT_GNP_54_TEST_1099_GRAPH_4396_GNP_MATH_PASS',
              'original_model_catalogue_item':'04-018','priority':'P0',
              'source_1959_Erdos_Renyi_original_primary':'On Random Graphs I, Publ Math Debrecen 6:290-297',
              'source_1959_Erdos_Renyi_print_pages_directly_read':[290,291],
              'source_1959_Gilbert_original_DOI':'10.1214/aoms/1177706098',
              'source_1959_Gilbert_print_pages_directly_read':[1141,1142],
              'source_1960_critical_giant_asymptotic_full_proof_reproduced':False,
              'first_party_verified_m_distinction':'Erdos Renyi 1959 G(n,m) uniform exact m edges, Gilbert 1959 G(n,p) independent Bernoulli p on each edge',
              'first_party_verified_Gilbert_p1142_Eq4':'P1=1; Pn=1-sum_{k=1}^{n-1} binom(n-1,k-1)*Pk*(1-p)^(k(n-k))',
              'source_definition_based_four_node_conditional_counterexample':frozen,
              'small_graph_exhaustive_all_graphs_and_probabilities':audit,
              'original_1959_2000_infinite_n_connectivity_limit_not_claimed_as_finite_exact':True,
              'actual_independent_unit_tests_executed':54,'unit_test_failures':0,
              'source_test_scientific_report_SHA256':hashes,
              'new_real_human_social_graph_individual_data_loaded':False,
              'new_real_human_E2_prediction_scores':0,
              'historical_social_forecasting_causally_established':False,
              'R073':'FROZEN','PESEN_v0_1':'FROZEN'
          }
          out=root/'R125_PHASE_A_GNM_GNP_54_TEST_1099_GRAPH_25_BUCKET_CI_ACCEPTANCE.json'
          out.write_text(json.dumps(outcome,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R125_GENUINE_MACHINE_SOURCE_SHA',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Commit real CI receipt with exact source sha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R125/R125_PHASE_A_GNM_GNP_54_TEST_1099_GRAPH_25_BUCKET_CI_ACCEPTANCE.json
          git commit -m "results(R125): original Gnm/Gnp 54 tests, 1099 labeled graphs and 4396 weighted cases verified"
          git pull --rebase origin main
          git push origin HEAD:main
