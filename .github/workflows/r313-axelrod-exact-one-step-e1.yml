name: R313 Axelrod Exact One Step E1
on:
  push:
    paths:
      - 'research/R313/**'
      - 'research/catalogue_audit/independent_r313_source_audit.py'
      - '.github/workflows/r313-axelrod-exact-one-step-e1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 29 exact rational tests including full archive replay
        run: python research/R313/r313_exact_axelrod.py --test
      - name: Verify 512 source atoms and all 64 transition kernels
        run: python research/R313/r313_exact_axelrod.py --audit
  independent-replay:
    needs: exact-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone independent source to transition distribution audit
        run: python research/catalogue_audit/independent_r313_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: R313-Original512-Exact64-World-E1-Only
          path: |
            research/R313/R313_ALL_512_ORIGINAL_FEATURE_SOURCE_ATOMS.csv
            research/R313/R313_EXACT_64_WORLD_ONE_STEP_RESULTS.json
          retention-days: 90
