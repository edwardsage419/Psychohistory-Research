name: R233 Exact Cross Group Measurement Invariance and Latent Anchoring
on:
  push:
    paths:
      - 'research/R233/r233_exact_measurement_invariance.py'
      - '.github/workflows/r233-exact-measurement-invariance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-invariance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact group mean/covariance parameter flags and observational aliases
        run: python research/R233/r233_exact_measurement_invariance.py --test
  full-original-group-measurement-archive:
    needs: dual-python-invariance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all 256 structural group sources and independent source verification
        run: |
          python research/R233/r233_exact_measurement_invariance.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R233')
          original=list(csv.DictReader((d/'R233_ALL_256_ORIGINAL_TWO_GROUP_MEASUREMENT_SOURCES.csv').open()))
          result=json.loads((d/'R233_EXACT_RESULTS.json').read_text())
          machine=json.loads((d/'R233_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(original)==256 and len(result['world_results'])==8
          assert result['original_catalogue_id']==machine['original_catalogue_id']=='10-007'
          assert all(F(row['original_probability'])==F(1,32) for row in original)
          by={x['world']:x for x in result['world_results']}
          for name,world in by.items():
            rs=[r for r in original if r['world']==name]
            assert len(rs)==32 and sum((F(x['original_probability']) for x in rs),F(0))==1
            assert len({(r['observed_group_G'],r['oracle_original_T'],r['independent_E1'],
                         r['independent_E2'],r['independent_E3']) for r in rs})==32
            for g in ('0','1'):
              subset=[r for r in rs if r['observed_group_G']==g]
              assert len(subset)==16
              assert sum((F(r['original_probability']) for r in subset),F(0))==F(1,2)
            assert len(world['group_observed_mean_differences'])==3
          a,b=by['TRUE_LATENT_MEAN_SHIFT'],by['INTERCEPT_SHIFT_ALIAS']
          assert a['full_observed_group_item_joint']==b['full_observed_group_item_joint']
          assert a['group_observed_mean_differences']==b['group_observed_mean_differences']==['1','1','1']
          assert a['oracle_group_true_latent_mean_difference']=='1'
          assert b['oracle_group_true_latent_mean_difference']=='0'
          assert a['raw_structural_parameter_invariance']['raw_scalar_intercepts_equal']
          assert not b['raw_structural_parameter_invariance']['raw_scalar_intercepts_equal']
          assert by['FULL_STRICT_INVARIANT']['full_observed_group_item_joint']==by['LATENT_SCALE_ALIAS']['full_observed_group_item_joint']
          assert by['LATENT_SCALE_ALIAS']['raw_structural_parameter_invariance']['raw_metric_equal']==False
          assert by['PARTIAL_SCALAR_ITEM1']['group_observed_mean_differences']==['1','0','0']
          assert by['STRICT_RESIDUAL_VARIANCE_CHANGE']['group_conditional_covariances']['1'][0][0]=='5'
          assert not by['CONFIGURAL_ITEM3_DETACHED']['raw_structural_parameter_invariance']['raw_configural_equal']
          for fn,key in [('R233_ALL_256_ORIGINAL_TWO_GROUP_MEASUREMENT_SOURCES.csv','source_sha256'),
                         ('R233_EXACT_RESULTS.json','result_sha256')]:
            assert machine[key]==hashlib.sha256((d/fn).read_bytes()).hexdigest()
          assert machine['new_real_human_E2']==machine['new_real_historical_E3']==0
          print('R233_FULL_256_GROUP_SOURCES_AND_LATENT_MEAN_INTERCEPT_ALIASES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R233-Original-Eight-Multi-Group-Measurement-Worlds
          path: |
            research/R233/R233_ALL_256_ORIGINAL_TWO_GROUP_MEASUREMENT_SOURCES.csv
            research/R233/R233_EXACT_RESULTS.json
            research/R233/R233_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all structural sources and checked summary to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R233/R233_ALL_256_ORIGINAL_TWO_GROUP_MEASUREMENT_SOURCES.csv research/R233/R233_EXACT_RESULTS.json research/R233/R233_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R233): all 256 complete two-group measurement sources and exact invariance aliases'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
