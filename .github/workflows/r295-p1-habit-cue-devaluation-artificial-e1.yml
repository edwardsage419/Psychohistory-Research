name: R295 Habit Cue and Outcome Devaluation Exact E1
on:
  push:
    paths:
      - 'research/R295/r295_exact_habit_cue_devaluation.py'
      - 'research/catalogue_audit/independent_r295_source_audit.py'
      - '.github/workflows/r295-p1-habit-cue-devaluation-artificial-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 731 finite artificial math unittests
        run: python research/R295/r295_exact_habit_cue_devaluation.py --test
      - name: Emit all 180 original sources and independently verify 90 pairs
        run: |
          python research/R295/r295_exact_habit_cue_devaluation.py --emit
          python research/catalogue_audit/independent_r295_source_audit.py --test
          python research/catalogue_audit/independent_r295_source_audit.py --audit
  independent-archive:
    needs: dual-python-math
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent full source replay without model imports
        run: |
          python research/R295/r295_exact_habit_cue_devaluation.py --emit
          python research/catalogue_audit/independent_r295_source_audit.py --test
          python research/catalogue_audit/independent_r295_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: R295-180-Habit-Revaluation-Sources-and-90-Pairs
          path: |
            research/R295/R295_ALL_180_ORIGINAL_HABIT_CUE_REVALUATION_STATES.csv
            research/R295/R295_EXACT_HABIT_CUE_AND_DEVALUATION_RESULTS.json
            research/R295/R295_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive exact synthetic original source, result and hash
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R295/R295_ALL_180_ORIGINAL_HABIT_CUE_REVALUATION_STATES.csv research/R295/R295_EXACT_HABIT_CUE_AND_DEVALUATION_RESULTS.json research/R295/R295_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R295): exact habit cue and outcome devaluation original sources'
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then echo R295_ORIGINAL_180_SOURCES_ARCHIVED; exit 0; fi
              sleep 2
            done
            exit 1
          fi
