name: R203 Exact SAR SEM IID 15 Artificial Spatial Worlds
on:
  push:
    paths:
      - 'research/R203/r203_exact_spatial_regression.py'
      - '.github/workflows/r203-exact-spatial-regression.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-exact-spatial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate complete spatial fraction inversion, SAR SEM and exact independent regions
        run: python research/R203/r203_exact_spatial_regression.py --test
  archive-all-true-source-spatial-train-test:
    needs: dual-python-exact-spatial-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 15 worlds, all 240 training shocks and 3840 independent region pair scores
        run: |
          python research/R203/r203_exact_spatial_regression.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          p=Path("research/R203")
          r=json.loads((p/"R203_EXACT_RESULTS.json").read_text())
          a=json.loads((p/"R203_FINAL_MACHINE_ACCEPTANCE.json").read_text())
          for file,count in [
              ("R203_ALL_240_ORIGINAL_SPATIAL_TRAINING_WORLDS.csv",240),
              ("R203_ALL_3840_INDEPENDENT_TEST_SOURCE_PAIRS.csv",3840),
          ]:
              with (p/file).open(newline="") as f:
                  assert sum(1 for _ in csv.DictReader(f))==count
          assert len(r["worlds"])==a["total_worlds"]==15
          assert a["full_original_training_samples"]==240
          assert a["full_independent_train_test_pair_records"]==3840
          assert r["new_real_human_E2"]==r["new_real_historical_E3"]==0
          assert r["diagnostics"]["ols_unadjusted_under_SEM_POS"]["SMOOTH"]["actual_to_naive_variance_ratio"]=="4"
          assert r["diagnostics"]["ols_unadjusted_under_SEM_POS"]["ALTERNATING"]["actual_to_naive_variance_ratio"]=="4/9"
          for f,key in [
              ("R203_EXACT_RESULTS.json","results_sha256"),
              ("R203_ALL_240_ORIGINAL_SPATIAL_TRAINING_WORLDS.csv","training_source_sha256"),
              ("R203_ALL_3840_INDEPENDENT_TEST_SOURCE_PAIRS.csv","independent_test_pairs_sha256"),
          ]:
              assert a[key]==hashlib.sha256((p/f).read_bytes()).hexdigest()
          print("R203_SPATIAL_15_WORLDS_240_TRAIN_3840_INDEPENDENT_E1_ACCEPTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R203-15-Spatial-Worlds-3840-Independent-Area-Scores
          path: |
            research/R203/R203_EXACT_RESULTS.json
            research/R203/R203_ALL_240_ORIGINAL_SPATIAL_TRAINING_WORLDS.csv
            research/R203/R203_ALL_3840_INDEPENDENT_TEST_SOURCE_PAIRS.csv
            research/R203/R203_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive full artificial spatial study to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R203/R203_EXACT_RESULTS.json research/R203/R203_ALL_240_ORIGINAL_SPATIAL_TRAINING_WORLDS.csv research/R203/R203_ALL_3840_INDEPENDENT_TEST_SOURCE_PAIRS.csv research/R203/R203_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R203): all exact spatial training regions and independent out-of-region evidence'
            git push origin HEAD:main
          fi
