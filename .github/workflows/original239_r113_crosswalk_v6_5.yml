name: Original239 existing R113 Crosswalk v6.5
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v6.5_2026-10-24.json'
      - 'research/catalogue_audit/verify_original239_v6_5_existing_r113.py'
      - '.github/workflows/original239_r113_crosswalk_v6_5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact original239 identities and pending queue
        run: python research/catalogue_audit/verify_original239_v6_5_existing_r113.py
