name: Original239 existing R124 Crosswalk v7.4
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.4_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_159_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - 'docs/ORIGINAL239_04-015_R124_E1_REATTRIBUTION_ACCEPTANCE.json'
      - 'research/catalogue_audit/verify_original239_v7_4_existing_r124.py'
      - '.github/workflows/original239_r124_crosswalk_v7_4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify 239 identities, R124 bounded E1 and 159 pending items
        run: python research/catalogue_audit/verify_original239_v7_4_existing_r124.py
