name: R216 Exact Staggered Event Study and 24576 Original Group Time Panels
on:
  push:
    paths:
      - 'research/R216/r216_exact_staggered_event_study.py'
      - '.github/workflows/r216-exact-staggered-event-study.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-staggered-event-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact cohort time group event study and source aliasing tests
        run: python research/R216/r216_exact_staggered_event_study.py --test
  permanently-archive-24576-full-group-time-source-panels:
    needs: dual-python-staggered-event-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit all complete staggered group-time sources and check Fraction score identities
        run: |
          python research/R216/r216_exact_staggered_event_study.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          p=Path('research/R216')
          r=json.loads((p/'R216_EXACT_RESULTS.json').read_text())
          a=json.loads((p/'R216_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert r['actual_original_239_catalogue_id']==a['actual_239_catalogue_id']=='09-007'
          assert len(r['six_artificial_scm_worlds'])==a['complete_artificial_worlds']==6
          assert r['original_complete_twelve_shock_source_histories']==a['full_original_group_time_shock_histories']==24576
          assert len(r['summaries'])==a['full_fixed_contrast_risk_configs']==36
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert r['whole_observed_panel_aliases_true_causal_world_vs_postshock_false_world']
          assert not r['this_specific_BAD_contrast_is_actual_TWFE_event_study_coefficient']
          assert all(row['source_noise_probability_sum']=='1' for row in r['summaries'])
          for s in r['summaries']:
            assert s['exact_expected_observed_contrast']==s['full_4096_original_noise_source_mean']
            assert s['analytic_independent_eps_variance_exact']==s['full_4096_original_eps_variance_exact']=='4'
            assert s['analytic_true_target_MSE_exact']==s['full_4096_original_eps_MSE_exact']
          with (p/'R216_ALL_24576_ORIGINAL_STAGGERED_GROUP_TIME_SHOCK_PANELS.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==24576
          assert all(row['complete_artificial_original_source_probability']=='1/4096' for row in rows)
          assert all(len(row['six_estimates_using_actual_observed_only'].split('|'))==6 for row in rows)
          valid={x['source_twelve_independent_group_time_shock_bitmask']:x['all_twelve_actually_observed_group_time_outcomes']
                 for x in rows if x['true_artificial_world']=='VALID_DYNAMIC'}
          for row in rows:
            if row['true_artificial_world']=='POST_EVENT_SHOCK_MIMIC':
              assert row['all_twelve_actually_observed_group_time_outcomes']==valid[row['source_twelve_independent_group_time_shock_bitmask']]
          for file,key in [
            ('R216_EXACT_RESULTS.json','results_sha256'),
            ('R216_ALL_24576_ORIGINAL_STAGGERED_GROUP_TIME_SHOCK_PANELS.csv','source_sha256'),
          ]:
            assert a[key]==hashlib.sha256((p/file).read_bytes()).hexdigest()
          print('R216_SIX_STAGGERED_WORLDS_24576_ORIGINAL_SOURCES_36_INDEPENDENT_FRACTION_SCORES_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R216-Six-Staggered-Cohort-Worlds-24576-Original-Panel-Sources
          path: |
            research/R216/R216_EXACT_RESULTS.json
            research/R216/R216_ALL_24576_ORIGINAL_STAGGERED_GROUP_TIME_SHOCK_PANELS.csv
            research/R216/R216_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently store all complete original staggered event-study sources on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R216/R216_EXACT_RESULTS.json research/R216/R216_ALL_24576_ORIGINAL_STAGGERED_GROUP_TIME_SHOCK_PANELS.csv research/R216/R216_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R216): complete staggered event-study source panels and clean vs already-treated controls'
            git push origin HEAD:main
          fi
