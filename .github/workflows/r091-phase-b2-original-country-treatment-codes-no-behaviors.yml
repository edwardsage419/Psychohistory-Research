name: R091 original Jonsson first-party treatment and country source labels only after fail-closed
on:
  push:
    paths:
      - '.github/workflows/r091-phase-b2-original-country-treatment-codes-no-behaviors.yml'
      - 'research/R091/r091_phase_b2_author_original_categorical_only.py'
      - 'research/R091/test_r091_phase_b2_author_original_categorical_only.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetics-original-source-and-strict-category-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<3.2'
          PYTHONPATH=research/R091 python -m unittest -v             research/R091/test_r091_author_2025_disaster_xlsx_source_only_gate.py             research/R091/test_r091_phase_b_main_sheet_group_time_roster_only.py             research/R091/test_r091_phase_b2_author_original_categorical_only.py
  fixed-source-bounded-original-country-treatment-codebook-nonbehavior:
    needs: synthetics-original-source-and-strict-category-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<3.2'
      - name: Read ONLY two original experiment category columns after full Git blob check, no original human contribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r091_category_private
          PYTHONPATH=research/R091 python             research/R091/r091_phase_b2_author_original_categorical_only.py             --output /tmp/r091_category_private/labels.json
          python - <<'PY'
          import json,hashlib,pathlib
          b=pathlib.Path('/tmp/r091_category_private/labels.json').read_bytes()
          r=json.loads(b)
          assert r["phase"]=="B2_ORIGINAL_AUTHOR_CATEGORICAL_LABELS_ONLY"
          assert r["first_source_country_treatment_mismatch_failure_retained"]
          assert r["safe_original_treatment_and_country_labels"]["original_main_actor_round_rows"]==15200
          assert not r["real_four_person_group_scores_computed"]
          print("R091_SOURCE_TREATMENT_COUNTRY_CATEGORIES_BYTES",len(b))
          print("R091_SOURCE_TREATMENT_COUNTRY_CATEGORIES_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r091-fixed-Git-original-treatment-country-labels-only
          path: /tmp/r091_category_private/labels.json
          retention-days: 30
          if-no-files-found: ignore
      - if: always()
        run: rm -rf /tmp/r091_category_private
