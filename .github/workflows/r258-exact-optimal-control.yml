name: R258 Nine Finite Horizon Stochastic Control and Exhaustive Policies
on:
  push:
    paths:
      - 'research/R258/r258_exact_finite_stochastic_control.py'
      - '.github/workflows/r258-exact-optimal-control.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify original 1728 source paths, Bellman and all 512 nonclairvoyant policies
        run: python research/R258/r258_exact_finite_stochastic_control.py --test
  all-original-control-source-archive:
    needs: dual-python-control-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source trajectories, expected feedback and open loop inequalities and SHA
        run: |
          python research/R258/r258_exact_finite_stochastic_control.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          from fractions import Fraction as F
          d=Path('research/R258')
          src=list(csv.DictReader((d/'R258_ALL_1728_ORIGINAL_THREESTEP_CONTROL_SOURCE_ATOMS.csv').open()))
          j=json.loads((d/'R258_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R258_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(src)==1728 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-018'
          assert j['prescore_freeze_commit']=='62b3cff2023ec7f4d0a35dbb408a6b24c8d6f5ae'
          assert j['distinct_legal_deterministic_Markov_feedback_policies_exhausted']==512
          assert j['distinct_open_loop_action_sequences_exhausted']==8
          assert 'before seeing current/future shock' in j['decision_timing']
          expected={
           'NO_SHOCK_EXPENSIVE':(['0','3','9'],['0','3','9']),
           'NO_SHOCK_CHEAP':(['0','5/4','11/2'],['0','5/4','11/2']),
           'HALF_SHOCK_LOW_ACTION':(['3/4','21/8','77/8'],['3/4','21/8','77/8']),
           'HALF_SHOCK_MEDIUM':(['5/2','9/2','47/4'],['5/2','19/4','95/8']),
           'HALF_SHOCK_HIGH':(['35/8','75/8','16'],['35/8','75/8','16']),
           'QUARTER_SHOCK_MEDIUM':(['5/4','13/4','293/32'],['53/32','117/32','603/64']),
           'THREEQUARTER_SHOCK_MEDIUM':(['11/4','45/8','949/64'],['11/4','367/64','959/64']),
           'ALWAYS_SHOCK_MEDIUM':(['3','7','16'],['3','7','16']),
           'HALF_SHOCK_NO_TERMINAL':(['3/2','7/2','10'],['3/2','15/4','10'])}
          by={w['world']:w for w in j['world_results']}
          assert set(by)==set(expected)
          for w,r in by.items():
              rows=[z for z in src if z['world']==w]
              assert len(rows)==192
              keys=['original_initial_state_x0']+['oracle_original_shock_R'+str(t)+s for t in range(3) for s in ('a','b')]
              assert len({tuple(z[k] for k in keys) for z in rows})==192
              assert all(F(z['original_uniform_initial_and_sixbit_source_mass'])==F(1,192) for z in rows)
              assert sum((F(z['original_uniform_initial_and_sixbit_source_mass']) for z in rows),F(0))==1
              v,op=expected[w]
              assert r['Bellman_V0_by_initial_state']==v
              assert r['exhaustive_512_feedback_policy_global_min_by_initial_state']==v
              assert r['best_of_8_open_loop_action_sequence_values']==op
              assert r['oracle_original_source_policy_cost_parity']
              assert r['full_exhaustive_admissible_feedback_policy_parity']
              assert r['all_eight_open_loop_strategies_checked']
              assert r['strictly_nonnegative_open_loop_value_gaps']==[str(F(a)-F(b)) for a,b in zip(op,v)]
              for initial in range(3):
                  cohort=[z for z in rows if z['original_initial_state_x0']==str(initial)]
                  assert len(cohort)==64
                  assert sum((F(z['original_uniform_initial_and_sixbit_source_mass'])*3 for z in cohort),F(0))==1
                  expectation=sum((F(z['observed_total_path_cost'],64) for z in cohort),F(0))
                  assert str(expectation)==v[initial],(w,initial,expectation)
              p=F(r['frozen_shock_probability'])
              k=F(r['frozen_action_cost_kappa'])
              tau=F(r['frozen_terminal_weight_tau'])
              for row in rows:
                  state=int(row['original_initial_state_x0'])
                  total=F(0)
                  for t in range(3):
                      assert int(row['observed_pre_action_state_x'+str(t)])==state
                      u=int(row['observed_chosen_feedback_action_u'+str(t)])
                      dshock=int(row['oracle_realized_post_action_shock_d'+str(t)])
                      assert u in (0,1) and dshock in (0,1)
                      R=2*int(row['oracle_original_shock_R'+str(t)+'a'])+int(row['oracle_original_shock_R'+str(t)+'b'])
                      assert dshock==int(F(R)<4*p)
                      stage=state*state+k*u
                      assert F(row['observed_stage_cost_c'+str(t)])==stage
                      total+=stage
                      state=min(2,max(0,state+dshock-u))
                      assert state==int(row['observed_next_state_x'+str(t+1)])
                  assert int(row['observed_terminal_state_x3'])==state
                  assert F(row['observed_terminal_cost'])==tau*state*state
                  assert F(row['observed_total_path_cost'])==total+tau*state*state
          assert by['HALF_SHOCK_MEDIUM']['strictly_nonnegative_open_loop_value_gaps']==['0','1/4','1/8']
          assert by['QUARTER_SHOCK_MEDIUM']['strictly_nonnegative_open_loop_value_gaps'][0]=='13/32'
          for filename,key in [('R258_ALL_1728_ORIGINAL_THREESTEP_CONTROL_SOURCE_ATOMS.csv','source_sha256'),
                               ('R258_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/filename).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R258_ALL_1728_ORIGINAL_BELLMAN_FEEDBACK_AND_512_LEGAL_POLICIES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R258-Finite-Horizon-Control-1728-Original-Sources
          path: |
            research/R258/R258_ALL_1728_ORIGINAL_THREESTEP_CONTROL_SOURCE_ATOMS.csv
            research/R258/R258_EXACT_RESULTS.json
            research/R258/R258_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all 1728 original optimal-control source atoms
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R258/R258_ALL_1728_ORIGINAL_THREESTEP_CONTROL_SOURCE_ATOMS.csv research/R258/R258_EXACT_RESULTS.json research/R258/R258_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R258): all 1728 original three-stage optimal control source atoms'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R258_ALL_1728_ORIGINAL_CONTROL_SOURCE_ATOMS_PERMANENTLY_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
