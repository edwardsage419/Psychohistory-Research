name: Original239 existing R125 Crosswalk v7.5
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.5_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_158_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - 'docs/ORIGINAL239_04-018_R125_E1_REATTRIBUTION_ACCEPTANCE.json'
      - '.github/workflows/original239_r125_crosswalk_v7_5.yml'
permissions:
  contents: read
jobs:
  verify_catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original239 239 rows, 158 queue and R125 bounded scope
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, hashlib
          from pathlib import Path
          root=Path("docs")
          x=json.loads((root/"ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.5_2026-10-24.json").read_text())
          a=json.loads((root/"ORIGINAL239_04-018_R125_E1_REATTRIBUTION_ACCEPTANCE.json").read_text())
          with (root/"ORIGINAL_239_PENDING_158_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv").open(newline="") as f:
              q=list(csv.DictReader(f))
          assert len(x["rows"])==239 and x["total_original_models"]==239
          assert x["provisional_itemwise_audit_open_count"]==158
          assert x["status_counts"]["PROVISIONAL_PRIMARY_README_LINK"]==158
          assert sum(x["status_counts"].values())==239
          assert len(q)==158 and len({r["catalogue_id"] for r in q})==158
          assert "04-018" not in {r["catalogue_id"] for r in q}
          r=next(r for r in x["rows"] if r["catalogue_id"]=="04-018")
          assert r["proposed_primary_research_id"]=="R125"
          assert r["scientific_evidence_grade"]=="BOUNDED_EXISTING_E1_MATRIX_TREE_EXACT_FINITE_CONSTRUCTED_GRAPHS_ONLY"
          assert r["method_specific_E1_acceptance"]=="docs/ORIGINAL239_04-018_R125_E1_REATTRIBUTION_ACCEPTANCE.json"
          assert a["CI_final_status"]=="completed/success" and a["final_successful_CI_run"]==40095044503
          assert a["new_real_human_E2"]==0 and a["new_historical_E3"]==0
          data=Path(a["raw_csv_path"]).read_bytes()
          assert hashlib.sha256(data).hexdigest()==a["raw_csv_sha256"]
          print("PASS 239 entries, 158 pending, R125 exact bounded E1, pinned CSV")
          PY
