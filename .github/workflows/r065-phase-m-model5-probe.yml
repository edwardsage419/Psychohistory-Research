name: R065 Phase M Model5 fixed-parameter post-failure diagnostic

on:
  push:
    paths:
      - 'research/R065/r065_phase_m_model5_fixed_param_diagnostic.py'
      - 'research/R065/test_r065_phase_m_model5_fixed_param_diagnostic.py'
      - '.github/workflows/r065-phase-m-model5-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fixed parameter contract and replay error rejection
        working-directory: research/R065
        run: python -m unittest -v test_r065_phase_m_model5_fixed_param_diagnostic

  original-model5-fixed-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install --no-cache-dir numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Retrieve byte-hash verified author Model5 and original participant sources
        shell: bash
        run: |
          set -euo pipefail
          repo='https://raw.githubusercontent.com/arielevy8/obs-learning-fishing/fd5f435b5368b69916e7acc6a9991aa5f46b3ddb'
          mkdir -p /tmp/r065_probe_author /tmp/r065_probe_raw /tmp/r065_probe_output
          curl -fsSL --retry 2 "$repo/model_fitting/objectives.py" -o /tmp/r065_probe_author/objectives.py
          curl -fsSL --retry 2 "$repo/model_fitting/fit_utils.py" -o /tmp/r065_probe_author/fit_utils.py
          curl -fsSL --retry 2 "$repo/data/processed/unified_data_2025-01-16_00.csv" -o /tmp/r065_probe_processed.csv
          PYTHONPATH=research/R065 python - <<'PY'
          from pathlib import Path
          from r065_critical_replay import parse_verified
          from r065_phase_j_screened_replay import select_eligible
          from r065_phase_k_native_objectives import verified_upstream
          verified_upstream(Path('/tmp/r065_probe_author'))
          selected=select_eligible(parse_verified(Path('/tmp/r065_probe_processed.csv').read_bytes()),strict=True)
          ids=selected['first_high']+selected['first_low']
          if len(ids)!=24 or len(set(ids))!=24: raise ValueError('cohort mismatch')
          Path('/tmp/r065_probe_ids.txt').write_text('\n'.join(ids)+'\n')
          PY
          while IFS= read -r person; do
            curl -fsSL --retry 2 "$repo/data/$person.csv" -o "/tmp/r065_probe_raw/$person.csv"
          done < /tmp/r065_probe_ids.txt
      - name: Evaluate exactly four original Model5 latent fit vectors without optimization
        shell: bash
        run: |
          set -euo pipefail
          python research/R065/r065_phase_m_model5_fixed_param_diagnostic.py \
            --upstream-dir /tmp/r065_probe_author \
            --processed /tmp/r065_probe_processed.csv \
            --raw-dir /tmp/r065_probe_raw \
            --manifest research/R065/R065_PHASE_J_SCREENED_24_RESULTS.json \
            --output /tmp/r065_probe_output/model5_fixed.json
      - name: Archive aggregate fixed-parameter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r065-phase-m-model5-original-fixed-param-diagnostic
          path: /tmp/r065_probe_output/model5_fixed.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove per-person source rows
        if: always()
        shell: bash
        run: rm -rf /tmp/r065_probe_author /tmp/r065_probe_raw /tmp/r065_probe_processed.csv /tmp/r065_probe_ids.txt /tmp/r065_probe_output
