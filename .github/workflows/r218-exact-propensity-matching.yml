name: R218 Exact Propensity Stratification Hidden Confounding and Positivity
on:
  push:
    paths:
      - 'research/R218/r218_exact_propensity_matching.py'
      - '.github/workflows/r218-exact-propensity-matching.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-exact-matching-and-HT-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate 101 finite assignment sources, hidden confounding and strict common support
        run: python research/R218/r218_exact_propensity_matching.py --test
  archive-all-101-true-assignment-sources:
    needs: dual-python-exact-matching-and-HT-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit 101 original treatment sources and double-verify propensity and source probabilities
        run: |
          python research/R218/r218_exact_propensity_matching.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R218')
          r=json.loads((d/'R218_EXACT_RESULTS.json').read_text())
          a=json.loads((d/'R218_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert r['source_catalogue_id']==a['actual_239_catalogue_id']=='09-009'
          assert r['true_design_worlds']==a['worlds']==6
          assert r['all_original_treatment_assignment_histories']==a['full_original_assignment_source_rows']==101
          assert len(r['worlds'])==6
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          by={w['world']:w for w in r['worlds']}
          assert by['RANDOM_X_CONFOUNDED']['naive_unmatched_expectation_exact']=='3'
          assert by['RANDOM_X_CONFOUNDED']['observed_X_matching_expectation_exact']=='2'
          assert by['HIDDEN_U_BIASED']['observed_X_matching_expectation_exact']=='3'
          assert by['HIDDEN_U_BIASED']['privileged_true_inclusion_HT_expectation_exact']=='2'
          assert by['HIDDEN_ASSIGNMENT_NEG_CONTROL']['observed_X_matching_expectation_exact']=='2'
          assert by['POSITIVITY_FAILURE']['observed_X_matching_expectation_exact'] is None
          assert by['POSITIVITY_FAILURE']['privileged_true_inclusion_HT_expectation_exact'] is None
          assert all(w['full_assignment_probability_mass_exact']=='1' for w in r['worlds'])
          with (d/'R218_ALL_101_ORIGINAL_PROPENSITY_ASSIGNMENT_SOURCES.csv').open(newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==101
          assert all(row['observed_X_complete_matching_status'] in ('OK','NOT_IDENTIFIED_NO_COMMON_SUPPORT') for row in rows)
          assert sum(row['observed_X_complete_matching_status']=='NOT_IDENTIFIED_NO_COMMON_SUPPORT' for row in rows)==1
          for name,key in [
            ('R218_EXACT_RESULTS.json','results_sha256'),
            ('R218_ALL_101_ORIGINAL_PROPENSITY_ASSIGNMENT_SOURCES.csv','source_sha256')
          ]:
            assert a[key]==hashlib.sha256((d/name).read_bytes()).hexdigest()
          print('R218_SIX_WORLDS_101_ORIGINAL_PROPENSITY_ASSIGNMENTS_HIDDEN_U_AND_NO_SUPPORT_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R218-Complete-101-Finite-Propensity-Original-Sources
          path: |
            research/R218/R218_EXACT_RESULTS.json
            research/R218/R218_ALL_101_ORIGINAL_PROPENSITY_ASSIGNMENT_SOURCES.csv
            research/R218/R218_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all observed and oracle assignment sources on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R218/R218_EXACT_RESULTS.json research/R218/R218_ALL_101_ORIGINAL_PROPENSITY_ASSIGNMENT_SOURCES.csv research/R218/R218_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R218): original exact propensity matching treatment sources, hidden confounding and no support'
            git push origin HEAD:main
          fi
