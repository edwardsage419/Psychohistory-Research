name: R069 real HetRec Last.fm network and timestamped tags source gate

on:
  push:
    paths:
      - 'research/R069/r069_hetrec_lastfm_source_audit.py'
      - 'research/R069/test_r069_hetrec_lastfm_source_audit.py'
      - '.github/workflows/r069-hetrec-lastfm-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-measurement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no future friend tag leakage and strict zip source guards
        working-directory: research/R069
        run: python -m unittest -v test_r069_hetrec_lastfm_source_audit

  original-noncommercial-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original GroupLens HetRec archive, verify published checksum and audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r069_hetrec_anon
          python research/R069/r069_hetrec_lastfm_source_audit.py \
            --output /tmp/r069_hetrec_anon/anonymous_network_and_timestamp_gate.json
      - name: Archive only aggregated provenance, no Last.fm user behavior tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r069-hetrec-lastfm-original-noncommercial-anonymous-source
          path: /tmp/r069_hetrec_anon/anonymous_network_and_timestamp_gate.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Destroy temporary research aggregates
        if: always()
        shell: bash
        run: rm -rf /tmp/r069_hetrec_anon
