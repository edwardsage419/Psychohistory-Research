name: R070 archive complete deterministic 30240 activation output to main

on:
  push:
    paths:
      - '.github/workflows/r070-archive-full-30240.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproducible-exact-full-science-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all 30240 full E1 deterministic actor activation cases from tracked source
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s research/R070 -p test_r070_feasible_actor_activation.py -v
          python research/R070/r070_feasible_actor_activation.py \
            --output /tmp/full_30240_activation_results.json
          echo '213be6839db3067854d811a755ec9f3047d5f42def4e3df55f1fd56b835d1dcd  /tmp/full_30240_activation_results.json' | sha256sum --check --status
      - name: Commit only fully verified synthetic science JSON (no personal information)
        shell: bash
        run: |
          set -euo pipefail
          target=research/R070/R070_E1_FEASIBLE_ACTOR_ACTIVATION_COMPLETE_30240.json
          if [ -e "$target" ]; then
            cmp -s /tmp/full_30240_activation_results.json "$target"
            echo "Previously committed exact artifact verified: $target"
            exit 0
          fi
          cp /tmp/full_30240_activation_results.json "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git commit -m "results(R070): archive SHA-pinned full 30240 synthetic actor-activation experimental output"
          git push origin HEAD:main
