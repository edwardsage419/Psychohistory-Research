name: R196 Exact Finite Mean Field Variational Bayes 24 Worlds
on:
  push:
    paths:
      - 'research/R196/r196_finite_meanfield_variational_bayes.py'
      - '.github/workflows/r196-exact-finite-variational-bayes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-python-exact-VI-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact Bayes, factorization, 408 ELBO and two KL implementations
        run: |
          cd research/R196
          python r196_finite_meanfield_variational_bayes.py --test
  full-24-worlds-ELBO-scoring-and-permanent-archive:
    runs-on: ubuntu-latest
    needs: two-python-exact-VI-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 24 grid worlds and 408 full posterior and KL computations
        run: |
          cd research/R196
          python r196_finite_meanfield_variational_bayes.py --run-and-archive
          python - <<'PY'
          import csv,json,zipfile
          from pathlib import Path
          from hashlib import sha256
          d=json.loads(Path('R196_EXACT_RESULTS.json').read_text())
          a=json.loads(Path('R196_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          t=json.loads(Path('R196_ALL_12_EXACT_POSTERIOR_SOURCES.json').read_text())
          assert d['frozen_scoring_worlds']==24 and len(d['all_worlds'])==24
          assert d['total_all_candidate_scores']==408
          assert d['exact_source_evidence_configurations']==12
          assert t['source_evidence_worlds']==12 and len(t['exact_source_truths'])==12
          assert all(w['all_exact_Bayes_and_independent_ELBO_routes_verified'] for w in d['all_worlds'])
          with Path('R196_ALL_408_MEAN_FIELD_ELBO_CANDIDATES.csv').open() as f:
            assert sum(1 for _ in csv.DictReader(f))==408
          assert a['source_results_sha256']==sha256(Path('R196_EXACT_RESULTS.json').read_bytes()).hexdigest()
          assert a['candidate_CSV_sha256']==sha256(Path('R196_ALL_408_MEAN_FIELD_ELBO_CANDIDATES.csv').read_bytes()).hexdigest()
          assert a['exact_truth_sources_sha256']==sha256(Path('R196_ALL_12_EXACT_POSTERIOR_SOURCES.json').read_bytes()).hexdigest()
          assert d['new_E2']==d['new_E3']==0
          with zipfile.ZipFile('R196_24_Exact_Finite_Variational_Bayes_Worlds.zip') as z:
            assert len(z.namelist())==6 and z.testzip() is None
          print('R196_EXACT_FINITE_MEANFIELD_ELBO_KL_BAYES_POSTERIOR_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R196-24-exact-finite-variational-Bayes-worlds
          path: |
            research/R196/R196_EXACT_RESULTS.json
            research/R196/R196_ALL_408_MEAN_FIELD_ELBO_CANDIDATES.csv
            research/R196/R196_ALL_12_EXACT_POSTERIOR_SOURCES.json
            research/R196/R196_FINAL_MACHINE_ACCEPTANCE.json
            research/R196/R196_24_Exact_Finite_Variational_Bayes_Worlds.zip
          retention-days: 90
      - name: Permanently archive complete bounded E1 variational Bayes evidence
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R196/R196_EXACT_RESULTS.json research/R196/R196_ALL_408_MEAN_FIELD_ELBO_CANDIDATES.csv research/R196/R196_ALL_12_EXACT_POSTERIOR_SOURCES.json research/R196/R196_FINAL_MACHINE_ACCEPTANCE.json research/R196/R196_24_Exact_Finite_Variational_Bayes_Worlds.zip
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R196): exact latent posteriors and nested-grid mean-field variational ELBO evidence'
            git push origin HEAD:main
          fi
