name: R204 Exact Finite GP 12 Worlds 912 Sources
on:
  push:
    paths:
      - 'research/R204/r204_exact_finite_gp.py'
      - '.github/workflows/r204-exact-finite-gp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-gp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate exact GP posterior projection and finite source holdout
        run: python research/R204/r204_exact_finite_gp.py --test
  permanent-complete-gp-source-and-heldout-archive:
    runs-on: ubuntu-latest
    needs: dual-python-gp-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit and crosscheck all 912 exact original source records and 12 GP worlds
        run: |
          python research/R204/r204_exact_finite_gp.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          d=Path("research/R204")
          a=json.loads((d/"R204_FINAL_MACHINE_ACCEPTANCE.json").read_text())
          r=json.loads((d/"R204_EXACT_RESULTS.json").read_text())
          with (d/"R204_ALL_912_REAL_SOURCE_GP_TRAIN_AND_HELDOUT.csv").open(newline="") as f:
              records=list(csv.DictReader(f))
          assert len(records)==a["all_original_finite_source_rows"]==912
          assert len(r["worlds"])==a["worlds"]==12
          assert r["new_real_human_E2"]==r["new_real_historical_E3"]==0
          assert sorted(set(k["split"] for k in r["worlds"]))==["EXTRAPOLATION","GAP","INTERPOLATION"]
          assert all(k["source_probability_sum"]=="1" for k in r["worlds"])
          assert a["results_sha256"]==hashlib.sha256((d/"R204_EXACT_RESULTS.json").read_bytes()).hexdigest()
          assert a["all_original_source_sha256"]==hashlib.sha256((d/"R204_ALL_912_REAL_SOURCE_GP_TRAIN_AND_HELDOUT.csv").read_bytes()).hexdigest()
          print("R204_GP_ALL_12_WORLDS_912_SOURCE_OBSERVATIONS_HOLDOUT_E1_ACCEPTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R204-Exact-912-GP-Source-Heldout-Records
          path: |
            research/R204/R204_EXACT_RESULTS.json
            research/R204/R204_ALL_912_REAL_SOURCE_GP_TRAIN_AND_HELDOUT.csv
            research/R204/R204_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently save true full GP source audit to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R204/R204_EXACT_RESULTS.json research/R204/R204_ALL_912_REAL_SOURCE_GP_TRAIN_AND_HELDOUT.csv research/R204/R204_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R204): full exact kernel selection and heldout latent prediction source records'
            git push origin HEAD:main
          fi
