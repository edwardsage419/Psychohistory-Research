name: R171 Real Original Austronesian Tree 103 Tests SHA256 Pinned and Source Archive
on:
  push:
    paths:
      - 'research/R171/r171_real_phylogeny_exact.py'
      - 'research/R171/test_r171_real_phylogeny_exact.py'
      - '.github/workflows/r171-real-phlorest-103-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-parsers-and-two-complete-real-distance-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source and unit tests are original precomputed Git blob identities
        run: |
          cd research/R171
          test "$(git hash-object r171_real_phylogeny_exact.py)" = "7cfdc995786820fb8c65586d4919ff60f485536d"
          test "$(git hash-object test_r171_real_phylogeny_exact.py)" = "5c7c5ca1a1c29a41f4b092d6b0cf6dec3858cd03"
          echo '04c204fb99e3ecd6a2a920fb1938a760c53c199111255bcfc44c3746f30a0183  r171_real_phylogeny_exact.py' | sha256sum -c -
          echo '4b6b36c5bb561a6be198399e93f735d0380ff411e61366a8095525595445eadb  test_r171_real_phylogeny_exact.py' | sha256sum -c -
      - name: Download original licensed CLDF files pinned to Phlorest commit and verify SHA1 blobs
        run: |
          cd research/R171
          python r171_real_phylogeny_exact.py --fetch-sources
      - name: Independently parse original tree twice and calculate every exact tip distance twice
        run: |
          cd research/R171
          python r171_real_phylogeny_exact.py > R171_EXACT_RESULTS.json
          python - <<'PY'
          import json,hashlib,csv
          from pathlib import Path
          d=json.loads(Path('R171_EXACT_RESULTS.json').read_text())
          assert d['source_GitHub_commit']=='a2e535f07c05d214fe7d36fe03747f4cfd5f9ca5'
          assert d['tree_summary']['independent_parsers_exact_same_full_tree']
          assert d['complete_pairwise_distances']['independent_all_pairs_ancestry_and_graph_walk_equal']
          n=d['tree_summary']['leaf_count']
          assert n>350
          assert d['complete_pairwise_distances']['number_of_unordered_pairs']==n*(n-1)//2
          assert d['metadata_audit']['CLDF_branch_length_unit']=='millennia'
          assert d['metadata_audit']['CLDF_rooted_field']==''
          assert d['metadata_audit']['rooted_NEXUS_marker']=='[&R]'
          assert not d['original_Bayesian_posterior_inference_reproduced']
          assert not d['original_population_migration_hypotheses_tested']
          assert d['new_external_historical_predictions']==0
          for name,meta in d['source_identities'].items():
              raw=(Path('source')/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==meta['sha256']
          matrix=Path('R171_ALL_PAIR_PATRISTIC_DISTANCES.csv').read_bytes()
          assert hashlib.sha256(matrix).hexdigest()==d['complete_pairwise_distances']['original_full_matrix_csv_sha256']
          with Path('R171_ALL_PAIR_PATRISTIC_DISTANCES.csv').open() as f:
              count=sum(1 for _ in csv.DictReader(f))
          assert count==n*(n-1)//2
          print('REAL_PHYLOGENY_TIPS',n)
          print('REAL_PHYLOGENY_JOIN',json.dumps(d['crosswalk'],ensure_ascii=False))
          print('REAL_PHYLOGENY_STRUCTURE',json.dumps(d['tree_summary'],ensure_ascii=False))
          print('REAL_PHYLOGENY_MATRIX',json.dumps(d['complete_pairwise_distances'],ensure_ascii=False))
          print('REAL_PHYLOGENY_SELECTED_PAIRS',json.dumps(d['preregistered_original_language_tip_pairs'],ensure_ascii=False))
          PY
          echo '65c18ba18eb50d4a977fbfdd02b29ba6b81e72f0b4578374f3cbb61899052f11  R171_EXACT_RESULTS.json' | sha256sum -c -
          echo '66ab2bb5645fcf86dfc91287c0886d2987470e2d65e457ce570106c02edf21ee  R171_ALL_PAIR_PATRISTIC_DISTANCES.csv' | sha256sum -c -
      - name: Run 103 distinct tests against actual original 2009 Phlorest source files
        run: |
          cd research/R171
          python -m unittest -v test_r171_real_phylogeny_exact.py
      - name: Pack original four source bytes and all source tests distances JSON as deterministic ZIP
        run: |
          cd research/R171
          python - <<'PY'
          import zipfile
          files=['r171_real_phylogeny_exact.py','test_r171_real_phylogeny_exact.py',
                 'R171_EXACT_RESULTS.json','R171_ALL_PAIR_PATRISTIC_DISTANCES.csv']
          files+=['source/'+n for n in ['summary.trees','languages.csv','trees.csv','Generic-metadata.json']]
          with zipfile.ZipFile('R171_Real_Austronesian_Full_Tree_103_Tests.zip','w') as z:
              for name in files:
                  info=zipfile.ZipInfo(name,date_time=(2026,10,21,0,0,0))
                  info.compress_type=zipfile.ZIP_LZMA
                  info.external_attr=0o644<<16
                  z.writestr(info,open(name,'rb').read())
          PY
          echo 'f96399cd16915d7a6e90cefcb995692bd0c91beaa6b7cfb7b0250db0cd8a4765  R171_Real_Austronesian_Full_Tree_103_Tests.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: R171-original-real-language-tree-${{ matrix.python-version }}
          path: research/R171/R171_Real_Austronesian_Full_Tree_103_Tests.zip
          retention-days: 90

  verify-and-publish-full-original-historical-source:
    needs: two-parsers-and-two-complete-real-distance-routes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-fetch exact primary-derived source and check every Git blob
        run: |
          cd research/R171
          echo '04c204fb99e3ecd6a2a920fb1938a760c53c199111255bcfc44c3746f30a0183  r171_real_phylogeny_exact.py' | sha256sum -c -
          echo '4b6b36c5bb561a6be198399e93f735d0380ff411e61366a8095525595445eadb  test_r171_real_phylogeny_exact.py' | sha256sum -c -
          python r171_real_phylogeny_exact.py --fetch-sources
          python r171_real_phylogeny_exact.py > R171_EXACT_RESULTS.json
          echo '65c18ba18eb50d4a977fbfdd02b29ba6b81e72f0b4578374f3cbb61899052f11  R171_EXACT_RESULTS.json' | sha256sum -c -
          echo '66ab2bb5645fcf86dfc91287c0886d2987470e2d65e457ce570106c02edf21ee  R171_ALL_PAIR_PATRISTIC_DISTANCES.csv' | sha256sum -c -
          python -m unittest -q test_r171_real_phylogeny_exact.py
          python - <<'PY'
          import zipfile
          files=['r171_real_phylogeny_exact.py','test_r171_real_phylogeny_exact.py',
                 'R171_EXACT_RESULTS.json','R171_ALL_PAIR_PATRISTIC_DISTANCES.csv']
          files+=['source/'+n for n in ['summary.trees','languages.csv','trees.csv','Generic-metadata.json']]
          with zipfile.ZipFile('R171_Real_Austronesian_Full_Tree_103_Tests.zip','w') as z:
              for name in files:
                  item=zipfile.ZipInfo(name,date_time=(2026,10,21,0,0,0))
                  item.compress_type=zipfile.ZIP_LZMA
                  item.external_attr=0o644<<16
                  z.writestr(item,open(name,'rb').read())
          PY
          echo 'f96399cd16915d7a6e90cefcb995692bd0c91beaa6b7cfb7b0250db0cd8a4765  R171_Real_Austronesian_Full_Tree_103_Tests.zip' | sha256sum -c -
      - name: Publish original CC-BY-4 real source bytes and full pairwise matrix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R171/source/summary.trees research/R171/source/languages.csv research/R171/source/trees.csv research/R171/source/Generic-metadata.json research/R171/R171_EXACT_RESULTS.json research/R171/R171_ALL_PAIR_PATRISTIC_DISTANCES.csv research/R171/R171_Real_Austronesian_Full_Tree_103_Tests.zip
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R171): exact 400-language historical source, 79800 distances, independent parser/test archive'
            git push origin HEAD:main
          fi
