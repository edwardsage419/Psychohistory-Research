name: R244 Exact Markov Processes and Latent Rate Mixture Non-Markov Test
on:
  push:
    paths:
      - 'research/R244/r244_exact_markov_hidden_mixture.py'
      - '.github/workflows/r244-exact-markov.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-markov-path-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate independent full finite Markov path laws, hidden mixtures and CK
        run: python research/R244/r244_exact_markov_hidden_mixture.py --test
  full-original-markov-archive:
    needs: dual-python-markov-path-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 1152 seven-bit source paths and independently audit Markov violations
        run: |
          python research/R244/r244_exact_markov_hidden_mixture.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R244')
          rows=list(csv.DictReader((d/'R244_ALL_1152_ORIGINAL_BINARY_MARKOV_SOURCE_PATHS.csv').open()))
          j=json.loads((d/'R244_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R244_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==1152 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-004'
          by={r['world']:r for r in j['world_results']}
          for w,r in by.items():
              rr=[x for x in rows if x['world']==w]
              assert len(rr)==128
              assert len({tuple(x[k] for k in ('oracle_source_U','oracle_original_R11',
                       'oracle_original_R12','oracle_original_R21','oracle_original_R22',
                       'oracle_original_R31','oracle_original_R32')) for x in rr})==128
              assert all(F(x['original_source_probability'])==F(1,128) for x in rr)
              assert sum((F(x['original_source_probability']) for x in rr),F(0))==1
              assert r['independent_transition_product_full_path_parity']
              assert sum((F(x) for x in r['complete_observed_four_time_state_joint'].values()),F(0))==1
              assert len(r['observed_probability_state1_by_step'])==4
          b=by['PERSISTENT_3OF4']
          assert b['complete_observed_four_time_state_joint']==by['STATIC_HIDDEN_SENSOR_ALIAS']['complete_observed_four_time_state_joint']
          assert b['complete_observed_four_time_state_joint']==by['COMPLEMENT_HIDDEN_COORDINATE_ALIAS']['complete_observed_four_time_state_joint']
          assert by['STATIC_HIDDEN_SENSOR_ALIAS']['oracle_real_hidden_h4_by_source']==['0']*128
          for w in ('IID_FAIR','PERSISTENT_3OF4','ANTIPERSISTENT_1OF4','ABSORB_ONE',
                    'TIME_ALTERNATING_RATE','STATIC_HIDDEN_SENSOR_ALIAS',
                    'COMPLEMENT_HIDDEN_COORDINATE_ALIAS'):
              assert by[w]['observed_time3_conditional_markov_defect']=='0'
          mixture=by['LATENT_RATE_MIXTURE']
          assert mixture['observed_time3_conditional_markov_defect']=='1/5'
          assert mixture['observed_p_Y3zero_given_Y2zero_Y1zero']=='7/10'
          assert mixture['observed_p_Y3zero_given_Y2zero_Y1one']=='3/10'
          assert mixture['observed_p_Y3zero_given_Y2zero']=='1/2'
          fixed=by['FIXED_SWITCH_POLICY']
          assert fixed['observed_time3_conditional_markov_defect']=='1/2'
          assert fixed['observed_p_Y3zero_given_Y2zero_Y1zero']=='1'
          assert fixed['observed_p_Y3zero_given_Y2zero_Y1one']=='0'
          assert by['TIME_ALTERNATING_RATE']['observed_time3_conditional_markov_defect']=='0'
          for fn,key in [('R244_ALL_1152_ORIGINAL_BINARY_MARKOV_SOURCE_PATHS.csv','source_sha256'),
                         ('R244_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/fn).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R244_ALL_1152_MARKOV_SOURCE_PATHS_AND_HIDDEN_MIXTURE_CONDITIONAL_INDEPENDENCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R244-Nine-Binary-Markov-Full-Seven-Bit-Source-Worlds
          path: |
            research/R244/R244_ALL_1152_ORIGINAL_BINARY_MARKOV_SOURCE_PATHS.csv
            research/R244/R244_EXACT_RESULTS.json
            research/R244/R244_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive 1152 exact Markov original paths
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R244/R244_ALL_1152_ORIGINAL_BINARY_MARKOV_SOURCE_PATHS.csv research/R244/R244_EXACT_RESULTS.json research/R244/R244_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R244): all 1152 seven-bit Markov original source paths'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
