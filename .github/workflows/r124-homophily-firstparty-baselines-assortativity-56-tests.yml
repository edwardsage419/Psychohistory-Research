name: R124 McPherson Newman primary homophily baseline and three observational histories

on:
  push:
    paths:
      - '.github/workflows/r124-homophily-firstparty-baselines-assortativity-56-tests.yml'
      - 'research/R124/r124_homophily_baseline_assortativity_causal_ambiguity.py'
      - 'research/R124/test_r124_homophily_baseline_assortativity_causal_ambiguity.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-source-categorical-assortativity-math:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actually run 56 source grounded categorical mixing and identification tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R124 python -m unittest -v \
            research/R124/test_r124_homophily_baseline_assortativity_causal_ambiguity.py \
            2>&1 | tee /tmp/r124_actual_tests.log
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r124_actual_tests.log').read_text()
          assert re.findall(r'Ran (\d+) tests? in',log)==['56'],('R124_ACTUAL_COUNT_NOT_56',log[-1700:])
          assert re.search(r'\nOK\s*$',log),'R124_ACTUAL_TEST_FAILURE'
          print('R124_ALL_56_TESTS_ACTUALLY_PASSED')
          PY
      - name: Independently rerun original Newman formula and 948 small graphs plus 20 exact permutations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R124 python - <<'PY'
          import hashlib,json,pathlib
          from fractions import Fraction as F
          import r124_homophily_baseline_assortativity_causal_ambiguity as m

          original=m.original_project_frozen_graph_examples()
          assert original['triangles_perfect_r']=='1'
          assert original['triangles_same_fraction']=='1'
          assert original['cycle_r']=='1/3'
          assert original['cycle_same_fraction']=='2/3'
          assert original['K3_3_cross_only_r']=='-1'
          assert original['complete_graph_5A_1B_raw_same']=='2/3'
          assert original['complete_graph_5A_1B_population_baseline']=='2/3'
          assert original['complete_graph_5A_1B_Newman_r']=='-1/5'
          assert original['focal_opportunity_same_fraction']=='1'
          assert original['focal_opportunity_excess']=='0'
          assert original['global_opportunity_excess']=='3/5'

          null=original['two_triangles_exact_permutation_null']
          assert null['permutations']==20
          assert null['same_edge_count_frequencies']=={'2':18,'6':2}
          assert null['expected_same_edges']=='12/5'
          assert null['right_tail_probability_under_exchangeable_label_null']=='1/10'
          assert null['this_is_NOT_an_empirical_p_value']

          history=m.identical_snapshot_three_generating_histories()
          assert history['all_final_snapshots_identical']
          assert history['selection_story_eligible_pairs']==15
          assert history['opportunity_story_eligible_pairs']==6
          assert history['opportunity_story_formed_ties']==6
          assert history['influence_story_edge_changes']==0
          assert history['influence_story_initial_attributes']==['A','A','B','B','B','A']
          assert history['final_attributes']==['A','A','A','B','B','B']

          exhaustive=m.exhaustive_small_binary_network_audit()
          assert exhaustive['total_cases_by_n']=={'2':4,'3':48,'4':896}
          assert exhaustive['empty_no_metric_by_n']=={'2':2,'3':6,'4':14}
          assert exhaustive['all_graph_label_cases']==948
          assert sum(exhaustive['nonempty_networks_by_n'].values())==926

          root=pathlib.Path('research/R124')
          tracked=[
            'r124_homophily_baseline_assortativity_causal_ambiguity.py',
            'test_r124_homophily_baseline_assortativity_causal_ambiguity.py',
            'R124_FIRSTPARTY_HOMOPHILY_NEWMan_2003_BASELINE_OPPORTUNITY_SYNTHETIC_IDENTIFICATION_REPORT_2026-10-19.md',
          ]
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked}
          receipt={
            'research_id':'R124','phase':'A',
            'status':'R124_MCPhERSON_NEWMAN_PRIMARY_HOMOPHILY_56_TEST_948_SYNTHETIC_PASS',
            'original_catalogue_P0_item':'04-015',
            '2001_review_original_DOI':'10.1146/annurev.soc.27.1.415',
            '2003_Newman_original_assortativity_DOI':'10.1103/PhysRevE.67.026126',
            '2009_longitudinal_real_study_original_abstract_DOI':'10.1086/599247',
            'primary_2001_original_print_pages_read':[415,416,417,418,419],
            'primary_2003_original_page_read':'026126-2 Eq.(1)-(3)',
            '2009_first_hand_access':'publisher and author-affiliated abstracts only, no full paper estimation tables and no raw longitudinal data',
            'independent_mixing_mechanism_checks':['Newman 2003 ordered half edge e-matrix with stub baseline','direct same-edge and group degree-stub arithmetic'],
            'published_mathematical_definition_synthetic_exact_fixtures':original,
            'selection_focal_opportunity_and_influence_observationally_equivalent_toy':history,
            'exact_small_n_graph_label_enumeration':exhaustive,
            'full_small_graph_label_configurations':948,
            'nonempty_small_graph_label_configurations':926,
            'real_independent_unittests_executed':56,
            'real_unit_failures':0,
            'source_test_report_SHA256':hashes,
            'human_2009_longitudinal_behavior_microdata_reanalyzed':False,
            '2009_original_statistical_estimates_reproduced':False,
            'real_human_E2_prediction_score_records':0,
            'causal_selection_influence_or_opportunity_effect_identified':False,
            'R073':'FROZEN','PESEN_v0_1':'FROZEN',
          }
          dest=root/'R124_PHASE_A_HOMOPHILY_56_TEST_948_GRAPH_20_PERMUTATION_CI_ACCEPTANCE.json'
          dest.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('R124_TRUE_MACHINE_SHA256',hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Commit only actual original-source mathematical audit machine receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R124/R124_PHASE_A_HOMOPHILY_56_TEST_948_GRAPH_20_PERMUTATION_CI_ACCEPTANCE.json
          git commit -m "results(R124): 56 primary homophily checks and 948 synthetic graph cases succeed"
          git pull --rebase origin main
          git push origin HEAD:main
