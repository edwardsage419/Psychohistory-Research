name: R100 B1e bounded original AB key identifiability source audit
on:
  push:
    paths:
      - '.github/workflows/r100-2025-Zenodo-B1e-AB-identity-cardinality.yml'
      - 'research/R100/r100_phase_b1e_original_AB_identity_code_cardinality_only.py'
      - 'research/R100/test_r100_phase_b1e_original_AB_identity_code_cardinality_only.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-privacy-first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Source-only 8 new and 16 reciprocal synthetics
        run: |
          PYTHONPATH=research/R100 python -m unittest -v \
            research/R100/test_r100_phase_b1e_original_AB_identity_code_cardinality_only.py \
            research/R100/test_r100_phase_b1b_original_AB_role_partner_reciprocal_graph.py
  original-first-party-B-cardinality:
    needs: synthetic-privacy-first
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Evaluate only original A B role/source strings under MD5 SHA pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r100_B1e_source
          PYTHONPATH=research/R100 python research/R100/r100_phase_b1e_original_AB_identity_code_cardinality_only.py --output /tmp/r100_B1e_source/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r100_B1e_source/receipt.json').read_text())
          assert x["status"]=="B1E_REAL_AB_IDENTIFIABILITY_CARDINALITY_AUDITED_ONLY"
          assert x["official_original_SHA256"]=="825b1cd3226aeca7a19d76d9594f655114b12059648f9ca03b3291c3cf9ab200"
          assert x["candidate_focus_record_total"]==554
          assert len(x["anonymous_treatment_summaries"])==5
          assert x["C_to_Z_cell_values_dereferenced"]==0 and x["original_human_model_scores"]==0
          print("R100_B1e_ANONYMOUS_SOURCE_KEY_CARDINALITY_VERIFIED")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r100-B1e-source-AB-uniqueness-anonymous-or-failure
          path: /tmp/r100_B1e_source/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Permanently archive allowlisted anonymous B1e source receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r100_B1e_source/receipt.json
          dst=research/R100/R100_PHASE_B1E_LIVE_CI_AB_KEY_CARDINALITY_RECEIPT.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r100_B1e_source/receipt.json').read_text())
          assert x["research_id"]=="R100" and x["phase"]=="B1e"
          assert x["PESEN_v0_1"]=="FROZEN" and x["original_human_model_scores"]==0
          assert x["status"] in ("B1E_SOURCE_FAIL_CLOSED","B1E_REAL_AB_IDENTIFIABILITY_CARDINALITY_AUDITED_ONLY")
          allowed={"research_id","phase","status","safe_failure","source_pair_identity_uniquely_verified","anonymous_treatment_summaries","candidate_focus_record_total","original_A_B_literal_values_or_pairs_exported","C_to_Z_cell_values_dereferenced","original_human_model_scores","PESEN_v0_1","official_original_MD5","official_original_SHA256","official_original_bytes"}
          assert set(x).issubset(allowed)
          if "anonymous_treatment_summaries" in x:
              assert len(x["anonymous_treatment_summaries"])==5
              for tr in x["anonymous_treatment_summaries"]:
                  assert set(tr)=={"anonymous_treatment_slot","role_sheets","A_number_strings_shared_across_both_role_sheets","distinct_B_strings_shared_across_role_sheets","distinct_B_strings_entire_treatment","B_unique_person_code_sufficient_from_repeated_focal_position"}
                  assert len(tr["role_sheets"])==2
                  for row in tr["role_sheets"]:
                      assert set(row)=={"anonymous_role_slot","four_row_focal_blocks","distinct_A_source_number_strings","distinct_all_B_strings_in_sheet","distinct_B_by_four_positions","B_three_distinct_in_block_count","B_two_distinct_in_block_count","author_role_expected_repeated_B_positions_count"}
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R100 B1e): last bounded original AB key cardinality, no real behavior read"
          git pull --rebase origin main
          git push origin HEAD:main
