name: Original239 P2 R338 Relative Deprivation Crosswalk v5.6
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p2_r338_crosswalk_v5_6.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v5.6_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_6_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - '.github/workflows/original-239-p2-r338-crosswalk-v56.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
