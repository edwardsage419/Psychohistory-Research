  index312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/verify_p2_r338_crosswalk_v5_6.py
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/catalogue_audit/independent_r338_relative_deprivation_audit.py
      - run: python research/catalogue_audit/verify_p2_r338_crosswalk_v5_6.py
