name: Original239 existing R118 Crosswalk v6.8
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v6.8_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_165_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - 'docs/ORIGINAL239_03-019_R118_E1_REATTRIBUTION_ACCEPTANCE.json'
      - 'research/catalogue_audit/verify_original239_v6_8_existing_r118.py'
      - '.github/workflows/original239_r118_crosswalk_v6_8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify 239 identities, R118 E1 and 165 pending items
        run: python research/catalogue_audit/verify_original239_v6_8_existing_r118.py
