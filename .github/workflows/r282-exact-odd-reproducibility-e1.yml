name: R282 ODD2020 Seven Section ABM Complete Replay Audit
on:
  push:
    paths:
      - 'research/R282/r282_exact_odd_replay.py'
      - 'research/R282/R282_ODD2020_SEVEN_ELEMENT_MODEL_DESCRIPTION.md'
      - '.github/workflows/r282-exact-odd-reproducibility-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 114 frozen ODD and 192 source-replay assertions
        run: python research/R282/r282_exact_odd_replay.py --test
  independent-odd-schedule-source-audit-and-archive:
    needs: dual-python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce full ABM source trace independently and verify mandatory ODD fields
        run: |
          python research/R282/r282_exact_odd_replay.py --emit
          python - <<'PY'
          import csv,json,hashlib,re
          from collections import Counter,defaultdict
          from pathlib import Path
          from fractions import Fraction as F
          root=Path('research/R282')
          csvpath=root/'R282_ALL_192_ORIGINAL_ODD_SCHEDULE_SOURCES.csv'
          jsonpath=root/'R282_EXACT_ODD_REPLAY_RESULTS.json'
          oddpath=root/'R282_ODD2020_SEVEN_ELEMENT_MODEL_DESCRIPTION.md'
          receipt=json.loads((root/'R282_MACHINE_RECEIPT.json').read_text())
          result=json.loads(jsonpath.read_text())
          rows=list(csv.DictReader(csvpath.open()))
          assert len(rows)==192
          assert receipt['prescore_freeze_commit']==result['prescore_freeze_commit']=='5447354be84992df49810b59cd258405851d2eb9'
          for file,key in ((csvpath,'original_source_sha256'),(jsonpath,'results_sha256'),(oddpath,'odd_seven_sections_sha256')):
              assert receipt[key]==hashlib.sha256(file.read_bytes()).hexdigest()
          odd=oddpath.read_text()
          headings=re.findall(r'^## ([1-7])\. (.+)$',odd,re.MULTILINE)
          assert headings==list(zip('1234567',[
            'Purpose and patterns',
            'Entities, state variables, and scales',
            'Process overview and scheduling',
            'Design concepts',
            'Initialization',
            'Input data',
            'Submodels']))
          names=['SYNC','A_THEN_B','B_THEN_A']
          by=defaultdict(dict)
          for row in rows:
              s=row['schedule'];idx=int(row['primitive_source_index'])
              assert s in names and idx not in by[s]
              six=format(idx,'06b')
              assert row['original_sixbit_source']==six
              a,b,ea0,eb0,ea1,eb1=map(int,six)
              assert row['t0_state']==six[:2]
              for label,bit in [('original_initial_A',a),('original_initial_B',b),
                  ('original_eA_t0',ea0),('original_eB_t0',eb0),
                  ('original_eA_t1',ea1),('original_eB_t1',eb1)]:
                  assert int(row[label])==bit
              def independent_step(a,b,ea,eb,sch):
                  if sch=='SYNC':return (b^ea,a^eb)
                  if sch=='A_THEN_B':return (b^ea,b^ea^eb)
                  return (a^eb^ea,a^eb)
              c,d=independent_step(a,b,ea0,eb0,s)
              e,f=independent_step(c,d,ea1,eb1,s)
              assert row['t1_state']==str(c)+str(d)
              assert row['t2_state']==str(e)+str(f)
              # Separate closed-form final-state check, not imported from model code.
              if s=='SYNC':target=(a^eb0^ea1,b^ea0^eb1)
              elif s=='A_THEN_B':
                  x=b^ea0^eb0^ea1;target=(x,x^eb1)
              else:
                  x=a^eb0^ea0^eb1;target=(x^ea1,x)
              assert (e,f)==target
              assert F(row['exact_original_source_mass'])==F(1,64)
              by[s][idx]=row
          assert all(set(by[s])==set(range(64)) for s in names)
          for s in names:
              counts=Counter(by[s][i]['t2_state'] for i in range(64))
              assert counts=={'00':16,'01':16,'10':16,'11':16}
              w=next(v for v in result['schedule_results'] if v['schedule']==s)
              assert w['terminal_joint_state_counts']==dict(counts)
              assert w['terminal_joint_state_probabilities']=={k:'1/4' for k in counts}
          assert [by[s][1]['t2_state'] for s in names]==['01','01','11']
          for s in names[1:]:
              at1=sum(by[s][i]['t1_state']!=by['SYNC'][i]['t1_state'] for i in range(64))
              at2=sum(by[s][i]['t2_state']!=by['SYNC'][i]['t2_state'] for i in range(64))
              assert (at1,at2)==(32,48)
              assert result['synchronous_vs_asynchronous_paired_source_disagreements'][s]=={
                't1_disagreement_source_count':32,'t2_disagreement_source_count':48}
          ab=sum(by['A_THEN_B'][i]['t2_state']!=by['B_THEN_A'][i]['t2_state'] for i in range(64))
          assert ab==48==result['two_asynchronous_schedules_t2_disagreement_count']
          assert result['no_real_human_E2']==result['no_real_historical_E3']==0
          print('R282_COMPLETE_ODD2020_7_SECTIONS_192_PRIMITIVE_STATES_3_SCHEDULE_48_OF_64_DIFFERENCES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R282-ODD-Seven-Sections-192-Original-Primitive-Sources
          path: |
            research/R282/R282_ODD2020_SEVEN_ELEMENT_MODEL_DESCRIPTION.md
            research/R282/R282_ALL_192_ORIGINAL_ODD_SCHEDULE_SOURCES.csv
            research/R282/R282_EXACT_ODD_REPLAY_RESULTS.json
            research/R282/R282_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive 192 primitive ABM sources and full audit receipt
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R282/R282_ALL_192_ORIGINAL_ODD_SCHEDULE_SOURCES.csv research/R282/R282_EXACT_ODD_REPLAY_RESULTS.json research/R282/R282_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R282): full ODD2020 schedule audit and 192 primitive ABM sources'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R282_ALL_192_ODD_COMPLETE_SOURCE_TYPES_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
