name: Original 239 P1 R290 Model Evidence Crosswalk v0.4
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p1_r290_crosswalk_v0_4.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v0.4_2026-10-23.json'
      - 'docs/ORIGINAL_239_PENDING_58_P1_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-23.csv'
      - '.github/workflows/original-239-p1-r290-crosswalk-v04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-python-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify every original 239 catalogue row and source hash
        run: python research/catalogue_audit/verify_p1_r290_crosswalk_v0_4.py --test
  independent-metadata-and-scientific-boundary:
    needs: dual-python-crosswalk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone crosswalk audit + independent R290 source audit
        run: |
          python research/catalogue_audit/verify_p1_r290_crosswalk_v0_4.py --audit
          python research/catalogue_audit/independent_r290_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: Original239-R290-P1-v04-239Rows-58Pending-MetadataOnly
          path: |
            docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v0.4_2026-10-23.json
            docs/ORIGINAL_239_PENDING_58_P1_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-23.csv
            research/R290/R290_FINAL_ACCEPTANCE_STATUS.json
          retention-days: 90
