name: R100 B1a original Zenodo only AB literal code diagnostic before score
on:
  push:
    paths:
      - '.github/workflows/r100-2025-Zenodo-B1a-only-AB-source-code-privacy.yml'
      - 'research/R100/r100_phase_b1a_only_AB_literal_source_code_diagnostic.py'
      - 'research/R100/test_r100_phase_b1a_only_AB_literal_source_code_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-first-no-genuine-original-values:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Gate 20 A2 plus 15 B0 plus 18 B1a synthetic cases
        run: |
          PYTHONPATH=research/R100 python -m unittest -v \
            research/R100/test_r100_2025_original_threshold_pgg_zenodo_xlsx_source_directory_only.py \
            research/R100/test_r100_phase_b0_zenodo_xlsx_ab_tag_structure_only.py \
            research/R100/test_r100_phase_b1a_only_AB_literal_source_code_diagnostic.py
  official-real-source-AB-format-only:
    needs: synthetic-first-no-genuine-original-values
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect only genuine SHA pinned A and B literal identity metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r100_b1a_private
          PYTHONPATH=research/R100 python research/R100/r100_phase_b1a_only_AB_literal_source_code_diagnostic.py --output /tmp/r100_b1a_private/receipt.json
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("/tmp/r100_b1a_private/receipt.json").read_text())
          assert x["status"]=="B1A_ORIGINAL_AB_CODE_FORMAT_DIAGNOSTIC_ONLY"
          assert x["original_full_SHA256"]=="825b1cd3226aeca7a19d76d9594f655114b12059648f9ca03b3291c3cf9ab200"
          assert x["actual_source_sheet_count"]==10
          assert x["C_to_Z_cell_values_dereferenced"]==0
          assert x["actual_human_model_scores"]==0
          print("R100_B1a_REAL_AB_CODE_FORMAT_SOURCE_ONLY",x["actual_source_sheet_count"])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r100-b1a-source-only-ab-safe-diagnostic
          path: /tmp/r100_b1a_private/receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive only allowlisted sanitized real source diagnostic or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r100_b1a_private/receipt.json
          dst=research/R100/R100_PHASE_B1A_LIVE_CI_AB_SOURCE_FORMAT_RECEIPT.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/r100_b1a_private/receipt.json').read_text())
          assert x["research_id"]=="R100" and x["phase"]=="B1a"
          assert x["actual_human_model_scores"]==0 and x["PESEN_v0_1"]=="FROZEN"
          allowed={"research_id","phase","status","safe_failure","original_publisher_MD5","original_full_SHA256","original_source_bytes","actual_source_sheet_count","anonymous_sheet_summaries","original_AB_literals_exported","original_worksheet_names_exported","C_to_Z_cell_values_dereferenced","source_pair_reciprocity_verified","actual_independent_people_count_verified","actual_human_model_scores","PESEN_v0_1"}
          assert set(x).issubset(allowed)
          assert x["status"] in ("B1A_BLOCKED_FAIL_CLOSED","B1A_ORIGINAL_AB_CODE_FORMAT_DIAGNOSTIC_ONLY")
          if "anonymous_sheet_summaries" in x:
              assert len(x["anonymous_sheet_summaries"])==10
              fields={"anonymous_sheet_slot","source_xml_row_tags","candidate_four_row_blocks","A_cell_storage_type_counts","B_cell_storage_type_counts","A_four_row_pattern_counts","B_four_row_pattern_counts"}
              names={"n","s","str","inlineStr"}
              import re
              for row in x["anonymous_sheet_summaries"]:
                  assert set(row)==fields
                  assert set(row["A_cell_storage_type_counts"]).issubset(names)
                  assert set(row["B_cell_storage_type_counts"]).issubset(names)
                  for prefix in ("A","B"):
                      for key,val in row[prefix+"_four_row_pattern_counts"].items():
                          assert re.fullmatch(r"(nonempty_[0-4]|distinct_[0-4]|four_identical|partially_blank)",key)
                          assert type(val)==int and val>=0
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R100 B1a): first party A B code format privacy diagnostic or fail closed"
          git pull --rebase origin main
          git push origin HEAD:main
