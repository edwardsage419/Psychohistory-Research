name: R132 original replicator Eq2 Eq3 Eq4 and full trajectory numerical artifact audit
# Read-only CI engineering recheck. Historic Phase A acceptance receipts remain immutable.

on:
  push:
    paths:
      - '.github/workflows/r132-replicator-trajectories-source-70-tests.yml'
      - 'research/R132/r132_replicator_1978_exact_invariants_and_trajectories.py'
      - 'research/R132/test_r132_replicator_1978_exact_invariants_and_trajectories.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-1978-Eq2-3-4-and-independent-ODE-solvers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute all 70 actual first-party exact and numerical tests
        shell: bash
        run: |
          set -euo pipefail
          for optimization in 0 1; do
            echo "R132 Phase A 70 native tests, PYTHONOPTIMIZE=$optimization"
            LOG_PATH="$RUNNER_TEMP/r132-phase-a-tests-$optimization.log"
            PYTHONOPTIMIZE="$optimization" PYTHONPATH=research/R132 python -B -m unittest -v \
              research/R132/test_r132_replicator_1978_exact_invariants_and_trajectories.py \
              2>&1 | tee "$LOG_PATH"
            R132_TEST_LOG="$LOG_PATH" PYTHONOPTIMIZE="$optimization" python -B - <<'PY'
          import pathlib,re,os
          def require(ok,label):
              if ok is not True:raise RuntimeError(label)
          log=pathlib.Path(os.environ['R132_TEST_LOG']).read_text()
          require((re.findall(r'Ran (\d+) tests? in',log)==['70']), 'R132_PHASE_A_GATE_01')
          require((bool(re.search(r'\nOK\s*$',log))), 'R132_PHASE_A_GATE_02')
          print('R132_PHASE_A_70_ACTUAL_TESTS_SUCCESS')
          PY
          done
      - name: Independently check original 1978 equations, 84 simplex states, 252 shifts, 252 scalings, and RPS Euler-vs-RK4
        shell: bash
        run: |
          set -euo pipefail
          for optimization in 0 1; do
            echo "R132 Phase A independent math, PYTHONOPTIMIZE=$optimization"
            PYTHONOPTIMIZE="$optimization" python -B - <<'PY'
          import hashlib,json,pathlib,os,sys,types
          from fractions import Fraction as F
          def require(ok,label):
              if ok is not True:raise RuntimeError(label)
          try:
              require(False,'R132_OPTIMIZATION_NEGATIVE_CONTROL')
          except RuntimeError:
              pass
          else:
              raise RuntimeError('R132_GUARD_DID_NOT_REJECT')
          root=pathlib.Path('research/R132')
          core=root/'r132_replicator_1978_exact_invariants_and_trajectories.py'
          core_bytes=core.read_bytes()
          m=types.ModuleType('_r132_phase_a_verified_math')
          m.__file__=str(core)
          exec(compile(core_bytes,str(core),'exec'),m.__dict__)

          invariant=m.exact_replicator_invariant_grid()
          require((invariant['exact_field_vs_independent_pairwise_comparisons']==84), 'R132_PHASE_A_GATE_03')
          require((invariant['source_1978_original_eq3_vs_eq4_increment_checks']==84), 'R132_PHASE_A_GATE_04')
          require((invariant['constant_payoff_shift_invariance_checks']==252), 'R132_PHASE_A_GATE_05')
          require((invariant['positive_payoff_time_scale_checks']==252), 'R132_PHASE_A_GATE_06')
          require((invariant['absence_boundary_preservation_checks']==84), 'R132_PHASE_A_GATE_07')
          rps=m.zero_sum_rps_exact_log_product_invariant_grid()
          require((rps['interior_exact_simplex_state_checks']==10), 'R132_PHASE_A_GATE_08')
          require(('d(log(x0*x1*x2))/dt' in rps['identity']), 'R132_PHASE_A_GATE_09')

          twotypes=m.exact_two_type_source_based_sign_audit()
          require((twotypes['two_type_13_grid_cross_checks']==39), 'R132_PHASE_A_GATE_10')
          models=twotypes['two_type_models']
          require((models['stag_hare']['exact_interior_fixed_point']=='3/4'), 'R132_PHASE_A_GATE_11')
          require((models['chicken']['exact_interior_fixed_point']=='1/3'), 'R132_PHASE_A_GATE_12')
          require((models['constant_advantage']['exact_interior_fixed_point'] is None), 'R132_PHASE_A_GATE_13')
          require((models['stag_hare']['half_derivative']=='-1/4'), 'R132_PHASE_A_GATE_14')
          require((models['chicken']['quarter_derivative']=='3/64'), 'R132_PHASE_A_GATE_15')

          result=m.numerical_replicator_audit()
          require((result['logistic_RK4_absolute_errors'][-1]<1e-11), 'R132_PHASE_A_GATE_16')
          require((result['logistic_euler_absolute_errors'][-1]>result['logistic_RK4_absolute_errors'][-1]*100), 'R132_PHASE_A_GATE_17')
          require((result['stag_hare_t8_initial_half_final']<0.5), 'R132_PHASE_A_GATE_18')
          require((result['stag_hare_t8_initial_four_fifths_final']>0.8), 'R132_PHASE_A_GATE_19')
          require((0.1<result['chicken_t8_initial_one_tenth_final']<1/3), 'R132_PHASE_A_GATE_20')
          require((1/3<result['chicken_t8_initial_four_fifths_final']<0.8), 'R132_PHASE_A_GATE_21')
          require((result['project_RPS_exact_continuous_product_invariant']=='3/100'), 'R132_PHASE_A_GATE_22')
          require((result['this_numerical_drift_is_not_original_Taylor_Jonker_discrete_Eq3']), 'R132_PHASE_A_GATE_23')
          rps_error=result['numeric_T12_RPS_comparison']
          require((set(rps_error)=={'40','80','160','320'}), 'R132_PHASE_A_GATE_24')
          require((rps_error['40']['euler_product_error']<-.01), 'R132_PHASE_A_GATE_25')
          require((abs(rps_error['40']['rk4_product_error'])<2e-7), 'R132_PHASE_A_GATE_26')
          require((abs(rps_error['320']['euler_product_error'])>1e-4), 'R132_PHASE_A_GATE_27')
          require((abs(rps_error['320']['rk4_product_error'])<1e-9), 'R132_PHASE_A_GATE_28')

          files=[
            'r132_replicator_1978_exact_invariants_and_trajectories.py',
            'test_r132_replicator_1978_exact_invariants_and_trajectories.py',
            'R132_TAYLOR_JONKER_1978_REPLICATOR_TRAJECTORIES_AND_NUMERICAL_ARTIFACTS_SCIENTIFIC_REPORT_2026-10-20.md',
          ]
          checksums={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files}
          historical_path=root/'R132_PHASE_A_70_TEST_84_EXACT_STATES_RPS_ARTIFACT_CI_ACCEPTANCE.json'
          historical_raw=historical_path.read_bytes()
          historical=json.loads(historical_raw)
          require((checksums==historical['core_code_test_science_report_SHA256']),
                  'R132_PHASE_A_HISTORICAL_SOURCE_HASH_MISMATCH')
          receipt={
            'research_id':'R132','original_catalogue_id':'05-008','priority':'P1','phase':'A',
            'status':'R132_PHASE_A_V2_ENGINEERING_REVALIDATION_E1_UNCHANGED',
            'receipt_kind':'ENGINEERING_REVALIDATION','optimization_level':sys.flags.optimize,
            'historical_receipt_sha256':hashlib.sha256(historical_raw).hexdigest(),
            'github_run_id_observed_environment':os.environ.get('GITHUB_RUN_ID','LOCAL_NOT_CI'),
            'evidence_grade_unchanged':True,
            'primary_author_research_source':'Taylor and Jonker 1978 Mathematical Biosciences 40:145-156, original Eq2, Eq3 and Eq4 p149',
            'primary_author_DOI':'10.1016/0025-5564(78)90077-9',
            'original_author_hosted_fulltext_pdf':'https://static1.squarespace.com/static/5dc9917c4cdb1467e1e54c4c/t/6526a5647942e33b89ab7af1/1697031525653/1978%2Bevolutionarily%2Bstable%2Bstrategies%2Band%2Bgame%2Bdynamics.pdf',
            'printed_original_pages_visually_read':[149,150,151],
            'source_original_continuous_Eq2':"dx_i/dt=x_i(F_i-Fbar)",
            'source_original_discrete_Eq3':"x_i_next=x_i(1+F_i)/(1+Fbar)",
            'source_original_discrete_Eq4':"x_i_next-x_i=x_i(F_i-Fbar)/(1+Fbar)",
            'source_1978_discrete_generation_not_forward_Euler_or_RK4':True,
            'source_original_1978_full_nonlinear_phase_portraits_not_reproduced':True,
            'source_original_1983_Schuster_Sigmund_full_text_read':False,
            'author_Eq2_via_independent_pairwise_fraction_and_source_Eq3_4_invariants':invariant,
            'source_based_independent_log_product_RPS_mathematical_identity':rps,
            'two_strategy_basin_signs_and_39_exact_math_comparisons':twotypes,
            'actual_finite_non_equilibrium_numerical_trajectories_and_error_comparisons':result,
            'Stag_Hare_source_two_person_payoffs_previous_R128_numerical_trajectory_project_created':True,
            'Chicken_two_person_payoffs_previous_R129_numerical_trajectory_project_created':True,
            'RPS_zero_sum_matrix_and_ODE_integrator_new_project_math_not_original_1978_game':True,
            'num_explicit_numerical_RPS_step_grids':4,
            'numeric_RK4_not_strict_geometrically_conservative_integrator':True,
            'double_precision_numerics_not_confused_with_exact_Fraction_proofs':True,
            'actual_independent_unittests_executed':70,
            'unittest_failures':0,
            'core_code_test_science_report_SHA256':checksums,
            'true_original_real_animal_or_human_trajectory_rows_loaded':0,
            'new_real_human_E2_prediction_scores':0,
            'new_historical_E3_event_probability_scores':0,
            'R073':'FROZEN','PESEN_v0_1':'FROZEN'
          }
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/(
              'r132-phase-a-v2-engineering-opt'+str(sys.flags.optimize)+'.json')
          require((not out.exists()),'R132_PHASE_A_OUTPUT_ALREADY_EXISTS')
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R132_REAL_SOURCE_SHA256_RECEIPT',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          done
