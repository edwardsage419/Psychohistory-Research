name: R184 Poisson 45 Exact Count Worlds
on:
  push:
    paths:
      - 'research/R184/r184_poisson_count_glm_exact.py'
      - '.github/workflows/r184-poisson-count-45.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-python-poisson-dispersion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independently verify count source and Poisson score, dispersion and test errors
        run: |
          cd research/R184
          python r184_poisson_count_glm_exact.py --test
  full-45-world-poisson-scoring-and-archive:
    runs-on: ubuntu-latest
    needs: two-python-poisson-dispersion-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Score exact 45 Poisson source worlds and 4125 training pairs
        run: |
          cd research/R184
          python r184_poisson_count_glm_exact.py --run-and-archive
          python - <<'PY'
          import csv,json,zipfile
          from hashlib import sha256
          from pathlib import Path
          d=json.loads(Path('R184_EXACT_RESULTS.json').read_text())
          a=json.loads(Path('R184_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert d['world_count']==45 and len(d['worlds'])==45
          assert d['complete_original_training_pairs']==4125
          assert len(d['fixed_n8_p0p1_quarter_same_mean_comparison'])==5
          assert all(x['MLE_independent_new_count_expected_Poisson_logloss']=='INF' for x in d['worlds'])
          assert all(x['all_independent_source_variance_and_future_squared_risk_exact'] for x in d['worlds'])
          with Path('R184_ALL_4125_ARTIFICIAL_TRAINING_COUNT_PAIRS.csv').open() as f:
            assert sum(1 for _ in csv.DictReader(f))==4125
          assert a['main_result_sha256']==sha256(Path('R184_EXACT_RESULTS.json').read_bytes()).hexdigest()
          assert a['full_original_CSV_sha256']==sha256(Path('R184_ALL_4125_ARTIFICIAL_TRAINING_COUNT_PAIRS.csv').read_bytes()).hexdigest()
          assert d['new_E2']==d['new_E3']==0
          with zipfile.ZipFile('R184_Exact_Poisson_45_Worlds_Source_Audit.zip') as z:
            assert len(z.namelist())==5 and z.testzip() is None
          print('R184_SOURCE_AUTHENTIC_EXACT_POISSON_45_WORLDS_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R184-exact-poisson-45-worlds
          path: |
            research/R184/R184_EXACT_RESULTS.json
            research/R184/R184_ALL_4125_ARTIFICIAL_TRAINING_COUNT_PAIRS.csv
            research/R184/R184_FINAL_MACHINE_ACCEPTANCE.json
            research/R184/R184_Exact_Poisson_45_Worlds_Source_Audit.zip
          retention-days: 90
      - name: Permanently commit artificial count evidence to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R184/R184_EXACT_RESULTS.json research/R184/R184_ALL_4125_ARTIFICIAL_TRAINING_COUNT_PAIRS.csv research/R184/R184_FINAL_MACHINE_ACCEPTANCE.json research/R184/R184_Exact_Poisson_45_Worlds_Source_Audit.zip
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R184): exact 45 Poisson working GLM worlds and count dispersion predictive risks'
            git push origin HEAD:main
          fi
