name: R327 finite POMDP 72 paths E1
on:
  push:
    paths:
      - 'research/R327/**'
      - 'research/catalogue_audit/independent_r327_pomdp_audit.py'
      - '.github/workflows/r327-pomdp-72-paths-e1.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python research/R327/r327_finite_pomdp.py --test --audit
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/catalogue_audit/independent_r327_pomdp_audit.py
