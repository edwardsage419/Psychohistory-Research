name: R065 Phase K native seven author objectives

on:
  push:
    paths:
      - 'research/R065/r065_phase_k_native_objectives.py'
      - 'research/R065/test_r065_phase_k_native_objectives.py'
      - 'research/R065/R065_PHASE_J_SCREENED_24_RESULTS.json'
      - '.github/workflows/r065-phase-k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gate-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline provenance and numeric gate tests
        working-directory: research/R065
        run: python -m unittest -v test_r065_phase_k_native_objectives

  native-seven-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native research runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Download exact author source and same Phase J participant files
        shell: bash
        run: |
          set -euo pipefail
          repo='https://raw.githubusercontent.com/arielevy8/obs-learning-fishing/fd5f435b5368b69916e7acc6a9991aa5f46b3ddb'
          mkdir -p /tmp/r065_k_author /tmp/r065_k_raw
          curl -fsSL --retry 2 "$repo/model_fitting/objectives.py" -o /tmp/r065_k_author/objectives.py
          curl -fsSL --retry 2 "$repo/model_fitting/fit_utils.py" -o /tmp/r065_k_author/fit_utils.py
          curl -fsSL --retry 2 "$repo/data/processed/unified_data_2025-01-16_00.csv" -o /tmp/r065_k_processed.csv
          PYTHONPATH=research/R065 python - <<'PY'
          from pathlib import Path
          from r065_critical_replay import parse_verified
          from r065_phase_j_screened_replay import select_eligible
          from r065_phase_k_native_objectives import verified_upstream
          verified_upstream(Path('/tmp/r065_k_author'))
          selected = select_eligible(parse_verified(Path('/tmp/r065_k_processed.csv').read_bytes()))
          ids = selected['first_high'] + selected['first_low']
          assert len(ids) == 24
          Path('/tmp/r065_k_ids.txt').write_text('\n'.join(ids) + '\n')
          print('Exact author Python source and screened 24-subject selection verified')
          PY
          while IFS= read -r pid; do
            curl -fsSL --retry 2 "$repo/data/$pid.csv" -o "/tmp/r065_k_raw/$pid.csv"
          done < /tmp/r065_k_ids.txt
      - name: Execute seven native author objectives and verify Model3 anchors
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/r065_k_author /tmp/r065_k_raw /tmp/r065_k_processed.csv /tmp/r065_k_ids.txt /tmp/r065_k_result.json' EXIT
          python research/R065/r065_phase_k_native_objectives.py \
            --upstream-dir /tmp/r065_k_author \
            --processed /tmp/r065_k_processed.csv \
            --raw-dir /tmp/r065_k_raw \
            --manifest research/R065/R065_PHASE_J_SCREENED_24_RESULTS.json \
            --output /tmp/r065_k_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/r065_k_result.json').read_text())
          assert d['status'] == 'EXACT_SOURCE_NATIVE_SMOKE_PASS'
          assert d['subjects'] == 24 and d['scored_play_trials'] == 1327
          assert len(d['models']) == 7 and d['pesen_v01'] == 'FROZEN'
          print(json.dumps({
              'stage': 'R065_PHASE_K',
              'zero_vector_unfitted_native_nll': {
                  k: round(v['unfitted_zero_vector_total_nll'], 9)
                  for k, v in sorted(d['models'].items())
              },
              'native_model3_mean_nll': d['native_model3_mean_nll'],
              'native_model3_fixed_beta5_mean_nll': d['native_model3_fixed_beta5_mean_nll'],
              'scope': 'native smoke only; no seven-model refitting or independent prediction'
          }, sort_keys=True))
          PY
