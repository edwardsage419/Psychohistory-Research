name: R253 Four Agent Finite Bayesian Cascade and Mechanism Aliases
on:
  push:
    paths:
      - 'research/R253/r253_exact_bayesian_cascade.py'
      - '.github/workflows/r253-exact-cascade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-cascade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact four agent posterior, finite action sequence laws and structural aliases
        run: python research/R253/r253_exact_bayesian_cascade.py --test
  all-original-cascade-source-archive:
    needs: dual-python-cascade-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all 4608 nine-bit agents and independently audit Bayes and do contrast
        run: |
          python research/R253/r253_exact_bayesian_cascade.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R253')
          rows=list(csv.DictReader((d/'R253_ALL_4608_ORIGINAL_FOUR_AGENT_SIGNAL_SOURCES.csv').open()))
          j=json.loads((d/'R253_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R253_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==4608 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-013'
          assert j['prescore_freeze_commit']=='ffb215ac35978839a3ae6db162d6447f6752ad15'
          by={w['world']:w for w in j['world_results']}
          assert len(by)==9
          for w,r in by.items():
              source=[a for a in rows if a['world']==w]
              assert len(source)==512
              bits=['oracle_true_state_theta']+['oracle_original_signal_R'+str(i)+s for i in (1,2,3,4) for s in ('1','2')]
              assert len({tuple(a[b] for b in bits) for a in source})==512
              assert all(F(a['original_full_ninebit_source_probability'])==F(1,512) for a in source)
              assert sum((F(a['original_full_ninebit_source_probability']) for a in source),F(0))==1
              assert sum((F(x) for x in r['observed_four_person_path_joint'].values()),F(0))==1
              assert all(len(s)==4 for s in r['observed_four_person_path_joint'])
              assert r['independent_theta_private_signal_product_law_verified']
              assert len(r['observed_action_accuracy_by_agent'])==4
              assert F(r['observed_first_two_agreement_probability'])>=0
              acc=[sum((F(1,512) for a in source if a['observed_public_action_Y'+str(i)]==a['oracle_true_state_theta']),F(0)) for i in (1,2,3,4)]
              assert list(map(str,acc))==r['observed_action_accuracy_by_agent']
          bayes=by['BAYESIAN_CASCADE_Q34']
          assert bayes['observed_action_accuracy_by_agent']==['3/4','3/4','27/32','27/32']
          assert bayes['observed_first_two_agreement_probability']=='5/8'
          assert bayes['observed_agreement_correct_joint_probability']=='9/16'
          assert bayes['observed_agreement_action_correct_given_first_two_agree']=='9/10'
          assert bayes['oracle_third_action_disagrees_own_private_signal_probability']=='3/16'
          assert by['PRIVATE_ONLY_Q34']['observed_action_accuracy_by_agent']==['3/4']*4
          assert by['FIRST_ACTION_IMITATION_Q34']['observed_action_accuracy_by_agent']==['3/4']*4
          assert by['BAYESIAN_CASCADE_FAIR_Q12']['observed_action_accuracy_by_agent']==['1/2']*4
          assert by['PERFECT_PRIVATE_Q1']['observed_action_accuracy_by_agent']==['1']*4
          assert by['INVERTED_SIGNALS_Q14_BAYES']['observed_action_accuracy_by_agent'][2:]==['27/32','27/32']
          same=bayes['observed_four_person_path_joint']
          for w in ('HARD_CODED_CASCADE_ALIAS_Q34','STATIC_TRUE_PRIVATE_CASCADE_REPORT_ALIAS_Q34'):
              assert by[w]['observed_four_person_path_joint']==same
          assert by['FIRST_ACTION_IMITATION_Q34']['observed_four_person_path_joint']==by['COMMON_SIGNAL_NO_SOCIAL_Q34']['observed_four_person_path_joint']
          mim=[r for r in rows if r['world']=='FIRST_ACTION_IMITATION_Q34']
          common=[r for r in rows if r['world']=='COMMON_SIGNAL_NO_SOCIAL_Q34']
          assert len(mim)==len(common)==512
          for a,b in zip(mim,common):
              assert tuple(a['observed_public_action_Y'+str(i)] for i in (1,2,3,4))==tuple(b['observed_public_action_Y'+str(i)] for i in (1,2,3,4))
              assert a['oracle_do_report_Y1_flip_next_report_Y2']!=b['oracle_do_report_Y1_flip_next_report_Y2']
          sensor=[r for r in rows if r['world']=='STATIC_TRUE_PRIVATE_CASCADE_REPORT_ALIAS_Q34']
          assert all(all(r['oracle_true_hidden_action_H'+str(i)]==r['oracle_private_signal_S'+str(i)] for i in (1,2,3,4)) for r in sensor)
          for filename,key in [('R253_ALL_4608_ORIGINAL_FOUR_AGENT_SIGNAL_SOURCES.csv','source_sha256'),
                               ('R253_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/filename).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R253_ALL_4608_NINEBIT_BAYESIAN_CASCADE_ORIGINAL_SOURCES_AND_DO_ALIASES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R253-Nine-FourAgent-Cascade-Exact-Source-Worlds
          path: |
            research/R253/R253_ALL_4608_ORIGINAL_FOUR_AGENT_SIGNAL_SOURCES.csv
            research/R253/R253_EXACT_RESULTS.json
            research/R253/R253_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all 4608 original cascade atoms to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R253/R253_ALL_4608_ORIGINAL_FOUR_AGENT_SIGNAL_SOURCES.csv research/R253/R253_EXACT_RESULTS.json research/R253/R253_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R253): all 4608 original four agent cascade nine-bit source atoms'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R253_ALL_4608_ORIGINAL_CASCADE_SOURCES_PERMANENTLY_ARCHIVED'
                exit 0
              fi
              echo "R253 archival push raced with independent main update, retry $attempt"
              sleep 2
            done
            echo 'R253 archived source push failed after bounded retries'
            exit 1
          fi
