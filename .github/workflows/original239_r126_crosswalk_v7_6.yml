name: Original239 existing R126 Crosswalk v7.6
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.6_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_157_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - 'docs/ORIGINAL239_05-002_R126_E1_REATTRIBUTION_ACCEPTANCE.json'
      - '.github/workflows/original239_r126_crosswalk_v7_6.yml'
permissions:
  contents: read
jobs:
  verify_catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify 239 original models, 157 pending, exact R126 E1 provenance
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, hashlib
          from pathlib import Path
          d=Path("docs")
          x=json.loads((d/"ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.6_2026-10-24.json").read_text())
          a=json.loads((d/"ORIGINAL239_05-002_R126_E1_REATTRIBUTION_ACCEPTANCE.json").read_text())
          with (d/"ORIGINAL_239_PENDING_157_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv").open(newline="") as f:
              q=list(csv.DictReader(f))
          assert len(x["rows"])==239 and x["total_original_models"]==239
          assert x["provisional_itemwise_audit_open_count"]==157
          assert x["status_counts"]["PROVISIONAL_PRIMARY_README_LINK"]==157
          assert sum(x["status_counts"].values())==239
          assert len(q)==157 and len({r["catalogue_id"] for r in q})==157
          assert "05-002" not in {r["catalogue_id"] for r in q}
          r=next(r for r in x["rows"] if r["catalogue_id"]=="05-002")
          assert r["proposed_primary_research_id"]=="R126"
          assert r["scientific_evidence_grade"]=="BOUNDED_EXISTING_E1_FEHR_GAECHTER_INTEGER_PAYOFF_CONSTRUCTED_ONLY"
          assert r["method_specific_E1_acceptance"]=="docs/ORIGINAL239_05-002_R126_E1_REATTRIBUTION_ACCEPTANCE.json"
          assert a["CI_status"]=="completed/success" and a["CI_run"]==40095282746
          assert a["new_human_E2"]==0 and a["new_historical_E3"]==0
          data=Path(a["raw_csv"]).read_bytes()
          assert hashlib.sha256(data).hexdigest()==a["raw_csv_sha256"]
          print("PASS 239 entries, 157 pending, R126 bounded E1, pinned 5000 rows")
          PY
