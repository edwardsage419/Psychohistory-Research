name: R201 Exact Cox Finite Order and Censoring
on:
  push:
    paths:
      - 'research/R201/r201_exact_cox_partial_likelihood.py'
      - '.github/workflows/r201-exact-cox-hazards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  double-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test exact Cox risk sets, model selection, censoring, ties and independent cohort scoring
        run: python research/R201/r201_exact_cox_partial_likelihood.py --test
  archive-exact-artificial-source-and-independent-forecast:
    runs-on: ubuntu-latest
    needs: double-python-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 9 worlds, all 120 training prefixes, true independent cohort expected risk and SHA
        run: |
          python research/R201/r201_exact_cox_partial_likelihood.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path('research/R201')
          r=json.loads((root/'R201_EXACT_RESULTS.json').read_text())
          a=json.loads((root/'R201_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          with (root/'R201_ALL_120_ORIGINAL_TRAINING_PREFIXES.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==120 and len(r['worlds'])==9
          assert sorted(set(w['training_observed_event_count'] for w in r['worlds'])) == [1,2,3]
          assert a['all_original_prefix_records']==120 and a['source_complete_orders']==72
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert a['result_sha256']==hashlib.sha256((root/'R201_EXACT_RESULTS.json').read_bytes()).hexdigest()
          assert a['source_prefix_csv_sha256']==hashlib.sha256((root/'R201_ALL_120_ORIGINAL_TRAINING_PREFIXES.csv').read_bytes()).hexdigest()
          assert any(w['true_hr']=='1' and w['oracle_gap_exact']!='0' for w in r['worlds'])
          print('R201_EXACT_COX_E1_9_WORLDS_120_PREFIXES_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R201-Exact-Cox-9-Worlds-And-120-Prefixes
          path: |
            research/R201/R201_EXACT_RESULTS.json
            research/R201/R201_ALL_120_ORIGINAL_TRAINING_PREFIXES.csv
            research/R201/R201_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive exact artificial Cox results to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R201/R201_EXACT_RESULTS.json research/R201/R201_ALL_120_ORIGINAL_TRAINING_PREFIXES.csv research/R201/R201_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R201): complete exact Cox training prefixes and independent new-cohort forecast risk'
            git push origin HEAD:main
          fi
