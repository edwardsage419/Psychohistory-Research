name: R266 Exact Finite Monte Carlo Independent Source Audit
on:
  push:
    paths:
      - 'research/R266/r266_finite_monte_carlo.py'
      - '.github/workflows/r266-finite-monte-carlo-e1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify 136 real independent-enumerator-and-convolution unit tests
        run: python research/R266/r266_finite_monte_carlo.py --test
  independent-source-audit-and-archive:
    needs: dual-python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce all 5328 complete artificial sources and 18 exact sample-distribution PMFs
        run: |
          python research/R266/r266_finite_monte_carlo.py --emit
          python - <<'PY'
          import csv, json, hashlib, itertools
          from collections import defaultdict
          from fractions import Fraction as F
          from pathlib import Path
          root=Path('research/R266')
          rows=list(csv.DictReader((root/'R266_ALL_5328_FINITE_MONTE_CARLO_ORIGINAL_SOURCES.csv').open()))
          result=json.loads((root/'R266_EXACT_FINITE_MC_RESULTS.json').read_text())
          receipt=json.loads((root/'R266_MACHINE_RECEIPT.json').read_text())
          assert len(rows)==5328
          assert result['prescore_freeze_commit']==receipt['prescore_freeze_commit']=='634230df411eca00badadaa0c593f28ae08773c8'
          assert result['original_catalogue_id']=='11-026'
          assert len(result['worlds'])==9
          groups=defaultdict(list)
          for row in rows:
              groups[(row['world'],row['design'])].append(row)
          assert len(groups)==18
          # Third audit: reconstruct event from independently hard-coded level sets.
          level={'THRESHOLD_Q1':{0},'THRESHOLD_HALF':{0,1},
                 'THRESHOLD_Q3':{0,1,2},'SYMMETRIC_EXTREMES':{0,3}}
          source_total=0
          for item in result['worlds']:
              fn=item['function']; n=item['evaluations']; w=item['world']
              event=level[fn]; truth=F(len(event),4)
              assert item['true_integral']==str(truth)
              for design in ('IID','ANTITHETIC'):
                  subset=groups[(w,design)]
                  k=n if design=='IID' else n//2
                  assert len(subset)==4**k
                  origin={tuple(int(s) for s in r['original_source_tuple'].split(';')) for r in subset}
                  assert origin==set(itertools.product(range(4),repeat=k))
                  hist=defaultdict(lambda:F(0))
                  for r in subset:
                      tup=tuple(int(s) for s in r['original_source_tuple'].split(';'))
                      val=sum(int(x in event) for x in tup) if design=='IID' else sum(int(x in event)+int((3-x) in event) for x in tup)
                      estimated=F(val,n)
                      assert int(r['event_success_count'])==val
                      assert F(r['estimate'])==estimated
                      assert F(r['true_integral'])==truth
                      assert F(r['exact_source_mass'])==F(1,4**k)
                      assert F(r['squared_error'])==(estimated-truth)**2
                      hist[estimated]+=F(r['exact_source_mass'])
                  assert sum(hist.values(),F(0))==1
                  claimed=item['designs'][design]
                  assert len(subset)==claimed['source_atoms']
                  assert {str(x):str(y) for x,y in sorted(hist.items())}==claimed['exact_complete_estimator_PMF']
                  mean=sum((x*prob for x,prob in hist.items()),F(0))
                  variance=sum(((x-mean)**2*prob for x,prob in hist.items()),F(0))
                  mse=sum(((x-truth)**2*prob for x,prob in hist.items()),F(0))
                  assert mean==truth and variance==mse
                  assert str(variance)==claimed['exact_variance']==claimed['exact_MSE']
                  assert claimed['exact_bias']=='0'
                  source_total+=len(subset)
              iid=F(item['designs']['IID']['exact_variance'])
              anti=F(item['designs']['ANTITHETIC']['exact_variance'])
              expected_ratio=F(2,3) if fn in ('THRESHOLD_Q1','THRESHOLD_Q3') else (F(0) if fn=='THRESHOLD_HALF' else F(2))
              assert anti/iid==F(item['antithetic_over_IID_variance_ratio'])==expected_ratio
          assert source_total==5328
          for filename,key in [('R266_ALL_5328_FINITE_MONTE_CARLO_ORIGINAL_SOURCES.csv','source_sha256'),
                               ('R266_EXACT_FINITE_MC_RESULTS.json','results_sha256')]:
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==receipt[key]
          assert result['no_real_human_E2']==result['no_real_historical_E3']==0
          print('R266_5328_COMPLETE_ORIGINAL_SOURCES_AND_18_INDEPENDENT_PMF_AUDIT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R266-5328-Finite-Monte-Carlo-Source-Atoms
          path: |
            research/R266/R266_ALL_5328_FINITE_MONTE_CARLO_ORIGINAL_SOURCES.csv
            research/R266/R266_EXACT_FINITE_MC_RESULTS.json
            research/R266/R266_MACHINE_RECEIPT.json
          retention-days: 90
      - name: Permanently archive all original R266 source types
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R266/R266_ALL_5328_FINITE_MONTE_CARLO_ORIGINAL_SOURCES.csv research/R266/R266_EXACT_FINITE_MC_RESULTS.json research/R266/R266_MACHINE_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R266): all 5328 finite IID and antithetic Monte Carlo source atoms'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R266_FULL_FINITE_MONTE_CARLO_SOURCES_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
