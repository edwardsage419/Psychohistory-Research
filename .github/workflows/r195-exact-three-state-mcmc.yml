name: R195 Exact Three State Metropolis MCMC and Finite ESS
on:
  push:
    paths:
      - 'research/R195/r195_three_state_metropolis_exact.py'
      - '.github/workflows/r195-exact-three-state-mcmc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent-rational-MCMC-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact detailed balance, powers, autocorrelation and seeded replay
        run: |
          cd research/R195
          python r195_three_state_metropolis_exact.py --test
  full-24-world-exact-ess-and-permanent-archive:
    runs-on: ubuntu-latest
    needs: independent-rational-MCMC-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce all 9288 exact probability cells and 96 seeded artificial chains
        run: |
          cd research/R195
          python r195_three_state_metropolis_exact.py --run-and-archive
          python - <<'PY'
          import csv,json,zipfile
          from pathlib import Path
          from hashlib import sha256
          r=json.loads(Path('R195_EXACT_RESULTS.json').read_text())
          a=json.loads(Path('R195_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          k=json.loads(Path('R195_ALL_8_EXACT_MCMC_KERNELS_AND_ESS.json').read_text())
          assert r['world_count']==24 and len(r['all_24_start_worlds'])==24
          assert r['exact_kernel_count']==8 and len(k['kernels'])==8
          assert r['exact_distribution_cell_count']==9288
          assert r['seeded_replica_paths']==96
          assert all(x['independent_covariance_and_occupancy_moment_DP_match'] for x in k['kernels'])
          with Path('R195_ALL_9288_EXACT_DISTRIBUTION_CELLS.csv').open() as f:
            assert sum(1 for _ in csv.DictReader(f))==9288
          with Path('R195_ALL_96_SEEDED_MCMC_REPLICATES.csv').open() as f:
            assert sum(1 for _ in csv.DictReader(f))==96
          assert a['result_sha256']==sha256(Path('R195_EXACT_RESULTS.json').read_bytes()).hexdigest()
          assert a['cells_sha256']==sha256(Path('R195_ALL_9288_EXACT_DISTRIBUTION_CELLS.csv').read_bytes()).hexdigest()
          assert a['kernels_sha256']==sha256(Path('R195_ALL_8_EXACT_MCMC_KERNELS_AND_ESS.json').read_bytes()).hexdigest()
          assert a['simulations_sha256']==sha256(Path('R195_ALL_96_SEEDED_MCMC_REPLICATES.csv').read_bytes()).hexdigest()
          assert r['new_E2']==r['new_E3']==0
          with zipfile.ZipFile('R195_24_Exact_ThreeState_MCMC_Worlds.zip') as z:
            assert len(z.namelist())==7 and z.testzip() is None
          print('R195_EXACT_METROPOLIS_MCMC_FINITE_ESS_AND_MC_REPLAY_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R195-24-Exact-Metropolis-Worlds
          path: |
            research/R195/R195_EXACT_RESULTS.json
            research/R195/R195_ALL_9288_EXACT_DISTRIBUTION_CELLS.csv
            research/R195/R195_ALL_8_EXACT_MCMC_KERNELS_AND_ESS.json
            research/R195/R195_ALL_96_SEEDED_MCMC_REPLICATES.csv
            research/R195/R195_FINAL_MACHINE_ACCEPTANCE.json
            research/R195/R195_24_Exact_ThreeState_MCMC_Worlds.zip
          retention-days: 90
      - name: Commit permanent auditable bounded E1 MCMC source and result archive
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R195/R195_EXACT_RESULTS.json research/R195/R195_ALL_9288_EXACT_DISTRIBUTION_CELLS.csv research/R195/R195_ALL_8_EXACT_MCMC_KERNELS_AND_ESS.json research/R195/R195_ALL_96_SEEDED_MCMC_REPLICATES.csv research/R195/R195_FINAL_MACHINE_ACCEPTANCE.json research/R195/R195_24_Exact_ThreeState_MCMC_Worlds.zip
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R195): 24 exact Metropolis starts, stationary finite ESS, 9288 rational cells and 96 seeded artificial paths'
            git push origin HEAD:main
          fi
