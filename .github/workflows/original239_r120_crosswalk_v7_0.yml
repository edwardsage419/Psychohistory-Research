name: Original239 existing R120 Crosswalk v7.0
on:
  push:
    branches: [main]
    paths:
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v7.0_2026-10-24.json'
      - 'docs/ORIGINAL_239_PENDING_163_ITEMWISE_EVIDENCE_TRIAGE_QUEUE_2026-10-24.csv'
      - 'docs/ORIGINAL239_04-003_R120_E1_REATTRIBUTION_ACCEPTANCE.json'
      - 'research/catalogue_audit/verify_original239_v7_0_existing_r120.py'
      - '.github/workflows/original239_r120_crosswalk_v7_0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict_crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify 239 identities, R120 scoped E1 and 163 pending items
        run: python research/catalogue_audit/verify_original239_v7_0_existing_r120.py
