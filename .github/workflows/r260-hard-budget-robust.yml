name: R260 Exact Robust Minimax Regret and Hard Scenario Budget
on:
  push:
    paths:
      - 'research/R260/r260_exact_hard_budget_robust.py'
      - '.github/workflows/r260-hard-budget-robust.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-robust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source-level hard uncertainty sets, independent robust epigraph and regret bounds
        run: python research/R260/r260_exact_hard_budget_robust.py --test
  original-complete-robust-source-archive:
    needs: dual-python-robust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit 540 original atoms and independently audit all budget/worst/regret values
        run: |
          python research/R260/r260_exact_hard_budget_robust.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from fractions import Fraction as F
          d=Path('research/R260')
          rows=list(csv.DictReader((d/'R260_ALL_540_ORIGINAL_SCENARIO_BUDGET_SOURCE_ATOMS.csv').open()))
          j=json.loads((d/'R260_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R260_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==540 and len(j['world_results'])==9
          assert j['original_catalogue_id']==rec['original_catalogue_id']=='11-020'
          assert j['prescore_freeze_commit']=='e04a1601506367fb54f4f3db70a763f96f53102e'
          names='ABCDE'
          shocks=((0,0),(0,1),(1,0),(1,1))
          expected={
           'ALIGNED_DOMINANCE':((1,'A',0,'A'),(2,'A',0,'A'),(3,'A',0,'A')),
           'HIDDEN_JOINT_TAIL':((0,'A',0,'A'),(0,'A',0,'A'),(3,'C',3,'BC')),
           'REGRET_VS_WORST':((0,'A',0,'A'),(0,'A',0,'A'),(4,'C',2,'B')),
           'NONMONOTONE_SHOCK_COST':((2,'B',0,'B'),(2,'B',2,'ABC'),(2,'B',2,'AB')),
           'TWO_SHOCK_INTERACTION':((0,'A',0,'A'),(0,'A',0,'A'),(3,'C',3,'C')),
           'ADDITIVE_COMMON_SHOCK':((0,'A',0,'A'),(2,'A',0,'A'),(3,'A',0,'A')),
           'HIDDEN_TAIL_ALIAS':((0,'A',0,'A'),(0,'A',0,'A'),(0,'A',0,'A')),
           'TIED_WORST_CASE':((0,'A',0,'A'),(1,'B',1,'AB'),(2,'AC',1,'AB')),
           'HEDGE_VS_NOMINAL':((0,'A',0,'A'),(3,'C',2,'B'),(3,'C',2,'B'))}
          by={w['world']:w for w in j['world_results']}
          assert set(by)==set(expected)
          for w,r in by.items():
              sub=[z for z in rows if z['world']==w]
              assert len(sub)==60
              key=lambda z:(z['original_action'],z['original_shock_bit_1'],z['original_shock_bit_2'],z['original_uncertainty_budget_Gamma'])
              assert len({key(z) for z in sub})==60
              assert all(F(z['original_complete_action_scenario_budget_design_mass'])==F(1,60) for z in sub)
              assert sum((F(z['original_complete_action_scenario_budget_design_mass']) for z in sub),F(0))==1
              costs={a:[F(z) for z in r['frozen_cost_matrix_by_action'][a]] for a in names}
              for z in sub:
                  s=int(z['original_shock_bit_1']),int(z['original_shock_bit_2'])
                  g=int(z['original_uncertainty_budget_Gamma'])
                  assert int(z['original_scenario_is_budget_eligible'])==int(sum(s)<=g)
                  assert F(z['original_action_scenario_loss'])==costs[z['original_action']][shocks.index(s)]
                  assert F(z['oracle_independent_fair_two_shock_probability'])==F(1,4)
              fair={a:sum(costs[a],F(0))/4 for a in names}
              fmin=min(fair.values())
              assert F(r['fair_iid_two_bit_risk_neutral_best_expected_cost'])==fmin
              assert r['fair_iid_risk_neutral_all_optimal_actions']==[a for a in names if fair[a]==fmin]
              for g in (0,1,2):
                  data=r['exact_hard_uncertainty_budget_0_1_2'][str(g)]
                  allowable=[i for i,s in enumerate(shocks) if sum(s)<=g]
                  assert data['count_budget_eligible_shocks']==len(allowable)
                  worst={a:max(costs[a][i] for i in allowable) for a in names}
                  opt=min(worst.values())
                  regret={a:max(costs[a][i]-min(costs[b][i] for b in names) for i in allowable) for a in names}
                  ropt=min(regret.values())
                  v,ws,expected_regret,rs=expected[w][g]
                  assert (opt,''.join(a for a in names if worst[a]==opt),ropt,''.join(a for a in names if regret[a]==ropt))==(F(v),ws,F(expected_regret),rs)
                  assert data['minimum_worst_case_loss']==str(opt)
                  assert data['minimum_maximum_regret']==str(ropt)
                  assert data['all_minimax_cost_actions']==list(ws)
                  assert data['all_minimax_regret_actions']==list(rs)
                  assert data['all_action_worst_case_losses']=={a:str(worst[a]) for a in names}
                  assert data['all_action_worst_case_regrets']=={a:str(regret[a]) for a in names}
                  for a in names:
                      witness=data['independent_scenario_epigraph_witnesses'][a]
                      s=tuple(map(int,witness['worst_cost_scenario']))
                      t=tuple(map(int,witness['worst_regret_scenario']))
                      assert sum(s)<=g and sum(t)<=g
                      assert costs[a][shocks.index(s)]==worst[a]
                      assert costs[a][shocks.index(t)]-min(costs[b][shocks.index(t)] for b in names)==regret[a]
                  assert data['analytic_nonstatistical_uncertainty_set_verified']
          tail=by['HIDDEN_JOINT_TAIL'];other=by['HIDDEN_TAIL_ALIAS']
          for a in names:
              assert tail['frozen_cost_matrix_by_action'][a][:3]==other['frozen_cost_matrix_by_action'][a][:3]
          assert tail['exact_hard_uncertainty_budget_0_1_2']['2']['all_minimax_cost_actions']==['C']
          assert other['exact_hard_uncertainty_budget_0_1_2']['2']['all_minimax_cost_actions']==['A']
          assert by['REGRET_VS_WORST']['exact_hard_uncertainty_budget_0_1_2']['2']['all_minimax_regret_actions']==['B']
          for filename,key in [('R260_ALL_540_ORIGINAL_SCENARIO_BUDGET_SOURCE_ATOMS.csv','source_sha256'),
                               ('R260_EXACT_RESULTS.json','results_sha256')]:
              assert rec[key]==hashlib.sha256((d/filename).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R260_ALL_540_ORIGINAL_BUDGET_SCENARIO_AND_MINIMAX_REGRET_WITNESSES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R260-Nine-Exact-Hard-Uncertainty-Budget-Worlds
          path: |
            research/R260/R260_ALL_540_ORIGINAL_SCENARIO_BUDGET_SOURCE_ATOMS.csv
            research/R260/R260_EXACT_RESULTS.json
            research/R260/R260_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Archive all 540 original hard-uncertainty source atoms to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R260/R260_ALL_540_ORIGINAL_SCENARIO_BUDGET_SOURCE_ATOMS.csv research/R260/R260_EXACT_RESULTS.json research/R260/R260_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R260): all 540 original hard uncertainty budget sources'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'R260_ALL_540_ORIGINAL_HARD_BUDGET_SOURCES_PERMANENTLY_ARCHIVED'
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
