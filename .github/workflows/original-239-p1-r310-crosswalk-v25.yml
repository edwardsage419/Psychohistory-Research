name: Original 239 P1 R310 Voter Graph E1 Crosswalk v2.5
on:
  push:
    paths:
      - 'research/catalogue_audit/verify_p1_r310_crosswalk_v2_5.py'
      - 'docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v2.5_2026-10-23.json'
      - 'docs/ORIGINAL_239_PENDING_37_P1_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-23.csv'
      - '.github/workflows/original-239-p1-r310-crosswalk-v25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-python-original239:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all 16 original239 v2.5 single-row links and R310 corrected graph scope tests
        run: python research/catalogue_audit/verify_p1_r310_crosswalk_v2_5.py --test
  independent-source-catalogue:
    needs: dual-python-original239
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently audit 238 unmodified original rows and all 416 voter directed sources
        run: |
          python research/catalogue_audit/verify_p1_r310_crosswalk_v2_5.py --audit
          python research/catalogue_audit/independent_r310_source_audit.py --audit
      - uses: actions/upload-artifact@v4
        with:
          name: Original239-R310-v25-199Primary-37Pending-GraphVoterE1Only
          path: |
            docs/ORIGINAL_239_CATALOGUE_TO_R_EVIDENCE_PROVENANCE_CROSSWALK_v2.5_2026-10-23.json
            docs/ORIGINAL_239_PENDING_37_P1_P2_EVIDENCE_TRIAGE_QUEUE_2026-10-23.csv
            research/R310/R310_FINAL_ACCEPTANCE_STATUS.json
          retention-days: 90
