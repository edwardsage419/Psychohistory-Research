name: R077 true fourth experimental human partner and round identity before model gate
on:
  push:
    paths:
      - '.github/workflows/r077-fourth-zenodo-human-pair-time.yml'
      - 'research/R077/r077_zenodo_fourth_human_partner_time_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-human-source-pair-feedback-temporal-integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Stata source reader
        run: python -m pip install --disable-pip-version-check --quiet pandas
      - name: Verify true authors source and all opponent pairs by original session game round
        shell: bash
        run: |
          set -euo pipefail
          python research/R077/r077_zenodo_fourth_human_partner_time_audit.py \
            --private-dir /tmp/r077_human_raw \
            --output /tmp/r077_aggregate_only/true_partner_time_gate.json
      - name: Save only anonymous structural counts, no participant trajectories or predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r077-fourth-original-human-session-pair-time-pre-e3
          path: /tmp/r077_aggregate_only/true_partner_time_gate.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Destroy raw fourth human file and aggregate runner temp
        if: always()
        run: rm -rf /tmp/r077_human_raw /tmp/r077_aggregate_only
