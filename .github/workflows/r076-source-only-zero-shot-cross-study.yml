name: R076 retrospective R073 source-only zero-shot numerical transfer to two real human studies
on:
  push:
    paths:
      - '.github/workflows/r076-source-only-zero-shot-cross-study.yml'
      - 'research/R076/r076_source_only_cross_study_transfer.py'
      - 'research/R076/test_r076_source_only_cross_study_transfer.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  completely-synthetic-source-only-transfer-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all source-only no-label-leakage and unchanged R073 formula tests
        working-directory: research/R076
        run: python -m unittest -v test_r076_source_only_cross_study_transfer
  independent-recompute-three-author-real-human-zero-shot-parameters:
    needs: completely-synthetic-source-only-transfer-controls
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact 2 R073 donor Git blob files and original two full target experiments into private runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r076_private/donor /tmp/r076_public
          python - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request
          def get(url,max_bytes):
              req=urllib.request.Request(url,headers={
                  "User-Agent":"Psychohistory-R076-retrospective-numerical-transfer-source-locked/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(max_bytes+1)
          commit="4743f74d8a03a031b8f70aff64956f8ad5155182"
          files={
              "fix.csv":(988279,"3bf78bf85f6642afee18d6f1965dca7272582f40"),
              "rand.csv":(1112614,"f5a86cd033b739da45d3fc7c5019068f612146a2"),
          }
          for name,(size,expected) in files.items():
              data=get(f"https://raw.githubusercontent.com/eladiomontero/PairwiseStrategies/{commit}/{name}",size)
              digest=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              if len(data)!=size or digest!=expected:raise ValueError("R073_DONOR_SOURCE_HASH_INVALID")
              Path("/tmp/r076_private/donor",name).write_bytes(data)
          targets={
              "r074.txt":(
                  "https://gfrechette.com/data/Dal_Bo_2011a_data.txt",
                  1140746,"357a12968546a8d9002c912c1f499e02e93d59113d2a0928de2dee48323a0ae6"),
              "r075.zip":(
                  "https://davidrand-cooperation.com/s/slow-to-anger-and-fast-to-forgive-data-and-code.zip",
                  1129409,"328346c3cf88a71a3d6cf574f7d6ba741dcea460f3926c16266f1784d3a699ef"),
          }
          for name,(url,size,expected) in targets.items():
              data=get(url,size)
              if len(data)!=size or hashlib.sha256(data).hexdigest()!=expected:
                  raise ValueError("EXTERNAL_TARGET_SOURCE_BYTES_OR_SHA_CHANGED")
              Path("/tmp/r076_private",name).write_bytes(data)
          print("R076 real three-author source identity and all 4 exact byte checks PASS")
          PY
      - name: Fit only to the 12 R073 source sessions and report all target-model loss including negative results
        shell: bash
        run: |
          set -euo pipefail
          python research/R076/r076_source_only_cross_study_transfer.py \
            --r073-source-dir /tmp/r076_private/donor \
            --r074-source /tmp/r076_private/r074.txt \
            --r075-source /tmp/r076_private/r075.zip \
            --output /tmp/r076_public/retrospective_R073_to_R074_R075_zero_shot_aggregate.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("/tmp/r076_public/retrospective_R073_to_R074_R075_zero_shot_aggregate.json")
          raw=p.read_bytes()
          result=json.loads(raw)
          assert result["target_label_records_used_for_any_fitting"]==0
          print("R076_SOURCE_ONLY_REAL_TRANSFER_JSON_BYTES",len(raw))
          print("R076_SOURCE_ONLY_REAL_TRANSFER_JSON_SHA256",hashlib.sha256(raw).hexdigest())
          PY
      - name: Publish only model macro and paired score anonymous aggregates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r076-retrospective-source-only-three-donors-two-experiments
          path: /tmp/r076_public/retrospective_R073_to_R074_R075_zero_shot_aggregate.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Erase all real people original data and temporary anonymous scores
        if: always()
        run: rm -rf /tmp/r076_private /tmp/r076_public
