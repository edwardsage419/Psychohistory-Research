name: R228 Exact Rasch Two Parameter IRT and Independent Prediction
on:
  push:
    paths:
      - 'research/R228/r228_exact_item_response_theory.py'
      - '.github/workflows/r228-exact-irt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  python-exact-irt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact Rasch conditional sufficiency, 2PL prediction and DIF tests
        run: python research/R228/r228_exact_item_response_theory.py --test
  full-finite-irt-source-archive:
    needs: python-exact-irt-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 384 structural response atoms and independently verify exact results and SHA
        run: |
          python research/R228/r228_exact_item_response_theory.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from collections import defaultdict
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R228')
          rows=list(csv.DictReader((d/'R228_ALL_384_ORIGINAL_IRT_RESPONSE_ATOMS.csv').open()))
          result=json.loads((d/'R228_EXACT_RESULTS.json').read_text())
          machine=json.loads((d/'R228_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==384 and len(result['world_results'])==8
          assert machine['original_catalogue_id']==result['catalogue_id']=='10-002'
          assert sum(F(row['source_probability'])>0 for row in rows)==360
          assert sum(F(row['source_probability'])==0 for row in rows)==24
          worlds={w['world']:w for w in result['world_results']}
          for w in worlds:
            src=[r for r in rows if r['world']==w]
            assert len(src)==48 and sum((F(r['source_probability']) for r in src),F(0))==1
            for g in (0,1):
              for k in (-1,0,1):
                specific=[r for r in src if int(r['observed_group_G'])==g and int(r['latent_index_k'])==k]
                assert len(specific)==8 and sum((F(r['source_probability']) for r in specific),F(0))==F(1,6)
          for a,b in [('BASE_RASCH','LOCATION_SHIFT_ALIAS'),
                      ('SCALE_HIGH_DISCRIM','SCALE_LOW_DISCRIM_ALIAS')]:
            assert worlds[a]['observable_joint_response_group_signature']==worlds[b]['observable_joint_response_group_signature']
          assert worlds['TWO_PARAMETER_UNEQUAL']['conditional_total_score_sufficiency_violations']>0
          assert F(worlds['TWO_PARAMETER_UNEQUAL']['total_minus_full_pattern_brier_gain'])>0
          assert worlds['BASE_RASCH']['conditional_total_score_sufficiency_violations']==0
          assert worlds['DIF_SECOND_ITEM']['item2_differential_functioning_by_group']
          assert worlds['LOCAL_DEPENDENT_CLONE']['structural_zero_probability_atoms']==24
          for filename,key in [('R228_ALL_384_ORIGINAL_IRT_RESPONSE_ATOMS.csv','original_source_sha256'),
                               ('R228_EXACT_RESULTS.json','exact_results_sha256')]:
            assert hashlib.sha256((d/filename).read_bytes()).hexdigest()==machine[key]
          assert machine['new_real_human_E2']==machine['new_real_historical_E3']==0
          print('R228_ALL_384_ARTIFICIAL_IRT_SOURCES_AND_INDEPENDENT_PREDICTION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R228-Eight-Finite-IRT-Original-Source-Worlds
          path: |
            research/R228/R228_ALL_384_ORIGINAL_IRT_RESPONSE_ATOMS.csv
            research/R228/R228_EXACT_RESULTS.json
            research/R228/R228_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently save all source and SHA evidence to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R228/R228_ALL_384_ORIGINAL_IRT_RESPONSE_ATOMS.csv research/R228/R228_EXACT_RESULTS.json research/R228/R228_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R228): eight complete exact IRT worlds and all 384 original response source atoms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
