name: R231 Exact Confirmatory Factor Tetrads and Measurement Constraints
on:
  push:
    paths:
      - 'research/R231/r231_exact_cfa_tetrad.py'
      - '.github/workflows/r231-exact-cfa-tetrad.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-exact-cfa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact prescore CFA tetrads source covariance oracle and alias tests
        run: python research/R231/r231_exact_cfa_tetrad.py --test
  complete-original-source-archive:
    needs: dual-python-exact-cfa-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit complete 512 latent sources and separately audit covariance restrictions
        run: |
          python research/R231/r231_exact_cfa_tetrad.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from collections import defaultdict
          from fractions import Fraction as F
          from pathlib import Path
          d=Path('research/R231')
          rows=list(csv.DictReader((d/'R231_ALL_512_ORIGINAL_CFA_STRUCTURAL_ATOMS.csv').open()))
          results=json.loads((d/'R231_EXACT_RESULTS.json').read_text())
          machine=json.loads((d/'R231_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==512 and len(results['world_results'])==8
          assert results['original_catalogue_id']==machine['original_catalogue_id']=='10-005'
          assert all(F(row['original_probability'])==F(1,64) for row in rows)
          by={w['world']:w for w in results['world_results']}
          for world,v in by.items():
            part=[r for r in rows if r['world']==world]
            assert len(part)==64 and sum((F(r['original_probability']) for r in part),F(0))==1
            assert len({(r['hidden_T'],r['hidden_U'],r['independent_E1'],r['independent_E2'],r['independent_E3'],r['independent_E4']) for r in part})==64
            assert len(v['population_observed_covariance'])==4
            assert len(v['three_exact_tetrad_constraints'])==3
          assert by['ONE_FACTOR_VALID']['fixed_equal_loading_candidate_absolute_discrepancy']=='0'
          assert by['ONE_FACTOR_UNEQUAL_LOAD']['fixed_equal_loading_candidate_absolute_discrepancy']!='0'
          assert by['ONE_FACTOR_UNEQUAL_LOAD']['three_exact_tetrad_constraints']==['0','0','0']
          assert by['ONE_FACTOR_SIGNED']['three_exact_tetrad_constraints']==['0','0','0']
          assert by['TETRAD_FALSE_REASSURANCE']['three_exact_tetrad_constraints']==['0','0','0']
          assert by['TETRAD_FALSE_REASSURANCE']['oracle_offdiagonal_conditional_T_residual_nonzero_pairs']==6
          assert by['CORRELATED_RESIDUAL_METHOD']['three_exact_tetrad_constraints']==['1','1','0']
          assert by['TWO_FACTOR_BLOCK']['three_exact_tetrad_constraints']==['1','1','0']
          assert by['CROSS_LOADING_CANCEL']['three_exact_tetrad_constraints']==['-1','-1','0']
          assert by['CORRELATED_RESIDUAL_METHOD']['full_observable_joint_signature']==by['SECOND_FACTOR_SEMANTIC_ALIAS']['full_observable_joint_signature']
          assert results['new_real_human_E2']==results['new_real_historical_E3']==0
          for filename,key in [('R231_ALL_512_ORIGINAL_CFA_STRUCTURAL_ATOMS.csv','source_sha256'),
                               ('R231_EXACT_RESULTS.json','results_sha256')]:
            assert hashlib.sha256((d/filename).read_bytes()).hexdigest()==machine[key]
          print('R231_ALL_512_CFA_TETRAD_AND_RESIDUAL_ORACLE_FINITE_SOURCES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R231-Eight-Complete-Finite-CFA-Source-Worlds
          path: |
            research/R231/R231_ALL_512_ORIGINAL_CFA_STRUCTURAL_ATOMS.csv
            research/R231/R231_EXACT_RESULTS.json
            research/R231/R231_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Persist complete real source outputs and SHA into main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R231/R231_ALL_512_ORIGINAL_CFA_STRUCTURAL_ATOMS.csv research/R231/R231_EXACT_RESULTS.json research/R231/R231_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R231): complete 512 original CFA atoms and exact tetrad verification'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
