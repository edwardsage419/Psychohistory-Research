name: R245 Exact Finite Renewal Counting and Hidden Gap Dependence
on:
  push:
    paths:
      - 'research/R245/r245_exact_finite_renewal.py'
      - '.github/workflows/r245-exact-renewal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dual-python-renewal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact 4608 source, renewal equation, censored count path and mixture tests
        run: python research/R245/r245_exact_finite_renewal.py --test
  full-original-renewal-archive:
    needs: dual-python-renewal-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all nine-bit sources and independently verify renewal/nonIID evidence
        run: |
          python research/R245/r245_exact_finite_renewal.py --emit
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          from collections import defaultdict
          from fractions import Fraction as F
          d=Path('research/R245')
          rows=list(csv.DictReader((d/'R245_ALL_4608_ORIGINAL_RENEWAL_GAP_SOURCES.csv').open()))
          data=json.loads((d/'R245_EXACT_RESULTS.json').read_text())
          rec=json.loads((d/'R245_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert len(rows)==4608 and len(data['world_results'])==9
          assert data['original_catalogue_id']==rec['original_catalogue_id']=='11-005'
          by={w['world']:w for w in data['world_results']}
          for w,r in by.items():
              rr=[x for x in rows if x['world']==w]
              assert len(rr)==512
              assert all(F(x['original_source_probability'])==F(1,512) for x in rr)
              keys=['oracle_exogenous_U']+['oracle_original_R'+str(j)+i for j in (1,2,3,4) for i in ('1','2')]
              assert len({tuple(x[k] for k in keys) for x in rr})==512
              assert sum((F(x['original_source_probability']) for x in rr),F(0))==1
              assert r['independent_complete_four_gap_joint_normalized']=='1'
              assert r['independent_gap_vector_full_observation_probability_parity']
              assert sum((F(x) for x in r['observed_five_time_count_path_joint'].values()),F(0))==1
              assert r['observed_mean_count_by_time'][0]=='0'
              assert len(r['observed_mean_count_by_time'])==5
              assert all(F(x)>=0 for x in r['observed_mean_count_by_time'])
              source_mean=[sum((F(x['original_source_probability'])*int(x['observed_reported_count_Y'+str(t)]) for x in rr),F(0)) for t in range(5)]
              assert list(map(str,source_mean))==r['observed_mean_count_by_time']
          fair=by['IID_FAIR']
          alias=by['STATIC_HIDDEN_EVENT_SENSOR_ALIAS']
          assert fair['observed_five_time_count_path_joint']==alias['observed_five_time_count_path_joint']
          assert all(x==0 for x in alias['true_hidden_count_at_time4_sourcewise'])
          assert fair['observed_mean_count_by_time'][1]=='1/2'
          assert fair['observed_mean_count_by_time'][2]=='5/4'
          assert by['LATENT_RATE_MIXTURE']['observed_mean_count_by_time'][2]=='21/16'
          assert by['LATENT_RATE_MIXTURE']['oracle_generator_p_W2short_given_W1short']=='5/8'
          assert by['LATENT_RATE_MIXTURE']['oracle_generator_p_W2short_given_W1long']=='3/8'
          assert by['ALTERNATING_RATE']['observed_mean_count_by_time'][2]=='19/16'
          assert by['COMMON_GAP_SHOCK']['observed_mean_count_by_time'][2]=='3/2'
          assert by['DETERMINISTIC_UNIT']['observed_mean_count_by_time'][4]=='4'
          assert by['DETERMINISTIC_TWO']['observed_mean_count_by_time'][4]=='2'
          iid=('IID_FAIR','IID_SHORT_3OF4','IID_LONG_1OF4','DETERMINISTIC_UNIT','DETERMINISTIC_TWO','STATIC_HIDDEN_EVENT_SENSOR_ALIAS')
          for w in iid:
              assert all(x=='0' for x in by[w]['observed_minus_putative_iid_renewal_mean_by_time'])
          for w in ('LATENT_RATE_MIXTURE','ALTERNATING_RATE','COMMON_GAP_SHOCK'):
              assert any(x!='0' for x in by[w]['observed_minus_putative_iid_renewal_mean_by_time'])
          for f,k in [('R245_ALL_4608_ORIGINAL_RENEWAL_GAP_SOURCES.csv','source_sha256'),
                      ('R245_EXACT_RESULTS.json','results_sha256')]:
              assert rec[k]==hashlib.sha256((d/f).read_bytes()).hexdigest()
          assert rec['new_real_human_E2']==rec['new_real_historical_E3']==0
          print('R245_ALL_4608_RENEWAL_NINEBIT_SOURCES_IID_EQUATION_NONIID_ALIASES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R245-All-Nine-Exact-Renewal-Original-Source-Worlds
          path: |
            research/R245/R245_ALL_4608_ORIGINAL_RENEWAL_GAP_SOURCES.csv
            research/R245/R245_EXACT_RESULTS.json
            research/R245/R245_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all 4608 original renewal sources to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R245/R245_ALL_4608_ORIGINAL_RENEWAL_GAP_SOURCES.csv research/R245/R245_EXACT_RESULTS.json research/R245/R245_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R245): all 4608 original renewal gap source atoms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
