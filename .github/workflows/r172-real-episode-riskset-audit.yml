name: R172 Real Event History Episode Risk Set and Censoring Source Gate
on:
  push:
    paths:
      - 'research/R172/r172_real_episode_risk_set_gate.py'
      - '.github/workflows/r172-real-episode-riskset-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-authentic-CC0-historical-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-fetch original-upload Stata file, ingested 1731-row tab and author code
        run: |
          cd research/R172
          python r172_original_event_source_bytes_audit.py
      - name: Reject provenance break and audit real episode risk-set fields
        run: |
          cd research/R172
          python - <<'PY'
          from pathlib import Path
          import json
          doc=json.loads(Path('R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json').read_text())
          assert doc['status']=='OFFICIAL_PUBLISHED_TAB_AND_CODE_AVAILABLE_WITH_PROVENANCE_CAVEAT'
          data=doc['file_records'][0]
          script=doc['file_records'][1]
          assert data['actual_bytes']==428013
          assert data['actual_SHA256']=='ed8e29368d06d0fa6d597df567eb21e7ac27fa849e1cdfd90b76167c8b5778ba'
          assert data['separate_original_upload_format']['matches_metadata_MD5']
          assert data['separate_original_upload_format']['sha256']=='ddca691b25a664ce13ef2471184e3d5ae3ed62cb72521e0593bff770efb0e4e6'
          assert script['actual_SHA256']=='664cf425684b97b8a7bf835ed748955e2e34426e8a14c0db8abbf98a4fb2e3ad'
          print('R172_ORIGINAL_DATA_INTEGRITY_AND_UPLOAD_MD5_VERIFIED')
          PY
          python r172_real_episode_risk_set_gate.py
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('R172_REAL_HISTORICAL_EPISODE_STRUCTURE_AUDIT.json').read_text())
          assert d['rows']==1731
          assert d['episode_id_count']>0
          assert not d['historical_hazard_model_fitted']
          assert not d['person_or_country_event_prediction_scored']
          assert not d['train_and_holdout_protocol_frozen']
          print('R172_RISK_SET_STRUCTURE_INSPECTED_NO_MODEL_SCORED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R172-real-CC0-original-episodes-and-riskset-gate
          path: |
            research/R172/source/
            research/R172/R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json
            research/R172/R172_REAL_HISTORICAL_EPISODE_STRUCTURE_AUDIT.json
          retention-days: 90

  independently-archive-original-CC0-historical-event-bytes:
    needs: inspect-authentic-CC0-historical-episodes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-acquire immutable original data and check three separate source byte identities
        run: |
          cd research/R172
          python r172_original_event_source_bytes_audit.py
          python r172_real_episode_risk_set_gate.py
          echo 'ed8e29368d06d0fa6d597df567eb21e7ac27fa849e1cdfd90b76167c8b5778ba  source/Original_Replication_dataset.tab' | sha256sum -c -
          echo 'ddca691b25a664ce13ef2471184e3d5ae3ed62cb72521e0593bff770efb0e4e6  source/Original_Replication_dataset_as_uploaded.bin' | sha256sum -c -
          echo '664cf425684b97b8a7bf835ed748955e2e34426e8a14c0db8abbf98a4fb2e3ad  source/Original_Replication_code_Stata.do' | sha256sum -c -
          echo '96874989900a9b542b2701ec1110e81ce923d7d0fa452059ac546beffa7ffef2  R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json' | sha256sum -c -
          echo '20ffe5c87416cbf5f9479907e26b5bc256d5c57638f689a1baa0ff4cffb92926  R172_REAL_HISTORICAL_EPISODE_STRUCTURE_AUDIT.json' | sha256sum -c -
      - name: Permanently archive CC0 source original-format bytes, converted table, code and risk-set audits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R172/source/Original_Replication_dataset.tab research/R172/source/Original_Replication_dataset_as_uploaded.bin research/R172/source/Original_Replication_code_Stata.do research/R172/R172_ORIGINAL_EVENT_DATA_BYTE_AUDIT.json research/R172/R172_REAL_HISTORICAL_EPISODE_STRUCTURE_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R172): CC0 original 1731 historical regime years and dataset/file-level source audit'
            git push origin HEAD:main
          fi
