name: R205 Exact Paired PCA 12 Worlds and Independent Target Audit
on:
  push:
    paths:
      - 'research/R205/r205_exact_axis_pca.py'
      - '.github/workflows/r205-exact-axis-pca.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  two-python-finite-pca-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check paired covariance, PCA tie rule and independent future scores
        run: python research/R205/r205_exact_axis_pca.py --test
  all-240-paired-train-and-960-future-source-permanent-archive:
    needs: two-python-finite-pca-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 12 source worlds, 240 ordered original train and 960 independent tests
        run: |
          python research/R205/r205_exact_axis_pca.py --emit
          python - <<'PY'
          import csv,hashlib,json
          from fractions import Fraction
          from pathlib import Path
          d=Path('research/R205')
          r=json.loads((d/'R205_EXACT_RESULTS.json').read_text())
          a=json.loads((d/'R205_FINAL_MACHINE_ACCEPTANCE.json').read_text())
          assert r['source_worlds']==a['worlds']==12
          assert a['full_original_training_histories']==r['full_original_training_histories']==240
          assert a['full_original_train_test_joint_events']==r['full_original_independent_test_source_pairs']==960
          assert r['new_real_human_E2']==r['new_real_historical_E3']==0
          assert r['diagnostics']['isotropic_a1_b1_m5_expected_train_retained_ratio']=='11/16'
          assert r['diagnostics']['isotropic_a1_b1_m5_expected_future_retained_ratio']=='1/2'
          assert r['diagnostics']['a3_b1_m5_future_target2_mse']=='31/64'
          for f,count in [
            ('R205_ALL_240_ORIGINAL_PAIRED_PCA_TRAINING_HISTORIES.csv',240),
            ('R205_ALL_960_INDEPENDENT_TEST_SOURCE_PAIRS.csv',960),
          ]:
            with (d/f).open(newline='') as fin:
              rows=list(csv.DictReader(fin))
            assert len(rows)==count
          for item,key in [
            ('R205_EXACT_RESULTS.json','results_sha256'),
            ('R205_ALL_240_ORIGINAL_PAIRED_PCA_TRAINING_HISTORIES.csv','training_sha256'),
            ('R205_ALL_960_INDEPENDENT_TEST_SOURCE_PAIRS.csv','holdout_sha256'),
          ]:
            assert a[key]==hashlib.sha256((d/item).read_bytes()).hexdigest()
          for world in r['worlds']:
            assert world['training_probability_sum']=='1'
            assert Fraction(world['probability_select_PC_axis1'])+Fraction(world['probability_select_PC_axis2'])==1
            assert Fraction(world['expected_independent_heldout_reconstruction_mse_exact'])>=Fraction(world['population_rank1_reconstruction_oracle_mse_exact'])
          print('R205_ALL_12_WORLDS_240_TRAIN_960_TRUE_INDEPENDENT_PCA_E1_ACCEPTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R205-Exact-PCA-240-Full-Training-960-Future-Events
          path: |
            research/R205/R205_EXACT_RESULTS.json
            research/R205/R205_ALL_240_ORIGINAL_PAIRED_PCA_TRAINING_HISTORIES.csv
            research/R205/R205_ALL_960_INDEPENDENT_TEST_SOURCE_PAIRS.csv
            research/R205/R205_FINAL_MACHINE_ACCEPTANCE.json
          retention-days: 90
      - name: Permanently archive all exact source training and independent future observations on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R205/R205_EXACT_RESULTS.json research/R205/R205_ALL_240_ORIGINAL_PAIRED_PCA_TRAINING_HISTORIES.csv research/R205/R205_ALL_960_INDEPENDENT_TEST_SOURCE_PAIRS.csv research/R205/R205_FINAL_MACHINE_ACCEPTANCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R205): full paired PCA and independent target and reconstruction risks'
            git push origin HEAD:main
          fi
