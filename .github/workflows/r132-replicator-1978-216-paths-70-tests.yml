name: R132 Taylor Jonker 1978 Replicator Verification

on:
  push:
    paths:
      - '.github/workflows/r132-replicator-1978-216-paths-70-tests.yml'
      - 'research/R132/r132_taylor_jonker_1978_replicator_trajectories.py'
      - 'research/R132/test_r132_taylor_jonker_1978_replicator_trajectories.py'
      - 'research/R132/r132_phase_b_ci_attest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all original paper and trajectory tests
        run: |
          PYTHONPATH=research/R132 python -m unittest -v research/R132/test_r132_taylor_jonker_1978_replicator_trajectories.py
      - name: Independent source equation and trajectory replay
        run: |
          PYTHONPATH=research/R132 python research/R132/r132_taylor_jonker_1978_replicator_trajectories.py
      - name: Generate strict Phase B source SHA256 acceptance receipt
        run: |
          PYTHONPATH=research/R132 python research/R132/r132_phase_b_ci_attest.py
      - name: Preserve actual Phase B evidence on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R132/R132_PHASE_B_70_TEST_216_TRAJECTORIES_CI_ACCEPTANCE.json
          git commit -m "results(R132 phase B): 70 tests and 216 analytic RK4 paths verified"
          git pull --rebase origin main
          git push origin HEAD:main
