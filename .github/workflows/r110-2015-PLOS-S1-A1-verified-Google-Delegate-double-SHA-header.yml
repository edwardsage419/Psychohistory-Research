name: R110 A1 genuine 2015 UCL PLOS 120 human S1 original CSV Google delegated SHA twice header only
on:
  push:
    paths:
      - '.github/workflows/r110-2015-PLOS-S1-A1-verified-Google-Delegate-double-SHA-header.yml'
      - 'research/R110/r110_phase_a1_2015_PLOS_S1_verified_google_storage_original_doubleSHA_header_only.py'
      - 'research/R110/test_r110_phase_a1_2015_PLOS_S1_verified_google_storage_original_doubleSHA_header_only.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-source-and-redirect-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Sixteen pure source double SHA and real publisher one-hop delegated host protections
        run: |
          PYTHONPATH=research/R110 python -m unittest -v \
            research/R110/test_r110_phase_a0_2015_bone_UCL_PLOS_s1_original_CSV_delivery_no_body.py \
            research/R110/test_r110_phase_a1_2015_PLOS_S1_verified_google_storage_original_doubleSHA_header_only.py
  independent-genuine-publisher-source-downloads:
    needs: synthetic-source-and-redirect-gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download exact official 2015 PLOS S1 source twice verify entire SHA and only first CSV header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r110_A1
          PYTHONPATH=research/R110 python research/R110/r110_phase_a1_2015_PLOS_S1_verified_google_storage_original_doubleSHA_header_only.py --output /tmp/r110_A1/receipt.json
          python - <<'PY'
          import json,pathlib,re
          x=json.loads(pathlib.Path('/tmp/r110_A1/receipt.json').read_text())
          assert x['status']=='R110_A1_TRUE_PLOS_2015_S1_OFFICIAL_DELEGATED_ORIGINAL_CSV_DOUBLE_SHA_E1'
          assert 10240<=x['original_source_complete_bytes']<=2097152
          assert re.fullmatch('[a-f0-9]{64}',x['project_computed_whole_original_SHA256'])
          assert x['verified_official_A0_observed_delegated_hostname_only']=='storage.googleapis.com'
          assert x['two_separate_official_PLOS_S1_downloads_byte_identical'] is True
          assert x['original_CSV_actor_pair_action_or_round_value_accessed'] is False
          assert x['real_human_model_scores']==0
          print("R110_TRUE_2015_UCL_120PERSON_CANDIDATE_ORIGINAL_SHA_BYTES",x['project_computed_whole_original_SHA256'],x['original_source_complete_bytes'],x['source_physical_CSV_data_lines_no_behavior_values_read'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r110-2015-original-PLOS-S1-source-double-whole-SHA-header-E1
          path: /tmp/r110_A1/receipt.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Permanently archive only verified whole-source original SHA and header stats or safe failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/r110_A1/receipt.json
          dst=research/R110/R110_PHASE_A1_LIVE_CI_2015_PLOS_PUBLISHED_S1_CSV_DOUBLE_SHA_HEADER_E1.json
          test -f "$src"
          python - <<'PY'
          import json,pathlib,re
          x=json.loads(pathlib.Path('/tmp/r110_A1/receipt.json').read_text())
          assert x['research_id']=='R110' and x['phase']=='A1' and x['PESEN_v0_1']=='FROZEN'
          assert x['real_human_model_scores']==0
          assert x['status'] in ('R110_A1_FIRSTPARTY_PUBLISHED_S1_SOURCE_NOT_AUTHENTICATED','R110_A1_TRUE_PLOS_2015_S1_OFFICIAL_DELEGATED_ORIGINAL_CSV_DOUBLE_SHA_E1')
          fields={'research_id','phase','status','safe_failure','paper_DOI','publisher_supplement_DOI','original_source_complete_bytes','project_computed_whole_original_SHA256','publisher_MD5_independently_published_and_verified','source_S1_first_CSV_header_column_count','source_header_blank_column_count','source_header_duplicate_column_count','source_header_nonASCII_or_control_name_count','source_maximum_CSV_header_name_length','source_physical_CSV_data_lines_no_behavior_values_read','verified_official_A0_observed_delegated_hostname_only','original_CSV_actor_pair_action_or_round_value_accessed','real_human_model_scores','PESEN_v0_1','two_separate_official_PLOS_S1_downloads_byte_identical'}
          assert set(x).issubset(fields)
          if 'project_computed_whole_original_SHA256' in x:
            assert re.fullmatch('[a-f0-9]{64}',x['project_computed_whole_original_SHA256'])
            assert x['two_separate_official_PLOS_S1_downloads_byte_identical'] is True
            assert x['original_CSV_actor_pair_action_or_round_value_accessed'] is False
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$src" "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "receipt(R110 A1): actual PLOS 2015 120-human UCL source publisher Google delegated full double SHA CSV header only or bounded failure"
          git pull --rebase origin main
          git push origin HEAD:main
