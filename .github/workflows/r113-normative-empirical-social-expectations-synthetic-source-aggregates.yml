name: R113 first-party social expectations table arithmetic and synthetic identification

on:
  push:
    paths:
      - '.github/workflows/r113-normative-empirical-social-expectations-synthetic-source-aggregates.yml'
      - 'research/R113/r113_social_norm_expectations_identifiability.py'
      - 'research/R113/test_r113_social_norm_expectations_identifiability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r113-original-published-summary-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit fixed published Table 2 percentage arithmetic and independent synthetic counterexamples
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R113 python -m unittest -v \
            research/R113/test_r113_social_norm_expectations_identifiability.py 2>&1 | tee /tmp/r113_test_result.txt
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r113_test_result.txt').read_text()
          counts=re.findall(r'Ran (\d+) tests? in',log)
          assert counts==['25'],('R113_EXPECT_25_TRUE_TESTS',counts)
          assert re.search(r'\nOK\s*$',log),'R113_SYNTHETIC_AND_SOURCE_TABLE_TESTS_NOT_OK'
          print('R113_25_REAL_CI_UNIT_TESTS_PASSED')
          PY
      - name: Generate machine-evidenced published aggregation audit and research source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r113
          PYTHONPATH=research/R113 python - <<'PY'
          import hashlib,json,pathlib
          import r113_social_norm_expectations_identifiability as model
          base=pathlib.Path('research/R113')
          included=['r113_social_norm_expectations_identifiability.py',
                    'test_r113_social_norm_expectations_identifiability.py',
                    'R113_FIRST_PARTY_BICCHIERI_SOCIAL_EXPECTATIONS_BOUNDED_MECHANISM_SCIENTIFIC_REPORT_2026-10-19.md']
          sha={name:hashlib.sha256((base/name).read_bytes()).hexdigest() for name in included}
          table=model.published_table_2_arithmetic()
          equiv=model.observational_equivalence_counterexample()
          contrast=model.isolated_expectation_manipulation()
          assert table['empirical_minus_behavior_percentage_points']==[0,16,-16]
          assert table['normative_minus_personal_ought_percentage_points']==[0,-12,27]
          assert table['sum_personal_normative_judgment_percent']==174
          assert table['sum_normative_expectation_judgment_percent']==189
          assert equiv['unconditional_world']['observed_action']==equiv['conditional_world']['observed_action']
          assert equiv['unconditional_world']['intervened_action']!=equiv['conditional_world']['intervened_action']
          receipt={
            "research_id":"R113","phase":"A",
            "status":"R113_FIRSTPARTY_PUBLISHED_AGGREGATE_ARITHMETIC_AND_25_SYNTHETIC_CHECKS_PASS",
            "candidate_catalog_id":"03-007","priority":"P0",
            "published_primary_source_DOI":"10.3389/fpsyg.2014.01418",
            "cited_human_results_source":"2014 primary-author paper Table 2 quoting prior Bicchieri and Chavez 2013, only rounded public aggregates",
            "source_author_2017_OUP_chapter_abstract_only":True,
            "source_author_2009_Wiley_study_abstract_and_2014_own_review_only":True,
            "original_individual_experiment_human_records_obtained":False,
            "published_aggregate_difference_arithmetic":table,
            "synthetic_identification_counterexample":equiv,
            "synthetic_separate_expectation_contrasts":contrast,
            "synthetic_actual_ci_test_count":25,"synthetic_test_failures":0,
            "new_individual_human_E2_reanalysis_scores":0,
            "author_behavioral_equations_fitted":False,
            "causal_norm_conclusion_from_this_analysis":False,
            "source_and_test_file_SHA256":sha,
            "R073":"FROZEN","PESEN_v0_1":"FROZEN"
          }
          dest=base/'R113_PHASE_A_AGGREGATE_AND_SYNTHETIC_VERIFIED_ACCEPTANCE.json'
          dest.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R113_SOURCE_AGGREGATE_ARITHMETIC_CONFIRMED')
          PY
      - name: Commit only aggregate mathematical audit receipt, never person data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R113/R113_PHASE_A_AGGREGATE_AND_SYNTHETIC_VERIFIED_ACCEPTANCE.json
          git commit -m "results(R113): 25 synthetic cases and bounded first-party 2014 aggregate table arithmetic"
          git pull --rebase origin main
          git push origin HEAD:main
