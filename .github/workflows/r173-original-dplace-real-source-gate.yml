name: R173 Actual D-PLACE Ethnographic Atlas Source Audit
on:
  push:
    paths:
      - 'research/R173/r173_original_dplace_source_audit.py'
      - '.github/workflows/r173-original-dplace-real-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  authentic-CCBY-ethnographic-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-audit Python blob identity
        run: |
          cd research/R173
          test "$(git hash-object r173_original_dplace_source_audit.py)" = "d0b546c458ff1448b84d5cee3c1f586ad339dd6d"
          sha256sum r173_original_dplace_source_audit.py
      - name: Fetch and verify 6 CC-BY original D-PLACE EA/SCCS files from pinned Git commit
        run: |
          cd research/R173
          python r173_original_dplace_source_audit.py --fetch
          python r173_original_dplace_source_audit.py --audit-and-archive
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('R173_ORIGINAL_DPLACE_EA_SCCS_SOURCE_AUDIT.json').read_text())
          assert d['source_pinned_commit']=='9bfed2c8c206be00f55f71516f262bbca2234e5a'
          assert len(d['raw_authenticated_sources'])==6
          assert d['EA_society_distinct_IDs']>1200
          assert d['EA_data_rows']>10000
          assert d['EA_mapping_entries_explicitly_referencing_SCCS']==186
          assert not d['original_real_cross_societal_association_scored']
          assert not d['independent_historical_or_behavioral_prediction_scored']
          assert d['new_E2_predictions']==0 and d['new_E3_predictions']==0
          print('R173_SOURCE_AUTHENTICATED_NO_CORRELATION_CLAIMS')
          PY
          echo '040869341f1865f088a6776c5e676ea3ea26b1231b0ed2283f701a40fb967536  R173_ORIGINAL_DPLACE_EA_SCCS_SOURCE_AUDIT.json' | sha256sum -c -
          echo 'ff83a0229b4903a246319718a3dfb73f5416dc6e568e42c9f18be3b4ad5c2a03  R173_First_Hand_DPLACE_Original_EA_SCCS_Source_Audit.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: R173-authentic-original-CCBY-EA-SCCS-source
          path: |
            research/R173/R173_ORIGINAL_DPLACE_EA_SCCS_SOURCE_AUDIT.json
            research/R173/R173_First_Hand_DPLACE_Original_EA_SCCS_Source_Audit.zip
          retention-days: 90

  independently-publish-immutable-CCBY-source-audit:
    needs: authentic-CCBY-ethnographic-source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently refetch raw six original D-PLACE files and verify all Git source IDs
        run: |
          cd research/R173
          python r173_original_dplace_source_audit.py --fetch
          python r173_original_dplace_source_audit.py --audit-and-archive
          echo '040869341f1865f088a6776c5e676ea3ea26b1231b0ed2283f701a40fb967536  R173_ORIGINAL_DPLACE_EA_SCCS_SOURCE_AUDIT.json' | sha256sum -c -
          echo 'ff83a0229b4903a246319718a3dfb73f5416dc6e568e42c9f18be3b4ad5c2a03  R173_First_Hand_DPLACE_Original_EA_SCCS_Source_Audit.zip' | sha256sum -c -
      - name: Permanently archive original research sources and structured metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R173/R173_ORIGINAL_DPLACE_EA_SCCS_SOURCE_AUDIT.json research/R173/R173_First_Hand_DPLACE_Original_EA_SCCS_Source_Audit.zip
          if ! git diff --cached --quiet; then
            git commit -m 'archive(R173): authenticate original 121354 EA cultural rows and 186 SCCS mappings, no model score'
            git push origin HEAD:main
          fi
