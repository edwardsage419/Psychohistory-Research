name: R272 full-checkout unadopted-candidate integrity qualification

on:
  push:
    paths:
      - '.github/workflows/r272-full-checkout-unadopted-candidate-20261117.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-checkout-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute archived candidate in actual full read-only checkout
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          python --version
          python -B -I -S research/validation/r272_single_entrypoint_failclosed_20261102.py --root . \
            > "$RUNNER_TEMP/r272-candidate.json"
          python -I -S - "$RUNNER_TEMP/r272-candidate.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as h: obj=json.load(h)
          def gate(test,code):
              if test is not True:
                  raise SystemExit("R272_FULL_CHECKOUT_FAIL_CLOSED_"+code)
          gate(obj.get("status")=="PASS","STATUS")
          gate(obj.get("scope")=="INTERNAL_NONBLIND_ARTIFICIAL_E1","SCOPE")
          gate(obj.get("workflow_adopted") is False,"NOT_PRODUCTION")
          gate(obj.get("actions_executed") is False,"NESTED_CI_CLAIM")
          gate(obj.get("archive_bytes_preserved") is True,"ARCHIVE_INTEGRITY")
          observed=obj.get("modes",[])
          gate(len(observed)==3,"THREE_MODES")
          for i,(mode,item) in enumerate(zip(("normal","optimized","double_optimized"),observed)):
              gate(item.get("mode")==mode,"MODE_"+str(i))
              gate(item.get("preimage")=="PASS","PREIMAGE_"+str(i))
              gate(item.get("isolated_regeneration")=="PASS","REGEN_"+str(i))
              gate(item.get("native_negatives")==15,"MUTATIONS_"+str(i))
              gate(item.get("original_tests_exit")==0,"NATIVE_83_"+str(i))
          print("R272_FULL_CHECKOUT_CANDIDATE_THREE_MODES_PASS")
          PY
      - name: Verify no tracked or untracked local science evidence modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git diff --cached --exit-code
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            git status --short
            exit 1
          fi
          echo 'R272_CHECKOUT_ARCHIVES_REMAIN_UNMODIFIED'

  actual-candidate-import-shadow-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce unisolated import shadow with EXACT archived candidate copy
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/r272-shadow"
          cp research/validation/r272_single_entrypoint_failclosed_20261102.py "$RUNNER_TEMP/r272-shadow/candidate.py"
          cat > "$RUNNER_TEMP/r272-shadow/json.py" <<'PY'
          print("R272_SYNTHETIC_JSON_MODULE_PRECHECK_EXIT")
          raise SystemExit(0)
          PY
          python "$RUNNER_TEMP/r272-shadow/candidate.py" --selftest \
            > "$RUNNER_TEMP/shadow-unisolated.log"
          grep -Fx "R272_SYNTHETIC_JSON_MODULE_PRECHECK_EXIT" "$RUNNER_TEMP/shadow-unisolated.log"
          if grep -q '"status": "PASS"' "$RUNNER_TEMP/shadow-unisolated.log"; then
            echo "R272_SHADOW_TEST_UNEXPECTED_NATIVE_AUDIT"
            exit 1
          fi
          python -I -S "$RUNNER_TEMP/r272-shadow/candidate.py" --selftest \
            > "$RUNNER_TEMP/shadow-isolated.log"
          python -I -S - "$RUNNER_TEMP/shadow-isolated.log" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as h: d=json.load(h)
          if d.get("status")!="PASS" or d.get("negative_controls_rejected")!=5:
              raise SystemExit("R272_ISOLATED_ENTRY_SELFTEST_FAIL")
          print("R272_ACTUAL_SOURCE_IMPORT_SHADOW_REPRODUCED_AND_BLOCKED_FOR_PARENT")
          PY
      - name: Prove full R272 false-PASS under unpinned import shadow in disposable checkout
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/r272-forgery" <<'PY'
          import pathlib,shutil,sys
          root=pathlib.Path(sys.argv[1])
          tracked=[
              "research/validation/r272_preimage_first_readonly_gate_20261102.py",
              "research/validation/r272_pinned_native_replay_and_preimage_negative_20261102.py",
              "research/validation/R272_P0_FAILCLOSED_CANDIDATE_20261102.zip",
              "research/R272/r272_exact_train_test_prediction.py",
              "research/R272/R272_ALL_576_ORIGINAL_TRAIN_AND_TEST_SOURCES.csv",
              "research/R272/R272_EXACT_RESULTS.json",
              "research/R272/R272_MACHINE_RECEIPT.json",
              "protocols/R272_OUT_OF_SAMPLE_9_BERNOULLI_WORLDS_576_FULL_SOURCE_PRESCORE_FREEZE_2026-10-23.md",
          ]
          for name in tracked:
              dst=root/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(name,dst)
          validation_shadow = """
          import sys
          if "r272_preimage_first_readonly_gate_" in sys.argv[0]:
              print('{"status":"PASS","checked_archived_preimage":true,"isolated_regeneration_compared":true,"original_archives_untouched":true,"scientific":{"status":"PASS","rows":576}}')
          elif "r272_pinned_native_replay_" in sys.argv[0]:
              print('{"status":"PASS","negative_rejections_total":15,"preimage_corruption_rejected_before_emit":true,"same_corruption_masked_by_original_emit_then_accepted":true}')
          else:
              raise SystemExit("unexpected target")
          raise SystemExit(0)
          """
          generator_shadow = """
          import sys
          print("Ran 83 tests in 0.001s",file=sys.stderr)
          raise SystemExit(0)
          """
          (root/"research/validation/json.py").write_text(validation_shadow,encoding="utf-8")
          (root/"research/R272/json.py").write_text(generator_shadow,encoding="utf-8")
          print("R272_DISPOSABLE_TREE_COPIED_WITH_IDENTICAL_FROZEN_FILES")
          PY
          python -B -I -S research/validation/r272_single_entrypoint_failclosed_20261102.py \
            --root "$RUNNER_TEMP/r272-forgery" > "$RUNNER_TEMP/r272-forged-accepted.json"
          python -I -S - "$RUNNER_TEMP/r272-forged-accepted.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as h: d=json.load(h)
          if d.get("status")!="PASS" or d.get("archive_bytes_preserved") is not True:
              raise SystemExit("R272_FAILED_TO_REPRODUCE_FALSE_PASS")
          if len(d.get("modes",[]))!=3 or any(x.get("native_negatives")!=15 for x in d["modes"]):
              raise SystemExit("R272_FORGED_MODE_RECEIPT_MISMATCH")
          print("R272_UNPINNED_SIBLING_IMPORTS_CAUSE_FULL_FALSE_ACCEPTANCE")
          PY
          # This is a deliberate negative result. It is a release blocker,
          # never an endorsement of the current unadopted candidate.
      - name: Enforce candidate is not installed as active production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'r272_single_entrypoint_failclosed_20261102.py' \
            .github/workflows/r272-exact-train-test-oos-e1.yml; then
            echo 'R272_PRODUCTION_ALREADY_CHANGED_RECHECK_REQUIRED'
            exit 1
          fi
          echo 'R272_UNSAFE_OLD_PRODUCTION_STILL_PRESENT_AND_NOT_ACTIVATED'
