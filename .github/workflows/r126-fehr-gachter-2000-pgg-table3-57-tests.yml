name: R126 Fehr Gachter 2000 authentic PGG contribution and nonlinear punishment Table3

on:
  push:
    paths:
      - '.github/workflows/r126-fehr-gachter-2000-pgg-table3-57-tests.yml'
      - 'research/R126/r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact.py'
      - 'research/R126/test_r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-source-pgg-payoff-table3-exact-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execute real 57 paper-source payoff punishment and aggregate tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R126 python -m unittest -v \
            research/R126/test_r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact.py \
            2>&1 | tee /tmp/r126_genuine_unit_tests.log
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path('/tmp/r126_genuine_unit_tests.log').read_text()
          assert re.findall(r'Ran (\d+) tests? in',log)==['57'],('R126_ACTUAL_UNIT_TEST_COUNT_NOT_57',log[-1800:])
          assert re.search(r'\nOK\s*$',log),'R126_SOME_UNIT_TESTS_FAILED'
          print('R126_REAL_57_TESTS_PASS')
          PY
      - name: Independent second full 52500 synthetic deviations and published source Table3 numerical replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/R126 python - <<'PY'
          from fractions import Fraction as F
          import hashlib,json,pathlib
          import r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact as m

          exact=m.project_frozen_exact_cases()
          assert exact['all_zero_stage1_group']=='80'
          assert exact['all_twenty_stage1_group']=='128'
          assert exact['three_twenty_one_zero_stage1']==('24','24','24','44')
          assert exact['three_twenty_one_zero_group_stage1']=='116'
          assert exact['one_and_two_points_sent_stage2_net']==('23','22','24','154/5')
          assert exact['one_and_two_points_sent_stage2_group']=='499/5'
          assert exact['saturated_6_7_10_points_received_total']==23
          assert exact['saturated_effective_received']==10
          assert exact['saturated_sender_costs_total']=='58'
          assert exact['saturated_target_payoff']=='0'
          assert exact['saturated_group_net_surplus']=='14'
          assert exact['private_single_token_marginal']=='-3/5'
          assert exact['group_single_token_marginal']=='3/5'

          original=m.printed_table3_audit()
          assert original['table_sessions_printed_1_decimal']=={
              '1':['27/10','109/10','13/10','49/5'],
              '2':['4','129/10','23/10','143/10'],
              '3':['9/2','107/10','2','131/10'],
          }
          assert original['source_published_Mean_row']==('37/10','23/2','19/10','123/10')
          assert original['independent_equal_session_average_of_PRINTED_rows']==(
              '56/15','23/2','28/15','62/5')
          assert original['last_punishment_published_Mean_minus_equal_average_PRINTED_rows']=='-1/10'
          assert original['last_punishment_printed_row_mean_discrepancy_unresolved']
          assert original['not_a_reproduction_of_original_Wilcoxon_p_value']
          assert original['source_human_subjects_reported_by_authors_not_loaded_as_microdata']==112
          assert original['individual_level_E2_scores']==0
          assert original['published_overall_punishment_contribution_fraction_endowment']=='23/40'
          assert original['published_overall_no_punishment_contribution_fraction_endowment']=='37/200'

          exhaustive=m.exhaustive_mathematical_incentives()
          assert exhaustive['purely_mathematical_contribution_profiles']==625
          assert exhaustive['player_specific_0_to20_deviation_checks']==52500
          assert exhaustive['actual_original_person_records_read']==0
          assert tuple(m.PUNISHMENT_COST)==(0,1,2,4,6,9,12,16,20,25,30)

          source=pathlib.Path('research/R126')
          names=[
              'r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact.py',
              'test_r126_fehr_gachter_2000_pgg_payoffs_punishment_table3_exact.py',
              'R126_FEHR_GAECHTER_2000_ORIGINAL_PGG_COSTLY_PUNISHMENT_TABLE3_SCIENTIFIC_REPORT_2026-10-20.md'
          ]
          checksums={name:hashlib.sha256((source/name).read_bytes()).hexdigest() for name in names}
          receipt={
              'research_id':'R126','phase':'A',
              'status':'R126_FEHR_GAECHTER_2000_ORIGINAL_PGG_NONLINEAR_PUNISHMENT_57_TEST_52500_MATH_PASS',
              'catalogue_id':'05-002','priority':'P0',
              'primary_original_article_DOI':'10.1257/aer.90.4.980',
              'primary_original_author_article_source':'https://web.mit.edu/14.193/www/Coop_PunAER.pdf',
              'actual_source_printed_pages_visually_reviewed':[981,982,983,984,985],
              'source_eq1_four_player_endowment_20_per_capita_2_over_5':True,
              'original_source_table2_eleven_nonlinear_cost_levels':list(m.PUNISHMENT_COST),
              'original_2000_source_based_exact_math_cases':exact,
              'original_author_published_aggregates_NOT_raw_microdata':original,
              'independent_two_profit_check_algorithms':[
                  'four individual eq1/eq2 payoffs summed',
                  'independent whole-group contribution surplus minus receiver fractional deductions and all senders costs'
              ],
              'synthetic_625_profiles_52500_best_response_exact_deviations':exhaustive,
              'original_author_individual_level_2000_experiment_data_read':False,
              'original_author_public_Table3_aggregates_checked':True,
              'original_2000_Mean_row_last_punishment_vs_displayed_session_average_difference_unresolved':True,
              'prior_R105_CPR_true_3708_E2_scores_not_recounted_in_R126':True,
              'real_human_E2_prediction_scores_new':0,
              'original_author_Wilcoxon_statistics_independently_reestimated':False,
              'causal_psychological_punishment_motivation_identified_by_new_data':False,
              'synthetic_unit_tests_executed':57,'unit_test_failures':0,
              'source_test_scientific_report_SHA256':checksums,
              'R073':'FROZEN','PESEN_v0_1':'FROZEN'
          }
          out=source/'R126_PHASE_A_FEHR_GAECHTER_57_TEST_52500_DEVIATION_SOURCE_AGGREGATE_CI_ACCEPTANCE.json'
          out.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R126_MACHINE_CI_SOURCE_SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Commit factual source and synthetic maths receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R126/R126_PHASE_A_FEHR_GAECHTER_57_TEST_52500_DEVIATION_SOURCE_AGGREGATE_CI_ACCEPTANCE.json
          git commit -m "results(R126): original 2000 PGG payoffs 57 tests and 52500 synthetic deviations verified"
          git pull --rebase origin main
          git push origin HEAD:main
