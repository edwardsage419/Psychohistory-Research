name: R067 original R047 source and binary payoff applicability

on:
  push:
    paths:
      - 'research/R067/r067_real_source_applicability.py'
      - 'research/R067/test_r067_real_source_applicability.py'
      - '.github/workflows/r067-r047-data-applicability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject corrupted Git blob, fabricated payoff equivalence and invalid rows
        working-directory: research/R067
        run: python -m unittest -v test_r067_real_source_applicability

  real-r047-and-dryad-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download only immutable original R047 author data and payoff theory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r067_r047_raw /tmp/r067_r047_aggregate
          python - <<'PY'
          from pathlib import Path
          from urllib import request
          base="https://raw.githubusercontent.com/lrdegeest/InequalityCPR/1142b0915a0a46e72264358378b3535948f6b2b4/"
          for remote,local in (("data/data.csv","source.csv"),("theory_payoffs.R","source_theory.R")):
              req=request.Request(base+remote,headers={"User-Agent":"R067-hash-pinned-real-source-audit/1.0"})
              with request.urlopen(req,timeout=20) as res: raw=res.read(300001)
              if len(raw)>300000: raise ValueError("original public source too large")
              (Path("/tmp/r067_r047_raw")/local).write_bytes(raw)
          PY
      - name: Validate 2048 raw rows, 128 persons, 32 groups and multivalued extraction
        shell: bash
        run: |
          set -euo pipefail
          python research/R067/r067_real_source_applicability.py \
            --r047-csv /tmp/r067_r047_raw/source.csv \
            --theory /tmp/r067_r047_raw/source_theory.R \
            --output /tmp/r067_r047_aggregate/anonymous_applicability.json
      - name: Archive no individual rows, only source and applicability verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r067-r047-original-source-nonbinary-audit
          path: /tmp/r067_r047_aggregate/anonymous_applicability.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Destroy all original individual rows
        if: always()
        shell: bash
        run: rm -rf /tmp/r067_r047_raw /tmp/r067_r047_aggregate
