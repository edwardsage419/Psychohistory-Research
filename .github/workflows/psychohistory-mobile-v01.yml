name: Psychohistory Mobile v0.1 engineering verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'platform/mobile/**'
      - 'platform/future_model/src/psychohistory/decision_*.py'
      - 'platform/future_model/tests/test_decision_*.py'
      - '.github/workflows/psychohistory-mobile-v01.yml'

permissions:
  contents: read

concurrency:
  group: psychohistory-mobile-v01-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mobile-engineering:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            browser: chromium
          - runner: macos-15
            browser: webkit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: platform/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install pinned development verification tools
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          python -m pip install --requirement ../future_model/requirements.lock
          npm install --prefix "$RUNNER_TEMP/mobile-browser" --no-save --no-audit --no-fund playwright@1.62.1
          browser_root="$RUNNER_TEMP/mobile-browser/node_modules/playwright"
          if [[ "$MOBILE_BROWSER" == chromium ]]; then
            node "$browser_root/cli.js" install --with-deps chromium
          else
            node "$browser_root/cli.js" install chromium webkit
          fi
          echo "PLAYWRIGHT_MODULE=$browser_root/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM_BIN=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$browser_root")" >> "$GITHUB_ENV"
      - name: Verify contract, build, math, packaging and local storage
        run: |
          set -euo pipefail
          python scripts/export-contract.py --check
          npm run build
          npm test
      - name: Compare fixed Python engine with Node and the browser bundle
        env:
          MOBILE_PARITY_BROWSER: ${{ matrix.browser }}
        run: python scripts/verify-parity.py
      - name: Exercise the installed offline workbench in a real browser
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
        run: node tests/workbench.browser.mjs
